name: KONTUR Game Companion candidate envelope validation

on:
  pull_request:
    paths:
      - 'pilots/kontur-game-companion/**'
      - '.github/workflows/kontur-game-companion-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-candidate-envelope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate candidate policy-request envelope generator
        run: python pilots/kontur-game-companion/candidate-envelope/validate.py
