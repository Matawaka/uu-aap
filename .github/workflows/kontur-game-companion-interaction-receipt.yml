name: KONTUR Game Companion interaction receipt validation

on:
  pull_request:
    paths:
      - 'pilots/kontur-game-companion/interaction-receipt/**'
      - '.github/workflows/kontur-game-companion-interaction-receipt.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate interaction receipt
        run: python pilots/kontur-game-companion/interaction-receipt/validate.py
