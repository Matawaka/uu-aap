name: IAL responsibility handoff validation

on:
  pull_request:
    paths:
      - "protocols/ial/**"
      - "protocols/attestation/**"
      - "protocols/registry/**"
      - "proposals/ccrp/**"
      - "proposals/poai/authority/**"
      - "proposals/poai/materialization/**"
      - ".github/workflows/ial-responsibility-handoff-validation.yml"
  push:
    branches:
      - main
    paths:
      - "protocols/ial/**"
      - "protocols/attestation/**"
      - "protocols/registry/**"
      - "proposals/ccrp/**"
      - "proposals/poai/authority/**"
      - "proposals/poai/materialization/**"
      - ".github/workflows/ial-responsibility-handoff-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ial-responsibility-handoff:
    name: IAL responsibility handoff validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with immutable tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema>=4.22,<5"

      - name: Validate upstream protocol registry bindings
        run: node protocols/registry/v0.1/validate-registry.js

      - name: Check IAL JavaScript
        run: |
          node --check protocols/ial/v0.1/evaluate-handoff.js
          node --check protocols/ial/v0.1/test-ial.js

      - name: Validate IAL example schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('protocols/ial/v0.1')
          pairs = [
              ('boundary-assessment.schema.json', 'examples/e0-internal.boundary-assessment.json'),
              ('boundary-assessment.schema.json', 'examples/e2-handoff.boundary-assessment.json'),
              ('elevation-receipt.schema.json', 'examples/e2-handoff.elevation-receipt.json'),
              ('responsibility-assignment.schema.json', 'examples/e2-handoff.current-responsibility-assignment.json'),
              ('responsibility-handoff-offer.schema.json', 'examples/e2-handoff.offer.json'),
              ('responsibility-handoff-acceptance.schema.json', 'examples/e2-handoff.acceptance.json'),
          ]

          for schema_name, fixture_name in pairs:
              schema = json.loads((root / schema_name).read_text(encoding='utf-8'))
              fixture = json.loads((root / fixture_name).read_text(encoding='utf-8'))
              Draft202012Validator.check_schema(schema)
              Draft202012Validator(schema).validate(fixture)
              print(f'VALID IAL schema vector: {fixture_name}')

          result_schema = json.loads((root / 'responsibility-handoff-result.schema.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(result_schema)
          print('VALID IAL result schema')
          PY

      - name: Run IAL responsibility boundary and handoff vectors
        run: node protocols/ial/v0.1/test-ial.js /tmp/ial-e2-handoff-result.json

      - name: Validate reproduced E2 handoff result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path('protocols/ial/v0.1/responsibility-handoff-result.schema.json').read_text(encoding='utf-8'))
          result = json.loads(Path('/tmp/ial-e2-handoff-result.json').read_text(encoding='utf-8'))
          Draft202012Validator(schema).validate(result)

          assert result['status'] == 'accepted'
          claims = result['claims']
          assert claims['capability_attestation_verified'] is True
          assert claims['responsibility_transfer_established'] is True
          assert claims['responsibility_accepted'] is True
          for key in [
              'authority_established',
              'context_admission_established',
              'execution_admitted',
              'materialization_permitted',
              'commit_performed',
              'outcome_observed',
              'canonical_state_established',
              'poai_v_conformance_established',
          ]:
              assert claims[key] is False, key

          print('IAL E2 handoff accepted while stronger execution/materialization/outcome boundaries remain false')
          PY

      - name: Confirm IAL validation performs no working-tree mutation
        run: git diff --exit-code
