name: KONTUR PCL Progress Visibility v0.1
on:
  pull_request:
    paths:
      - 'pilots/kontur-game-companion/pcl-progress-visibility/**'
      - '.github/workflows/kontur-pcl-progress-visibility-v0.1.yml'
  push:
    branches: [main]
    paths:
      - 'pilots/kontur-game-companion/pcl-progress-visibility/**'
      - '.github/workflows/kontur-pcl-progress-visibility-v0.1.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check pilots/kontur-game-companion/pcl-progress-visibility/adapter.js
      - run: node pilots/kontur-game-companion/pcl-progress-visibility/test-adapter.js
      - run: node protocols/experimental/perceived-causal-liveness/v0.1/test-progress.js
      - run: node protocols/experimental/perceived-causal-liveness/v0.1/test-human-view.js
      - run: test -z "$(git status --porcelain)"
