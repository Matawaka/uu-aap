name: KONTUR Game Companion response dispatch gate validation

on:
  pull_request:
    paths:
      - 'pilots/kontur-game-companion/response-dispatch-gate/**'
      - '.github/workflows/kontur-game-companion-response-dispatch-gate.yml'
      - '.github/workflows/kontur-game-companion-chain-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-response-dispatch-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate synthetic response dispatch gate
        run: python pilots/kontur-game-companion/response-dispatch-gate/validate.py
