name: FCL Current-State Request Evaluation Gate v0.1 validation

on:
  pull_request:
    paths:
      - 'protocols/fcl/v0.1/request-evaluation/**'
      - 'protocols/fcl/v0.1/control-request/**'
      - 'protocols/fcl/v0.1/runtime-ui/**'
      - 'protocols/fcl/v0.1/handoff/**'
      - 'protocols/fcl/v0.1/delivery/**'
      - 'protocols/fcl/v0.1/progress/**'
      - 'protocols/fcl/v0.1/fcl.js'
      - 'protocols/fcl/v0.1/test-fcl.js'
      - '.github/workflows/fcl-current-state-request-evaluation-v0.1-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'protocols/fcl/v0.1/request-evaluation/**'
      - 'protocols/fcl/v0.1/control-request/**'
      - 'protocols/fcl/v0.1/runtime-ui/**'
      - 'protocols/fcl/v0.1/handoff/**'
      - 'protocols/fcl/v0.1/delivery/**'
      - 'protocols/fcl/v0.1/progress/**'
      - 'protocols/fcl/v0.1/fcl.js'
      - 'protocols/fcl/v0.1/test-fcl.js'
      - '.github/workflows/fcl-current-state-request-evaluation-v0.1-validation.yml'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Re-run base FCL v0.1 conformance
        run: node protocols/fcl/v0.1/test-fcl.js
      - name: Re-run Progress Chain v0.1 conformance
        run: node protocols/fcl/v0.1/progress/test-progress-chain.js
      - name: Re-run Projection Delivery v0.1 conformance
        run: node protocols/fcl/v0.1/delivery/test-delivery.js
      - name: Re-run Successor UI Handoff v0.1 conformance
        run: node protocols/fcl/v0.1/handoff/test-handoff.js
      - name: Re-run Runtime UI Adapter v0.1 conformance
        run: node protocols/fcl/v0.1/runtime-ui/test-runtime-ui.js
      - name: Re-run User Control Request v0.1 conformance
        run: node protocols/fcl/v0.1/control-request/test-control-request.js
      - name: Run Current-State Request Evaluation Gate v0.1 conformance
        run: node protocols/fcl/v0.1/request-evaluation/test-request-evaluation.js
