name: CommitReceipt execution validation

on:
  pull_request:
    paths:
      - "protocols/integration/**"
      - "protocols/ial/**"
      - "protocols/attestation/**"
      - "protocols/registry/**"
      - "proposals/ccrp/**"
      - "proposals/poai/authority/**"
      - "proposals/poai/materialization/**"
      - ".github/workflows/commit-receipt-validation.yml"
  push:
    branches:
      - main
    paths:
      - "protocols/integration/**"
      - "protocols/ial/**"
      - "protocols/attestation/**"
      - "protocols/registry/**"
      - "proposals/ccrp/**"
      - "proposals/poai/authority/**"
      - "proposals/poai/materialization/**"
      - ".github/workflows/commit-receipt-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-receipt:
    name: CommitReceipt execution validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with immutable tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema>=4.22,<5"

      - name: Validate upstream protocol registry
        run: node protocols/registry/v0.1/validate-registry.js

      - name: Check CommitReceipt JavaScript
        run: |
          node --check protocols/integration/v0.1/record-commit-receipt.js
          node --check protocols/integration/v0.1/test-commit-receipt.js

      - name: Validate CommitReceipt schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path('protocols/integration/v0.1/commit-receipt.schema.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          print('VALID schema: commit-receipt.schema.json')
          PY

      - name: Reproduce approved decision then perform ephemeral Git commit transition
        run: |
          node protocols/integration/v0.1/test-commit-receipt.js \
            /tmp/commit-receipt.json \
            /tmp/commit-receipt-decision.json \
            /tmp/commit-receipt-decision-input.json \
            /tmp/commit-receipt-revalidation.json

      - name: Validate reproduced CommitReceipt and assurance boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          root = Path('protocols/integration/v0.1')
          schema = json.loads((root / 'commit-receipt.schema.json').read_text(encoding='utf-8'))
          receipt = json.loads(Path('/tmp/commit-receipt.json').read_text(encoding='utf-8'))
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(receipt)

          assert receipt['execution_mode'] == 'ephemeral_local_git_object'
          assert receipt['successor']['parent_commit_sha'] == receipt['predecessor']['commit_sha']
          assert receipt['successor']['tree_sha'] != receipt['predecessor']['tree_sha']
          assert receipt['effect']['changed_path_count'] == len(receipt['effect']['changed_paths'])
          assert receipt['effect']['changed_path_count'] > 0
          assert all(receipt['git_verification'].values())

          claims = receipt['claims']
          assert claims['commit_decision_approved'] is True
          assert claims['commit_object_created'] is True
          assert claims['state_transition_evidence_established'] is True
          assert claims['commit_performed'] is True
          assert claims['local_ephemeral_execution_established'] is True

          for key in [
              'remote_repository_mutation_performed',
              'published_branch_or_ref_update_established',
              'poai_materialization_event_recorded',
              'outcome_observed',
              'policy_relative_canonicality_established',
              'universal_canonicality_established',
              'truth_certified',
              'causal_proof_certified',
              'legal_effect_established',
              'poai_v_conformance_established',
          ]:
              assert claims[key] is False, key

          print('CommitReceipt verifies actual local Git transition while publication/outcome/canonicality remain false')
          PY

      - name: Confirm no refs or working-tree bytes were changed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
