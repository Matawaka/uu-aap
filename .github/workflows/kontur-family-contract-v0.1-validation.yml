name: KONTUR Product Family Contract v0.1 validation

on:
  pull_request:
    paths:
      - "products/kontur/v0.1/**"
      - "schemas/product-contract/v0.1/**"
      - "server/kontur/v0.1/**"
      - "pilots/kontur-game-companion/dependency-contract/**"
      - "ROADMAP.md"
      - "README.ru.md"
      - ".github/workflows/kontur-family-contract-v0.1-validation.yml"
  push:
    branches:
      - main
    paths:
      - "products/kontur/v0.1/**"
      - "schemas/product-contract/v0.1/**"
      - "server/kontur/v0.1/**"
      - "pilots/kontur-game-companion/dependency-contract/**"
      - "ROADMAP.md"
      - "README.ru.md"
      - ".github/workflows/kontur-family-contract-v0.1-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Family boundaries, readiness separation and fail-closed validation
    runs-on: ubuntu-latest
    env:
      PYTHONPYCACHEPREFIX: /tmp/kontur-family-pycache
      ORIGIN_FRONTIER: 04078a72415b681bc588d801169fc5d9abee3e9b
      ORIGIN_TREE: 88ee6c1b7417ed3e5758d9b08c2b1252328d23b5
      EXPECTED_CONTRACT_HASH: sha256:21597d591cc4fbe2974c8ac63d669c79158734336c6c64f8ba6a91602835b1b5
      EXPECTED_MANIFEST_HASH: sha256:90da81f7c33f44f34410790e9269bf8b05a5ad47db596437b214b8301701a5a1
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema>=4.22,<5"

      - name: Verify exact origin frontier, tree and identities
        run: |
          git cat-file -e "${ORIGIN_FRONTIER}^{commit}"
          git merge-base --is-ancestor "$ORIGIN_FRONTIER" HEAD
          test "$(git show -s --format=%T "$ORIGIN_FRONTIER")" = "$ORIGIN_TREE"
          python - <<'PY'
          import json, os
          from pathlib import Path
          contract = json.loads(Path('products/kontur/v0.1/product-contract.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('products/kontur/v0.1/family-manifest.json').read_text(encoding='utf-8'))
          assert contract['frontier']['revision'] == os.environ['ORIGIN_FRONTIER']
          assert contract['identity']['content_hash'] == os.environ['EXPECTED_CONTRACT_HASH']
          assert manifest['frontier']['revision'] == os.environ['ORIGIN_FRONTIER']
          assert manifest['frontier']['tree'] == os.environ['ORIGIN_TREE']
          assert manifest['identity']['content_hash'] == os.environ['EXPECTED_MANIFEST_HASH']
          print('PASS: exact KONTUR family origin frontier, tree and identities verified')
          PY

      - name: Check validator syntax
        run: python -m py_compile products/kontur/v0.1/validate_contract.py

      - name: Re-run reusable Product Contract validation
        run: python schemas/product-contract/v0.1/validate_product_contract.py

      - name: Validate KONTUR Product Family Contract
        run: python products/kontur/v0.1/validate_contract.py

      - name: Re-run KONTUR Responsibility Kernel tests
        run: node server/kontur/v0.1/test-responsibility-kernel.js

      - name: Re-run KONTUR Responsibility Ledger tests
        run: node server/kontur/v0.1/test-responsibility-ledger.js

      - name: Re-run KONTUR Readiness Aggregator
        run: node server/kontur/v0.1/test-readiness-aggregator.js /tmp/kontur-family-readiness

      - name: Re-run Game Companion cross-layer dependency contract
        run: python pilots/kontur-game-companion/dependency-contract/validate.py

      - name: Guard family validator as local-only
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('products/kontur/v0.1/validate_contract.py').read_text(encoding='utf-8')
          forbidden = [
              'subprocess',
              'socket',
              'urllib',
              'requests',
              'http.client',
              'child_process',
          ]
          for token in forbidden:
              assert token not in text, token
          print('PASS: KONTUR family validator is local-only')
          PY

      - name: Confirm validation did not mutate checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
