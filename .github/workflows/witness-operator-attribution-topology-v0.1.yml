name: Witness Operator Attribution Topology v0.1
on:
  pull_request:
    paths:
      - 'scripts/witness-operator-attribution-topology/v0.1/**'
      - '.github/workflows/witness-operator-attribution-topology-v0.1.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/witness-operator-attribution-topology/v0.1/**'
      - '.github/workflows/witness-operator-attribution-topology-v0.1.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  witness-operator-attribution-topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate frozen predecessor and hostile layers
        shell: bash
        run: |
          set -euo pipefail
          old=scripts/witness-key-provenance-same-run-all-seven/v0.1
          python "$old/test_reproof.py"
          python "$old/receipt_validator.py" "$old/profile.json" "$old/qualification-receipt.json"
          test "$(git hash-object "$old/profile.json")" = a66d176fb7032f6db0b7961b83d7d92329d8ca63
          test "$(git hash-object "$old/qualification-receipt.json")" = 9edd35a373bc865df8e75c750343f6176ba9725e
          d=scripts/witness-operator-attribution-topology/v0.1
          git merge-base --is-ancestor 97c0c6ca4cc45ca4e7469d9d0b91d9f2445227d2 HEAD
          python "$d/validate_sources.py"
          python "$d/test_topology.py"
          python "$d/test_machine_metadata_overlay.py"
      - name: Fetch bounded read-only attribution, bridge, and metadata surfaces
        shell: bash
        run: |
          set -euo pipefail
          f(){ curl --fail --silent --show-error --location --retry 4 --retry-all-errors --proto '=https' "$1" -o "$2"; test -s "$2"; }
          f https://witness-network.org/witness-tables/ /tmp/tables.html
          f https://witness.stagemole.eu/about /tmp/stagemole.txt
          f https://transparency.dev/witnesses /tmp/trustfabric.html
          f https://remora.n621.de/ /tmp/remora.html
          f https://geomys.org/witness/navigli /tmp/geomys.html
          f https://navigli.sunlight.geomys.org/ /tmp/navigli-home.html
          f https://witness.navigli.sunlight.geomys.org/witness.v0.json /tmp/navigli-witness.v0.json
          f https://www.rgdd.se/poc-witness/about /tmp/rgdd.txt
          f https://witness1.smartit.nu/witness1/about.txt /tmp/smartit.txt
          cat >/tmp/source-map.json <<'JSON'
          {"https://witness.stagemole.eu/about":"/tmp/stagemole.txt","https://transparency.dev/witnesses":"/tmp/trustfabric.html","https://remora.n621.de/":"/tmp/remora.html","https://geomys.org/witness/navigli":"/tmp/geomys.html","https://navigli.sunlight.geomys.org/":"/tmp/navigli-home.html","https://www.rgdd.se/poc-witness/about":"/tmp/rgdd.txt","https://witness1.smartit.nu/witness1/about.txt":"/tmp/smartit.txt"}
          JSON
      - name: Preserve v2 failure model then qualify through machine metadata
        shell: bash
        run: |
          set -euo pipefail
          d=scripts/witness-operator-attribution-topology/v0.1
          python "$d/topology.py" --profile "$d/profile.json" --registry-body /tmp/tables.html --source-map /tmp/source-map.json >/tmp/base-topology.json
          python "$d/receipt_validator.py" "$d/profile.json" /tmp/base-topology.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/base-topology.json')); by={x['operator_label']:x for x in r['operator_records']}
          assert r['registry_relation_count']==6 and r['operator_key_material_relation_count']==6
          assert all(x['all_expected_vkeys_observed'] for k,x in by.items() if k!='Geomys')
          assert by['Geomys']['registry_relation_observed'] and by['Geomys']['operator_key_material_relation_observed']
          assert not any(r['claims'].values()) and not r['automatic_action'] and not r['external_mutation_performed']
          print('v2 fail-closed diagnostic topology preserved:',r['verdict'],r['receipt_fingerprint_sha256'])
          PY
          python "$d/machine_metadata_overlay.py" --profile "$d/profile.json" --base-receipt /tmp/base-topology.json --metadata /tmp/navigli-witness.v0.json >/tmp/operator-attribution-qualified.json
          python "$d/machine_metadata_overlay.py" --profile "$d/profile.json" --base-receipt /tmp/base-topology.json --metadata /tmp/navigli-witness.v0.json --validate /tmp/operator-attribution-qualified.json
      - name: Validate frozen machine qualification when materialized
        shell: bash
        run: |
          set -euo pipefail
          d=scripts/witness-operator-attribution-topology/v0.1; q="$d/machine-qualification-receipt.json"
          if [ -f "$q" ]; then
            python "$d/machine_metadata_overlay.py" --profile "$d/profile.json" --base-receipt /tmp/base-topology.json --metadata /tmp/navigli-witness.v0.json --validate "$q"
            python - <<'PY'
          import json
          a=json.load(open('/tmp/operator-attribution-qualified.json')); b=json.load(open('scripts/witness-operator-attribution-topology/v0.1/machine-qualification-receipt.json'))
          def s(x): return {k:x[k] for k in ('schema','tracking_issue','matched_witness_key_count','public_operator_label_count','bound_attribution_surface_count','bound_key_material_surface_count','bound_bridge_surface_count','registry_relation_count','operator_key_material_relation_count','witness_metadata_contract_count','trustfabric_pinned_key_count','all_seven_public_operator_attributions_bound','claims','verdict')}
          assert s(a)==s(b); print('live machine qualification semantic contract == frozen qualification')
          PY
          else echo 'first machine qualification run: frozen receipt not materialized yet'; fi
      - uses: actions/upload-artifact@v4
        with:
          name: witness-operator-attribution-topology-${{ github.sha }}
          path: |
            /tmp/operator-attribution-qualified.json
            /tmp/base-topology.json
            /tmp/tables.html
            /tmp/geomys.html
            /tmp/navigli-home.html
            /tmp/navigli-witness.v0.json
          if-no-files-found: error
          retention-days: 30
      - name: Assert additive successor-only and repository-read-only boundaries
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then git fetch --quiet origin "$GITHUB_BASE_REF"; changed="$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD)"; else changed="$(git diff --name-only HEAD^..HEAD)"; fi
          test -n "$changed"
          while IFS= read -r x; do case "$x" in scripts/witness-operator-attribution-topology/v0.1/*|.github/workflows/witness-operator-attribution-topology-v0.1.yml) ;; *) echo "unexpected path $x" >&2; exit 1;; esac; done <<<"$changed"
          ! grep -Eq '^(protocols/core/|protocols/interface-registry/|SPEC.md$|PRINCIPLES.md$|scripts/witness-key-provenance-|scripts/anchored-witnessed-consistency-pilot/)' <<<"$changed"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
