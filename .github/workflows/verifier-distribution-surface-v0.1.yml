name: P1.2 Verifier Distribution Surface v0.1

on:
  pull_request:
    paths:
      - 'packages/uuaap-verifier-presentation/**'
      - 'scripts/verifier-presentation-contract/**'
      - 'scripts/verifier-distribution-surface/**'
      - 'scripts/verifier-interactive-surface/**'
      - 'scripts/verifier-evidence-adapter/**'
      - 'scripts/verifier-candidate-acceptance/**'
      - 'scripts/verifier-policy-localization/**'
      - 'scripts/verifier-contestability/**'
      - 'scripts/verifier-scoped-attestations/**'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SPEC.md'
      - 'CONTESTABILITY.md'
      - '.github/workflows/verifier-*.yml'
  push:
    branches: [main]
    paths:
      - 'packages/uuaap-verifier-presentation/**'
      - 'scripts/verifier-*/**'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SPEC.md'
      - 'CONTESTABILITY.md'
      - '.github/workflows/verifier-*.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate:
    name: package + Pages semantic equivalence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install reusable package outside checkout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/uuaap-verifier-package"
          cp -a packages/uuaap-verifier-presentation "${RUNNER_TEMP}/uuaap-verifier-package"
          python -m pip install "${RUNNER_TEMP}/uuaap-verifier-package" jsonschema
      - name: Prove installed API remains independently importable
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          python - <<'PY'
          import uuaap_verifier_presentation as v
          assert v.DIMENSION_ORDER == ('integrity','identity','provenance','availability','authority','responsibility','truth')
          for name in (
              'build_presentation','render','normalize_interactive_input','adapt_evidence',
              'materialize_candidate_acceptance','materialize_contestability_overlay','bridge_attestations',
          ):
              assert callable(getattr(v,name))
          assert v.CAWG_IDENTITY_VERSION == '1.3'
          assert v.W3C_VCDM_VERSION == '2.0'
          print('installed P1.1-P1.8 API: PASS')
          PY
      - name: Re-run every verifier firewall
        run: |
          python scripts/verifier-presentation-contract/test.py
          python scripts/verifier-distribution-surface/test.py
          python scripts/verifier-interactive-surface/test.py
          python scripts/verifier-evidence-adapter/test.py
          python scripts/verifier-candidate-acceptance/test.py
          python scripts/verifier-policy-localization/test.py
          python scripts/verifier-contestability/test.py
          python scripts/verifier-scoped-attestations/test.py
      - name: Build one validated Pages artifact through P1.8
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-distribution-surface/build_site.py --output "${RUNNER_TEMP}/uuaap-pages"
          cmp --silent "${RUNNER_TEMP}/uuaap-pages/verifier/index.html" scripts/verifier-presentation-contract/reference.html
          python scripts/verifier-interactive-surface/build_interactive_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-evidence-adapter/build_adapter_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-candidate-acceptance/build_acceptance_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-contestability/build_contestability_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-scoped-attestations/build_attestation_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          cmp --silent "${RUNNER_TEMP}/uuaap-pages/verifier/index.html" scripts/verifier-presentation-contract/reference.html

          cp "${RUNNER_TEMP}/uuaap-pages/verifier/contest/example.json" "${RUNNER_TEMP}/contest.before"
          cp "${RUNNER_TEMP}/uuaap-pages/verifier/contest/example-result.json" "${RUNNER_TEMP}/contest-result.before"
          cp "${RUNNER_TEMP}/uuaap-pages/verifier/attest/example.json" "${RUNNER_TEMP}/attest.before"
          cp "${RUNNER_TEMP}/uuaap-pages/verifier/attest/example-result.json" "${RUNNER_TEMP}/attest-result.before"

          python scripts/verifier-policy-localization/build_policy_l10n.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-contestability/localize_contestability.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-scoped-attestations/localize_attestation.py --site "${RUNNER_TEMP}/uuaap-pages"

          cmp --silent "${RUNNER_TEMP}/uuaap-pages/verifier/index.html" scripts/verifier-presentation-contract/reference.html
          cmp --silent "${RUNNER_TEMP}/contest.before" "${RUNNER_TEMP}/uuaap-pages/verifier/contest/example.json"
          cmp --silent "${RUNNER_TEMP}/contest-result.before" "${RUNNER_TEMP}/uuaap-pages/verifier/contest/example-result.json"
          cmp --silent "${RUNNER_TEMP}/attest.before" "${RUNNER_TEMP}/uuaap-pages/verifier/attest/example.json"
          cmp --silent "${RUNNER_TEMP}/attest-result.before" "${RUNNER_TEMP}/uuaap-pages/verifier/attest/example-result.json"

          for path in interactive adapt accept contest attest policy; do
            test -s "${RUNNER_TEMP}/uuaap-pages/verifier/${path}/index.html"
          done
          grep -q 'data-locale="ru"' "${RUNNER_TEMP}/uuaap-pages/verifier/attest/index.html"
          grep -q 'data-i18n="root.attest_link"' "${RUNNER_TEMP}/uuaap-pages/index.html"
          grep -q '"attest.heading"' "${RUNNER_TEMP}/uuaap-pages/verifier/assets/messages.json"
          if grep -Eqi 'https?://' "${RUNNER_TEMP}/uuaap-pages/verifier/attest/index.html"; then
            echo 'ERROR: attestation page introduced external network target' >&2
            exit 1
          fi
          node scripts/verifier-policy-localization/test-browser.js "${RUNNER_TEMP}/uuaap-pages/verifier/assets/l10n.js"
      - name: Confirm immutable semantic sources remain untouched
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.base_ref || 'main' }}"
          git fetch -q origin "$base_ref" --depth=1
          base_sha="$(git rev-parse FETCH_HEAD)"
          if ! git diff --quiet "$base_sha" -- protocols/core/ SPEC.md CONTESTABILITY.md packages/uuaap-verifier-presentation/src/uuaap_verifier_presentation/adapters.py scripts/verifier-evidence-adapter/; then
            echo 'ERROR: distribution successor modified Core/SPEC/CONTESTABILITY or historical P1.4 adapter semantics' >&2
            git diff --name-only "$base_sha" -- protocols/core/ SPEC.md CONTESTABILITY.md packages/uuaap-verifier-presentation/src/uuaap_verifier_presentation/adapters.py scripts/verifier-evidence-adapter/ >&2
            exit 1
          fi
      - name: Working tree remains clean
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/uuaap-pages

  acceptance:
    name: P1.2-P1.8 one-source distribution acceptance
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - run: |
          echo 'canonical package == legacy P1.1 CLI == immutable reference verifier'
          echo 'P1.3 explicit input -> seven dimensions only'
          echo 'P1.4 external observations -> bounded candidates only'
          echo 'P1.5 candidates -> explicit ACCEPT | REJECT | DEFER'
          echo 'P1.7 correction/dispute/appeal -> preserved history'
          echo 'P1.8 CAWG/W3C receipts -> bounded identity/role/review attestations only'
          echo 'localized presentation != localized evidence or machine semantics'
          echo 'aggregate verdict -> FORBIDDEN'
          echo 'PR deployment -> DISABLED'
          echo 'PASS: P1.2-P1.8 verifier distribution stack'

  deploy:
    name: deploy validated verifier to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, acceptance]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy validated Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
