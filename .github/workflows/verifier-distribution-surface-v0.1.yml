name: P1.2 Verifier Distribution Surface v0.1

on:
  pull_request:
    paths:
      - 'packages/uuaap-verifier-presentation/**'
      - 'scripts/verifier-presentation-contract/**'
      - 'scripts/verifier-distribution-surface/**'
      - 'scripts/verifier-interactive-surface/**'
      - 'scripts/verifier-evidence-adapter/**'
      - 'scripts/verifier-candidate-acceptance/**'
      - 'scripts/verifier-policy-localization/**'
      - 'scripts/verifier-contestability/**'
      - 'scripts/verifier-scoped-attestations/**'
      - 'scripts/verifier-candidate-federation/**'
      - 'scripts/verifier-federated-disposition/**'
      - 'scripts/verifier-disposition-integrity/**'
      - 'scripts/verifier-disposition-integrity-surface/**'
      - 'scripts/verifier-disposition-integrity-capsule/**'
      - 'scripts/verifier-integrity-capsule-pages/**'
      - 'scripts/pages-composition/**'
      - 'scripts/pages-composition-integrity/**'
      - 'scripts/pages-finalized-distribution/**'
      - 'docs/**'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SPEC.md'
      - 'CONTESTABILITY.md'
      - '.github/workflows/verifier-*.yml'
      - '.github/workflows/poai-pages.yml'
      - '.github/workflows/pages-composition-v0.1.yml'
      - '.github/workflows/pages-integrity-envelope-v0.1.yml'
      - '.github/workflows/pages-finalized-distribution-v0.1.yml'
  push:
    branches: [main]
    paths:
      - 'packages/uuaap-verifier-presentation/**'
      - 'scripts/verifier-*/**'
      - 'scripts/pages-composition/**'
      - 'scripts/pages-composition-integrity/**'
      - 'scripts/pages-finalized-distribution/**'
      - 'docs/**'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SPEC.md'
      - 'CONTESTABILITY.md'
      - '.github/workflows/verifier-*.yml'
      - '.github/workflows/poai-pages.yml'
      - '.github/workflows/pages-composition-v0.1.yml'
      - '.github/workflows/pages-integrity-envelope-v0.1.yml'
      - '.github/workflows/pages-finalized-distribution-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate:
    name: package + finalized Pages semantic equivalence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install reusable package outside checkout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/uuaap-verifier-package"
          cp -a packages/uuaap-verifier-presentation "${RUNNER_TEMP}/uuaap-verifier-package"
          python -m pip install "${RUNNER_TEMP}/uuaap-verifier-package" jsonschema
      - name: Prove installed API remains independently importable
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          python - <<'PY'
          import uuaap_verifier_presentation as v
          assert v.DIMENSION_ORDER == ('integrity','identity','provenance','availability','authority','responsibility','truth')
          for name in (
              'build_presentation','render','normalize_interactive_input','adapt_evidence',
              'materialize_candidate_acceptance','materialize_contestability_overlay','bridge_attestations',
              'federate_candidate_sources','materialize_federated_disposition','verify_disposition_integrity',
          ):
              assert callable(getattr(v,name))
          assert v.CAWG_IDENTITY_VERSION == '1.3'
          assert v.W3C_VCDM_VERSION == '2.0'
          assert v.SOURCE_FAMILIES == ('P1.4_ADAPTER','P1.8_ATTESTATION')
          assert v.FEDERATED_DISPOSITION_SCOPE == 'verifier_federated_candidate_materialization'
          print('installed P1.1-P1.11 API: PASS')
          PY
      - name: Re-run every verifier firewall through P1.17
        run: |
          python scripts/verifier-presentation-contract/test.py
          python scripts/verifier-distribution-surface/test.py
          python scripts/verifier-interactive-surface/test.py
          python scripts/verifier-evidence-adapter/test.py
          python scripts/verifier-candidate-acceptance/test.py
          python scripts/verifier-policy-localization/test.py
          python scripts/verifier-contestability/test.py
          python scripts/verifier-scoped-attestations/test.py
          python scripts/verifier-candidate-federation/test.py
          python scripts/verifier-federated-disposition/test.py
          python scripts/verifier-disposition-integrity/test.py
          python scripts/verifier-disposition-integrity-surface/test.py
          python scripts/verifier-disposition-integrity-capsule/test.py
          python scripts/verifier-integrity-capsule-pages/test.py
          python scripts/pages-composition/test.py
          python scripts/pages-composition-integrity/test.py
          python scripts/pages-finalized-distribution/test.py
      - name: Build validated verifier artifact through P1.14
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-distribution-surface/build_site.py --output "${RUNNER_TEMP}/uuaap-pages"
          cmp --silent "${RUNNER_TEMP}/uuaap-pages/verifier/index.html" scripts/verifier-presentation-contract/reference.html
          python scripts/verifier-interactive-surface/build_interactive_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-evidence-adapter/build_adapter_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-candidate-acceptance/build_acceptance_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-contestability/build_contestability_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-scoped-attestations/build_attestation_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-candidate-federation/build_candidate_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-federated-disposition/build_disposition_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-disposition-integrity-surface/build_integrity_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          cmp --silent "${RUNNER_TEMP}/uuaap-pages/verifier/index.html" scripts/verifier-presentation-contract/reference.html

          cp "${RUNNER_TEMP}/uuaap-pages/verifier/contest/example.json" "${RUNNER_TEMP}/contest.before"
          cp "${RUNNER_TEMP}/uuaap-pages/verifier/contest/example-result.json" "${RUNNER_TEMP}/contest-result.before"
          cp "${RUNNER_TEMP}/uuaap-pages/verifier/attest/example.json" "${RUNNER_TEMP}/attest.before"
          cp "${RUNNER_TEMP}/uuaap-pages/verifier/attest/example-result.json" "${RUNNER_TEMP}/attest-result.before"
          cp "${RUNNER_TEMP}/uuaap-pages/verifier/candidates/example.json" "${RUNNER_TEMP}/candidates.before"
          cp "${RUNNER_TEMP}/uuaap-pages/verifier/candidates/example-result.json" "${RUNNER_TEMP}/candidates-result.before"
          cp "${RUNNER_TEMP}/uuaap-pages/verifier/disposition/example.json" "${RUNNER_TEMP}/disposition.before"
          cp "${RUNNER_TEMP}/uuaap-pages/verifier/disposition/example-result.json" "${RUNNER_TEMP}/disposition-result.before"
          cp "${RUNNER_TEMP}/uuaap-pages/verifier/disposition/materialized-input.json" "${RUNNER_TEMP}/disposition-materialized.before"
          cp "${RUNNER_TEMP}/uuaap-pages/verifier/integrity/example.json" "${RUNNER_TEMP}/integrity.before"
          cp "${RUNNER_TEMP}/uuaap-pages/verifier/integrity/example-result.json" "${RUNNER_TEMP}/integrity-result.before"
          cp "${RUNNER_TEMP}/uuaap-pages/verifier/integrity/core.js" "${RUNNER_TEMP}/integrity-core.before"

          python scripts/verifier-policy-localization/build_policy_l10n.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-contestability/localize_contestability.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-scoped-attestations/localize_attestation.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-candidate-federation/localize_candidates.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-federated-disposition/localize_disposition.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-disposition-integrity-surface/localize_integrity.py --site "${RUNNER_TEMP}/uuaap-pages"

          cmp --silent "${RUNNER_TEMP}/uuaap-pages/verifier/index.html" scripts/verifier-presentation-contract/reference.html
          cmp --silent "${RUNNER_TEMP}/contest.before" "${RUNNER_TEMP}/uuaap-pages/verifier/contest/example.json"
          cmp --silent "${RUNNER_TEMP}/contest-result.before" "${RUNNER_TEMP}/uuaap-pages/verifier/contest/example-result.json"
          cmp --silent "${RUNNER_TEMP}/attest.before" "${RUNNER_TEMP}/uuaap-pages/verifier/attest/example.json"
          cmp --silent "${RUNNER_TEMP}/attest-result.before" "${RUNNER_TEMP}/uuaap-pages/verifier/attest/example-result.json"
          cmp --silent "${RUNNER_TEMP}/candidates.before" "${RUNNER_TEMP}/uuaap-pages/verifier/candidates/example.json"
          cmp --silent "${RUNNER_TEMP}/candidates-result.before" "${RUNNER_TEMP}/uuaap-pages/verifier/candidates/example-result.json"
          cmp --silent "${RUNNER_TEMP}/disposition.before" "${RUNNER_TEMP}/uuaap-pages/verifier/disposition/example.json"
          cmp --silent "${RUNNER_TEMP}/disposition-result.before" "${RUNNER_TEMP}/uuaap-pages/verifier/disposition/example-result.json"
          cmp --silent "${RUNNER_TEMP}/disposition-materialized.before" "${RUNNER_TEMP}/uuaap-pages/verifier/disposition/materialized-input.json"
          cmp --silent "${RUNNER_TEMP}/integrity.before" "${RUNNER_TEMP}/uuaap-pages/verifier/integrity/example.json"
          cmp --silent "${RUNNER_TEMP}/integrity-result.before" "${RUNNER_TEMP}/uuaap-pages/verifier/integrity/example-result.json"
          cmp --silent "${RUNNER_TEMP}/integrity-core.before" "${RUNNER_TEMP}/uuaap-pages/verifier/integrity/core.js"

          for path in interactive adapt accept contest attest candidates disposition integrity policy; do
            test -s "${RUNNER_TEMP}/uuaap-pages/verifier/${path}/index.html"
          done
          grep -q 'data-locale="ru"' "${RUNNER_TEMP}/uuaap-pages/verifier/integrity/index.html"
          grep -q 'data-i18n="root.integrity_link"' "${RUNNER_TEMP}/uuaap-pages/index.html"
          grep -q '"integrity.heading"' "${RUNNER_TEMP}/uuaap-pages/verifier/assets/messages.json"
          grep -q '../disposition/app.js' "${RUNNER_TEMP}/uuaap-pages/verifier/integrity/index.html"
          grep -q 'core.js' "${RUNNER_TEMP}/uuaap-pages/verifier/integrity/index.html"
          grep -q 'ui.js' "${RUNNER_TEMP}/uuaap-pages/verifier/integrity/index.html"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from uuaap_verifier_presentation import validate_disposition_integrity_input, validate_disposition_integrity_result, verify_disposition_integrity
          root=Path(os.environ['RUNNER_TEMP'])/'uuaap-pages/verifier/integrity'
          record=json.loads((root/'example.json').read_text(encoding='utf-8'))
          result=json.loads((root/'example-result.json').read_text(encoding='utf-8'))
          validate_disposition_integrity_input(record)
          validate_disposition_integrity_result(result)
          assert verify_disposition_integrity(record)==result
          print('P1.12 deployed P1.11 integrity verification: PASS')
          PY
          if grep -Eqi 'https?://' "${RUNNER_TEMP}/uuaap-pages/verifier/integrity/index.html"; then
            echo 'ERROR: integrity page introduced external network target' >&2
            exit 1
          fi
          node scripts/verifier-policy-localization/test-browser.js "${RUNNER_TEMP}/uuaap-pages/verifier/assets/l10n.js"

          python scripts/verifier-disposition-integrity-capsule/build_capsule.py --site "${RUNNER_TEMP}/uuaap-pages"
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/integrity-capsule/capsule-manifest.json"
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/integrity-capsule/index.html"
          grep -q 'href="verifier/integrity-capsule/"' "${RUNNER_TEMP}/uuaap-pages/index.html"
          python - <<'PY'
          import os, sys
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'uuaap-pages/verifier/integrity-capsule'
          sys.path.insert(0, 'scripts/verifier-disposition-integrity-capsule')
          from build_capsule import verify_manifest
          manifest=verify_manifest(root)
          assert manifest['non_effects']['producer_authenticated'] is False
          assert manifest['non_effects']['truth_established'] is False
          assert manifest['non_effects']['authority_established'] is False
          assert manifest['non_effects']['publication_or_action_authority_established'] is False
          print('P1.14 deployed P1.13 capsule manifest: PASS')
          PY
          cmp --silent "${RUNNER_TEMP}/uuaap-pages/verifier/index.html" scripts/verifier-presentation-contract/reference.html
      - name: Compose PoAI docs and validated verifier under one physical Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/composed-pages"
          python scripts/pages-composition/compose_pages.py \
            --docs docs \
            --verifier-site "${RUNNER_TEMP}/uuaap-pages" \
            --output "${RUNNER_TEMP}/composed-pages"
          python scripts/pages-composition/compose_pages.py \
            --docs docs \
            --verifier-site "${RUNNER_TEMP}/uuaap-pages" \
            --output "${RUNNER_TEMP}/composed-pages" \
            --verify-only
          cmp --silent docs/index.html "${RUNNER_TEMP}/composed-pages/index.html"
          cmp --silent "${RUNNER_TEMP}/uuaap-pages/index.html" "${RUNNER_TEMP}/composed-pages/verifier-start.html"
          cmp --silent "${RUNNER_TEMP}/uuaap-pages/verifier/index.html" "${RUNNER_TEMP}/composed-pages/verifier/index.html"
          test -s "${RUNNER_TEMP}/composed-pages/poai/index.html"
          test -s "${RUNNER_TEMP}/composed-pages/verifier/integrity-capsule/capsule-manifest.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'composed-pages/pages-composition-receipt.json'
          receipt=json.loads(path.read_text(encoding='utf-8'))
          assert receipt['source_collisions']==['index.html']
          assert receipt['root_owner']=='PoAI docs/index.html'
          assert receipt['verifier_root_landing_relocated_to']=='verifier-start.html'
          assert all(value is False for value in receipt['non_effects'].values())
          print('P1.15 composed PoAI + verifier Pages artifact: PASS')
          PY
      - name: Finalize the exact Pages upload with the accepted P1.16 integrity envelope
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/finalized-pages"
          python scripts/pages-composition-integrity/finalize_pages.py \
            --p1-15-root "${RUNNER_TEMP}/composed-pages" \
            --output "${RUNNER_TEMP}/finalized-pages"
          python scripts/pages-composition-integrity/finalize_pages.py \
            --verify-only "${RUNNER_TEMP}/finalized-pages"
          test -s "${RUNNER_TEMP}/finalized-pages/pages-integrity-envelope.json"
          test -s "${RUNNER_TEMP}/finalized-pages/pages-composition-receipt.json"
          test -s "${RUNNER_TEMP}/finalized-pages/poai/index.html"
          test -s "${RUNNER_TEMP}/finalized-pages/verifier/index.html"
          test -s "${RUNNER_TEMP}/finalized-pages/verifier/integrity-capsule/capsule-manifest.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'finalized-pages'
          envelope=json.loads((root/'pages-integrity-envelope.json').read_text(encoding='utf-8'))
          assert envelope['verification_scope']=='relocated_byte_consistency_against_this_envelope'
          assert all(value is False for value in envelope['non_effects'].values())
          print('P1.17 exact upload root is P1.16-finalized and self-verifying: PASS')
          PY
      - name: Confirm immutable semantic sources remain untouched
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.base_ref || 'main' }}"
          git fetch -q origin "$base_ref" --depth=1
          base_sha="$(git rev-parse FETCH_HEAD)"
          guarded=(
            protocols/core/
            SPEC.md
            CONTESTABILITY.md
            packages/uuaap-verifier-presentation/src/uuaap_verifier_presentation/adapters.py
            packages/uuaap-verifier-presentation/src/uuaap_verifier_presentation/acceptance.py
            packages/uuaap-verifier-presentation/src/uuaap_verifier_presentation/attestations.py
            packages/uuaap-verifier-presentation/src/uuaap_verifier_presentation/federation.py
            packages/uuaap-verifier-presentation/src/uuaap_verifier_presentation/federated_disposition.py
            packages/uuaap-verifier-presentation/src/uuaap_verifier_presentation/disposition_integrity.py
            scripts/verifier-evidence-adapter/
            scripts/verifier-candidate-acceptance/
            scripts/verifier-scoped-attestations/
            scripts/verifier-candidate-federation/
            scripts/verifier-federated-disposition/
            scripts/verifier-disposition-integrity/
            scripts/verifier-disposition-integrity-surface/
            scripts/verifier-disposition-integrity-capsule/
            scripts/pages-composition/
            scripts/pages-composition-integrity/
            .github/workflows/pages-composition-v0.1.yml
            .github/workflows/pages-integrity-envelope-v0.1.yml
            .github/workflows/poai-pages.yml
          )
          if ! git diff --quiet "$base_sha" -- "${guarded[@]}"; then
            echo 'ERROR: distribution successor modified Core/SPEC/CONTESTABILITY or historical verifier/integrity semantics' >&2
            git diff --name-only "$base_sha" -- "${guarded[@]}" >&2
            exit 1
          fi
      - name: Working tree remains clean
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Upload validated composed Pages artifact (P1.16-finalized exact tree)
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/finalized-pages

  acceptance:
    name: P1.2-P1.17 one-owner finalized distribution acceptance
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - run: |
          echo 'canonical package == legacy P1.1 CLI == immutable reference verifier'
          echo 'P1.3 explicit input -> seven dimensions only'
          echo 'P1.4 external observations -> bounded candidates only'
          echo 'P1.5 historical adapter candidates -> explicit ACCEPT | REJECT | DEFER'
          echo 'P1.7 correction/dispute/appeal -> preserved history'
          echo 'P1.8 CAWG/W3C receipts -> bounded identity/role/review attestations only'
          echo 'P1.9 P1.4 + P1.8 candidates -> provenance-preserving federation only'
          echo 'P1.10 federated candidates -> explicit disposition + seven-dimension materialization only'
          echo 'P1.11 supplied P1.10 result -> deterministic canonical integrity closure only'
          echo 'P1.12 integrity closure -> browser-local public distribution only'
          echo 'P1.13 P1.12 dependency closure -> portable offline capsule only'
          echo 'P1.14 portable capsule -> validated verifier Pages artifact only'
          echo 'P1.15 PoAI docs + verifier -> one physical composed Pages artifact only'
          echo 'P1.16 composed artifact -> relocatable byte-integrity envelope only'
          echo 'P1.17 exact P1.16-finalized tree -> sole Pages upload/deploy artifact'
          echo 'docs root index preserved; verifier tree preserved at /verifier/'
          echo 'former verifier root landing -> byte-preserved /verifier-start.html'
          echo 'Pages integrity/deployment != producer authentication or timestamp'
          echo 'Pages integrity/deployment != truth/identity/authority/responsibility'
          echo 'Pages deployment mechanics != new publication/action authority'
          echo 'source family/order/count/evaluation != automatic priority'
          echo 'REJECT/DEFER != negative evidence'
          echo 'localized presentation != localized evidence or machine semantics'
          echo 'aggregate verdict -> FORBIDDEN'
          echo 'PR deployment -> DISABLED'
          echo 'PASS: P1.2-P1.17 finalized Pages distribution stack'

  deploy:
    name: deploy finalized integrity-bound PoAI + verifier artifact to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, acceptance]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy validated finalized Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
