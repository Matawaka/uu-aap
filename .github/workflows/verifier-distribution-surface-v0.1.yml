name: P1.2 Verifier Distribution Surface v0.1

on:
  pull_request:
    paths:
      - 'packages/uuaap-verifier-presentation/**'
      - 'scripts/verifier-presentation-contract/**'
      - 'scripts/verifier-distribution-surface/**'
      - 'scripts/verifier-interactive-surface/**'
      - 'scripts/verifier-evidence-adapter/**'
      - 'scripts/verifier-candidate-acceptance/**'
      - 'scripts/verifier-policy-localization/**'
      - 'scripts/verifier-contestability/**'
      - 'SPEC.md'
      - 'CONTESTABILITY.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/workflows/verifier-presentation-contract-v0.1.yml'
      - '.github/workflows/verifier-distribution-surface-v0.1.yml'
      - '.github/workflows/verifier-interactive-surface-v0.1.yml'
      - '.github/workflows/verifier-evidence-adapter-v0.1.yml'
      - '.github/workflows/verifier-candidate-acceptance-v0.1.yml'
      - '.github/workflows/verifier-policy-localization-v0.1.yml'
      - '.github/workflows/verifier-contestability-v0.1.yml'
  push:
    branches: [main]
    paths:
      - 'packages/uuaap-verifier-presentation/**'
      - 'scripts/verifier-presentation-contract/**'
      - 'scripts/verifier-distribution-surface/**'
      - 'scripts/verifier-interactive-surface/**'
      - 'scripts/verifier-evidence-adapter/**'
      - 'scripts/verifier-candidate-acceptance/**'
      - 'scripts/verifier-policy-localization/**'
      - 'scripts/verifier-contestability/**'
      - 'SPEC.md'
      - 'CONTESTABILITY.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/workflows/verifier-presentation-contract-v0.1.yml'
      - '.github/workflows/verifier-distribution-surface-v0.1.yml'
      - '.github/workflows/verifier-interactive-surface-v0.1.yml'
      - '.github/workflows/verifier-evidence-adapter-v0.1.yml'
      - '.github/workflows/verifier-candidate-acceptance-v0.1.yml'
      - '.github/workflows/verifier-policy-localization-v0.1.yml'
      - '.github/workflows/verifier-contestability-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate:
    name: package + Pages semantic equivalence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install reusable verifier package without mutating checkout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/uuaap-verifier-package"
          cp -a packages/uuaap-verifier-presentation "${RUNNER_TEMP}/uuaap-verifier-package"
          python -m pip install "${RUNNER_TEMP}/uuaap-verifier-package" jsonschema
      - name: Prove installed package is independently importable
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          python - <<'PY'
          import uuaap_verifier_presentation as verifier
          assert verifier.DIMENSION_ORDER == (
              'integrity','identity','provenance','availability','authority','responsibility','truth'
          )
          assert callable(verifier.build_presentation)
          assert callable(verifier.render)
          assert callable(verifier.validate_interactive_input)
          assert callable(verifier.normalize_interactive_input)
          assert callable(verifier.validate_adapter_input)
          assert callable(verifier.adapt_evidence)
          assert callable(verifier.validate_adapter_result)
          assert callable(verifier.build_acceptance_input)
          assert callable(verifier.materialize_candidate_acceptance)
          assert callable(verifier.validate_acceptance_result)
          assert callable(verifier.build_contestability_input)
          assert callable(verifier.materialize_contestability_overlay)
          assert callable(verifier.validate_contestability_input)
          assert callable(verifier.validate_contestability_result)
          print('installed reusable verifier package: PASS')
          PY
      - name: Syntax check distribution implementation
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in [
              Path('packages/uuaap-verifier-presentation/src/uuaap_verifier_presentation/core.py'),
              Path('packages/uuaap-verifier-presentation/src/uuaap_verifier_presentation/interactive.py'),
              Path('packages/uuaap-verifier-presentation/src/uuaap_verifier_presentation/adapters.py'),
              Path('packages/uuaap-verifier-presentation/src/uuaap_verifier_presentation/acceptance.py'),
              Path('packages/uuaap-verifier-presentation/src/uuaap_verifier_presentation/contestability.py'),
              Path('scripts/verifier-presentation-contract/build.py'),
              Path('scripts/verifier-presentation-contract/render.py'),
              Path('scripts/verifier-distribution-surface/build_site.py'),
              Path('scripts/verifier-distribution-surface/test.py'),
              Path('scripts/verifier-interactive-surface/build_interactive_site.py'),
              Path('scripts/verifier-interactive-surface/test.py'),
              Path('scripts/verifier-evidence-adapter/build_adapter_site.py'),
              Path('scripts/verifier-evidence-adapter/test.py'),
              Path('scripts/verifier-candidate-acceptance/build_acceptance_site.py'),
              Path('scripts/verifier-candidate-acceptance/test.py'),
              Path('scripts/verifier-contestability/build_contestability_site.py'),
              Path('scripts/verifier-contestability/localize_contestability.py'),
              Path('scripts/verifier-contestability/test.py'),
              Path('scripts/verifier-policy-localization/build_policy_l10n.py'),
              Path('scripts/verifier-policy-localization/test.py'),
          ]:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              print(f'PASS syntax: {path}')
          PY
          node --check scripts/verifier-interactive-surface/app.js
          node --check scripts/verifier-interactive-surface/test-browser.js
          node --check scripts/verifier-evidence-adapter/app.js
          node --check scripts/verifier-evidence-adapter/test-browser.js
          node --check scripts/verifier-candidate-acceptance/app.js
          node --check scripts/verifier-candidate-acceptance/test-browser.js
          node --check scripts/verifier-contestability/app.js
          node --check scripts/verifier-contestability/test-browser.js
          node --check scripts/verifier-policy-localization/runtime.js
          node --check scripts/verifier-policy-localization/test-browser.js
      - name: Re-run P1.1 semantic firewall unchanged
        run: python scripts/verifier-presentation-contract/test.py
      - name: Prove package, legacy CLI and Pages equivalence
        run: python scripts/verifier-distribution-surface/test.py
      - name: Build immutable P1.2 GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-distribution-surface/build_site.py --output "${RUNNER_TEMP}/uuaap-pages"
          test -s "${RUNNER_TEMP}/uuaap-pages/index.html"
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/index.html"
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/presentation.json"
          cmp --silent "${RUNNER_TEMP}/uuaap-pages/verifier/index.html" scripts/verifier-presentation-contract/reference.html
          test "$(grep -o 'data-dimension="' "${RUNNER_TEMP}/uuaap-pages/verifier/index.html" | wc -l)" -eq 7
      - name: Prove P1.2 generated reference remains static and non-scalar
        shell: bash
        run: |
          set -euo pipefail
          if grep -REqi '<script|https?://|Verified True|trust score|truth score|overall trust|overall verdict|umbrella verified' "${RUNNER_TEMP}/uuaap-pages"; then
            echo 'ERROR: P1.2 reference surface introduced external/runtime or aggregate semantics' >&2
            exit 1
          fi
      - name: Prove P1.3 canonical and browser normalization equivalence
        run: python scripts/verifier-interactive-surface/test.py
      - name: Augment validated artifact with local P1.3 interaction
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verifier-interactive-surface/build_interactive_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          cmp --silent "${RUNNER_TEMP}/uuaap-pages/verifier/index.html" scripts/verifier-presentation-contract/reference.html
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/interactive/index.html"
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/interactive/app.js"
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/interactive/example.json"
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/interactive/example-result.json"
          grep -q 'href="verifier/interactive/"' "${RUNNER_TEMP}/uuaap-pages/index.html"
          if grep -Eqi 'https?://' "${RUNNER_TEMP}/uuaap-pages/verifier/interactive/index.html"; then
            echo 'ERROR: interactive HTML introduced an external network target' >&2
            exit 1
          fi
      - name: Prove P1.4 canonical and browser adapter equivalence
        run: python scripts/verifier-evidence-adapter/test.py
      - name: Augment validated artifact with local P1.4 evidence adapters
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verifier-evidence-adapter/build_adapter_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          cmp --silent "${RUNNER_TEMP}/uuaap-pages/verifier/index.html" scripts/verifier-presentation-contract/reference.html
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/adapt/index.html"
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/adapt/app.js"
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/adapt/example.json"
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/adapt/example-result.json"
          grep -q 'href="verifier/adapt/"' "${RUNNER_TEMP}/uuaap-pages/index.html"
          if grep -Eqi 'https?://' "${RUNNER_TEMP}/uuaap-pages/verifier/adapt/index.html"; then
            echo 'ERROR: adapter HTML introduced an external network target' >&2
            exit 1
          fi
      - name: Prove P1.5 canonical and browser acceptance equivalence
        run: python scripts/verifier-candidate-acceptance/test.py
      - name: Augment validated artifact with local P1.5 candidate acceptance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verifier-candidate-acceptance/build_acceptance_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          cmp --silent "${RUNNER_TEMP}/uuaap-pages/verifier/index.html" scripts/verifier-presentation-contract/reference.html
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/accept/index.html"
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/accept/app.js"
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/accept/example.json"
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/accept/example-result.json"
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/accept/materialized-input.json"
          grep -q 'href="verifier/accept/"' "${RUNNER_TEMP}/uuaap-pages/index.html"
          if grep -Eqi 'https?://' "${RUNNER_TEMP}/uuaap-pages/verifier/accept/index.html"; then
            echo 'ERROR: acceptance HTML introduced an external network target' >&2
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          from uuaap_verifier_presentation import validate_interactive_input
          root=Path(os.environ['RUNNER_TEMP'])/'uuaap-pages/verifier/accept'
          result=json.loads((root/'example-result.json').read_text(encoding='utf-8'))
          materialized=json.loads((root/'materialized-input.json').read_text(encoding='utf-8'))
          assert result['materialized_interactive_input'] == materialized
          validate_interactive_input(materialized)
          assert materialized['dimension_claims']['integrity']['value'] == 'NOT_EVALUATED'
          assert materialized['dimension_claims']['identity']['value'] == 'NOT_EVALUATED'
          assert materialized['dimension_claims']['provenance']['value'] == 'CREDENTIALS_PRESENT'
          assert materialized['dimension_claims']['availability']['value'] == 'UNAVAILABLE_BEFORE_CUTOFF'
          assert materialized['dimension_claims']['authority']['value'] == 'SCOPED_AUTHORITY_ACCEPTED'
          assert materialized['dimension_claims']['responsibility']['value'] == 'SCOPED_RESPONSIBILITY_PRESENT'
          assert materialized['dimension_claims']['truth']['value'] == 'NOT_EVALUATED'
          assert result['acceptance_policy']['actor_ref_establishes_identity'] is False
          assert result['acceptance_policy']['actor_ref_establishes_authority'] is False
          assert result['acceptance_policy']['acceptance_strengthens_claim_semantics'] is False
          assert result['aggregate_score_present'] is False
          assert result['aggregate_verdict_present'] is False
          print('P1.5 deployed explicit materialization shape: PASS')
          PY
      - name: Prove P1.7 contestability isolation and browser equivalence
        run: python scripts/verifier-contestability/test.py
      - name: Augment validated artifact with P1.7 contestability overlay
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verifier-contestability/build_contestability_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          cmp --silent "${RUNNER_TEMP}/uuaap-pages/verifier/index.html" scripts/verifier-presentation-contract/reference.html
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/contest/index.html"
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/contest/app.js"
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/contest/example.json"
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/contest/example-result.json"
          grep -q 'href="verifier/contest/"' "${RUNNER_TEMP}/uuaap-pages/index.html"
          if grep -Eqi 'https?://' "${RUNNER_TEMP}/uuaap-pages/verifier/contest/index.html"; then
            echo 'ERROR: contestability HTML introduced an external network target' >&2
            exit 1
          fi
          cp "${RUNNER_TEMP}/uuaap-pages/verifier/contest/example.json" "${RUNNER_TEMP}/contest-example.before"
          cp "${RUNNER_TEMP}/uuaap-pages/verifier/contest/example-result.json" "${RUNNER_TEMP}/contest-result.before"
      - name: Prove P1.6 technical policy and localization isolation
        run: python scripts/verifier-policy-localization/test.py
      - name: Augment validated artifact with P1.6 policy and EN/RU static shell
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verifier-policy-localization/build_policy_l10n.py --site "${RUNNER_TEMP}/uuaap-pages"
          cmp --silent "${RUNNER_TEMP}/uuaap-pages/verifier/index.html" scripts/verifier-presentation-contract/reference.html
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/policy/index.html"
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/assets/l10n.js"
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/assets/messages.json"
          grep -q 'href="verifier/policy/"' "${RUNNER_TEMP}/uuaap-pages/index.html"
          grep -q 'data-locale="ru"' "${RUNNER_TEMP}/uuaap-pages/index.html"
          grep -q 'data-locale="ru"' "${RUNNER_TEMP}/uuaap-pages/verifier/interactive/index.html"
          grep -q 'data-locale="ru"' "${RUNNER_TEMP}/uuaap-pages/verifier/adapt/index.html"
          grep -q 'data-locale="ru"' "${RUNNER_TEMP}/uuaap-pages/verifier/accept/index.html"
          if grep -Eqi 'https?://' "${RUNNER_TEMP}/uuaap-pages/verifier/policy/index.html"; then
            echo 'ERROR: P1.6 policy HTML introduced an external network target' >&2
            exit 1
          fi
          node scripts/verifier-policy-localization/test-browser.js "${RUNNER_TEMP}/uuaap-pages/verifier/assets/l10n.js"
      - name: Extend EN/RU shell to P1.7 without translating contestability data
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verifier-contestability/localize_contestability.py --site "${RUNNER_TEMP}/uuaap-pages"
          cmp --silent "${RUNNER_TEMP}/uuaap-pages/verifier/index.html" scripts/verifier-presentation-contract/reference.html
          cmp --silent "${RUNNER_TEMP}/contest-example.before" "${RUNNER_TEMP}/uuaap-pages/verifier/contest/example.json"
          cmp --silent "${RUNNER_TEMP}/contest-result.before" "${RUNNER_TEMP}/uuaap-pages/verifier/contest/example-result.json"
          grep -q 'data-locale="ru"' "${RUNNER_TEMP}/uuaap-pages/verifier/contest/index.html"
          grep -q 'data-i18n="root.contest_link"' "${RUNNER_TEMP}/uuaap-pages/index.html"
          grep -q 'data-i18n="contest.heading"' "${RUNNER_TEMP}/uuaap-pages/verifier/contest/index.html"
          grep -q '"contest.heading"' "${RUNNER_TEMP}/uuaap-pages/verifier/assets/messages.json"
          node scripts/verifier-policy-localization/test-browser.js "${RUNNER_TEMP}/uuaap-pages/verifier/assets/l10n.js"
      - name: Confirm Core and normative/reference sources remain untouched
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.base_ref || 'main' }}"
          git fetch -q origin "$base_ref" --depth=1
          base_sha="$(git rev-parse FETCH_HEAD)"
          if ! git diff --quiet "$base_sha" -- protocols/core/ SPEC.md CONTESTABILITY.md; then
            echo 'ERROR: verifier distribution must not modify Core, SPEC or CONTESTABILITY reference semantics' >&2
            git diff --name-only "$base_sha" -- protocols/core/ SPEC.md CONTESTABILITY.md >&2
            exit 1
          fi
      - name: Working tree remains clean
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/uuaap-pages

  acceptance:
    name: P1.2/P1.3/P1.4/P1.5/P1.6/P1.7 one-source distribution acceptance
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - run: |
          echo 'canonical package == legacy P1.1 CLI == immutable reference verifier'
          echo 'interactive input -> explicit seven-dimension claims only'
          echo 'external observation -> bounded adapter -> candidate claim only'
          echo 'candidate claim -> explicit ACCEPT | REJECT | DEFER -> materialized P1.3 input'
          echo 'contestability overlay -> correction | dispute | appeal; no eighth dimension'
          echo 'dispute/appeal -> no claim mutation; correction -> successor + preserved history'
          echo 'localized presentation != localized protocol semantics'
          echo 'static verifier shell -> EN | RU; user evidence + contestability data -> canonical'
          echo 'technical policy -> implementation-backed; legal/WCAG certification -> NOT CLAIMED'
          echo 'browser input -> local only'
          echo 'aggregate verdict -> FORBIDDEN'
          echo 'PR deployment -> DISABLED'
          echo 'PASS: P1.2-P1.7 verifier distribution stack'

  deploy:
    name: deploy validated verifier to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, acceptance]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy validated Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
