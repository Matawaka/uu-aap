name: Personal Sovereign Root / PEF v0.1 validation

on:
  pull_request:
    paths:
      - 'protocols/integration/personal-sovereign-root/v0.1/**'
      - '.github/workflows/personal-sovereign-root-v0.1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Personal Sovereign Root / PEF v0.1
        run: node protocols/integration/personal-sovereign-root/v0.1/validate-personal-sovereign-root.js
