name: Continuity Copy Placement Plan v0.1 validation

on:
  pull_request:
    paths:
      - 'protection/continuity/placement/v0.1/**'
      - '.github/workflows/continuity-copy-placement-plan-v0.1-validation.yml'
  push:
    branches: [main]
    paths:
      - 'protection/continuity/placement/v0.1/**'
      - '.github/workflows/continuity-copy-placement-plan-v0.1-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse Python and JSON without bytecode writes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          root = Path('protection/continuity/placement/v0.1')
          ast.parse((root / 'copy_placement_plan.py').read_text())
          ast.parse((root / 'test_copy_placement_plan.py').read_text())
          json.loads((root / 'copy-placement-plan.schema.json').read_text())
          print('parse OK')
          PY

      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'

      - name: Run placement-plan tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python protection/continuity/placement/v0.1/test_copy_placement_plan.py

      - name: Generate frozen-frontier reference plan
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python protection/continuity/placement/v0.1/copy_placement_plan.py \
            --main-sha 2a0fbd4d67e9db4913658da825336d2c4a8c2888 \
            --tree-sha db02276c32a374eb80bae1ed3701762a9dda7c92 \
            > /tmp/copy-placement-plan.json
          python - <<'PY'
          import json
          p = json.load(open('/tmp/copy-placement-plan.json'))
          assert p['status'] == 'prepare-only'
          assert p['boundary']['human_completion_required'] is True
          assert p['boundary']['copies_claimed_present'] is False
          assert p['boundary']['provider_mutation_authorized'] is False
          assert p['boundary']['authority_transferred'] is False
          assert p['boundary']['rescue_authorized'] is False
          assert p['boundary']['failover_authorized'] is False
          assert p['boundary']['kontur_activation_authorized'] is False
          print('bounded generated plan OK')
          PY

      - name: Assert planner has local-only surface
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('protection/continuity/placement/v0.1/copy_placement_plan.py').read_text())
          forbidden = {'socket', 'urllib', 'requests', 'httpx', 'subprocess', 'paramiko', 'ftplib', 'pathlib'}
          seen = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  seen.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  seen.add(node.module.split('.')[0])
          bad = sorted(seen & forbidden)
          assert not bad, f'forbidden external/process/filesystem imports: {bad}'
          print('local-only planner surface OK')
          PY

      - name: Assert workflow remains read-only and KONTUR-independent
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/continuity-copy-placement-plan-v0.1-validation.yml').read_text()
          required = 'contents' + ': read'
          forbidden = [
              'contents' + ': write',
              'pull_request' + '_target',
              'secrets' + '.',
              'server/' + 'kontur',
              'gh ' + 'api',
              'curl' + ' ',
              'wget' + ' ',
          ]
          assert required in text
          bad = [item for item in forbidden if item in text]
          assert not bad, f'forbidden workflow surface: {bad}'
          print('workflow boundary OK')
          PY

      - name: Confirm checkout was not mutated
        run: test -z "$(git status --porcelain)"
