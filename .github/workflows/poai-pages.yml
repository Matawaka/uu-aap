name: Validate PoAI Pages source for unified deployment

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/pages-composition/**"
      - ".github/workflows/poai-pages.yml"
      - ".github/workflows/verifier-distribution-surface-v0.1.yml"
      - ".github/workflows/pages-composition-v0.1.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/pages-composition/**"
      - ".github/workflows/poai-pages.yml"
      - ".github/workflows/verifier-distribution-surface-v0.1.yml"
      - ".github/workflows/pages-composition-v0.1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PoAI source remains deployment-ready for composed Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate PoAI public source surface
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/index.html
          test -s docs/poai/index.html
          grep -q 'href="./poai/"' docs/index.html
          python - <<'PY'
          from pathlib import Path
          root=Path('docs')
          files=[]
          for path in sorted(root.rglob('*')):
              assert not path.is_symlink(), f'symlink not permitted in PoAI Pages source: {path}'
              if path.is_file():
                  files.append(path.relative_to(root).as_posix())
          assert 'index.html' in files
          assert 'poai/index.html' in files
          assert not any(path == 'verifier' or path.startswith('verifier/') for path in files), (
              'docs/ may not occupy the verifier URL tree owned by unified composition'
          )
          assert 'verifier-start.html' not in files
          assert 'pages-composition-receipt.json' not in files
          print(f'PoAI Pages source inventory: PASS ({len(files)} files)')
          PY

      - name: Prove this workflow has no deployment authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/poai-pages.yml').read_text(encoding='utf-8')
          deploy_action='actions/' + 'deploy-pages@'
          upload_action='actions/' + 'upload-pages-artifact@'
          pages_write='pages:' + ' write'
          token_write='id-token:' + ' write'
          pages_environment='name:' + ' github-pages'
          assert deploy_action not in text, 'PoAI validation workflow regained deploy-pages authority'
          assert upload_action not in text, 'PoAI validation workflow regained Pages artifact ownership'
          assert pages_write not in text, 'PoAI validation workflow regained pages: write'
          assert token_write not in text, 'PoAI validation workflow regained id-token: write'
          assert pages_environment not in text, 'PoAI validation workflow regained github-pages environment'
          print('PoAI validation != physical Pages deployment: PASS')
          PY

      - name: Working tree remains clean
        run: test -z "$(git status --porcelain --untracked-files=all)"
