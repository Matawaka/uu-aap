name: P1.9 Candidate Source Federation v0.1

on:
  pull_request:
    paths:
      - 'packages/uuaap-verifier-presentation/**'
      - 'scripts/verifier-presentation-contract/**'
      - 'scripts/verifier-distribution-surface/**'
      - 'scripts/verifier-interactive-surface/**'
      - 'scripts/verifier-evidence-adapter/**'
      - 'scripts/verifier-candidate-acceptance/**'
      - 'scripts/verifier-policy-localization/**'
      - 'scripts/verifier-contestability/**'
      - 'scripts/verifier-scoped-attestations/**'
      - 'scripts/verifier-candidate-federation/**'
      - 'SPEC.md'
      - 'CONTESTABILITY.md'
      - '.github/workflows/verifier-candidate-federation-v0.1.yml'
      - '.github/workflows/verifier-distribution-surface-v0.1.yml'
  push:
    branches: [main]
    paths:
      - 'packages/uuaap-verifier-presentation/**'
      - 'scripts/verifier-candidate-federation/**'
      - '.github/workflows/verifier-candidate-federation-v0.1.yml'
      - '.github/workflows/verifier-distribution-surface-v0.1.yml'
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate:
    name: plural candidate composition without acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install package and schema validator outside checkout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/uuaap-verifier-package"
          cp -a packages/uuaap-verifier-presentation "${RUNNER_TEMP}/uuaap-verifier-package"
          python -m pip install "${RUNNER_TEMP}/uuaap-verifier-package" jsonschema
      - name: Prove P1.9 API is independently importable
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          python - <<'PY'
          import uuaap_verifier_presentation as v
          assert v.DIMENSION_ORDER == (
              'integrity','identity','provenance','availability','authority','responsibility','truth'
          )
          assert v.SOURCE_FAMILIES == ('P1.4_ADAPTER','P1.8_ATTESTATION')
          assert v.FEDERATION_INPUT_SCHEMA == 'urn:uu-aap:candidate-source-federation-input:0.1'
          assert v.FEDERATION_RESULT_SCHEMA == 'urn:uu-aap:federated-candidate-set:0.1'
          assert callable(v.build_federation_input)
          assert callable(v.federate_candidate_sources)
          assert callable(v.validate_federation_input)
          assert callable(v.validate_federation_result)
          print('installed reusable P1.9 API: PASS')
          PY
      - name: Validate P1.9 schemas and implementation syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in [
              Path('packages/uuaap-verifier-presentation/src/uuaap_verifier_presentation/federation.py'),
              Path('scripts/verifier-candidate-federation/build_candidate_site.py'),
              Path('scripts/verifier-candidate-federation/localize_candidates.py'),
              Path('scripts/verifier-candidate-federation/test.py'),
          ]:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              print(f'PASS syntax: {path}')
          PY
          node --check scripts/verifier-candidate-federation/app.js
          node --check scripts/verifier-candidate-federation/test-browser.js
          python - <<'PY'
          import json
          from copy import deepcopy
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from uuaap_verifier_presentation import (
              adapt_evidence, bridge_attestations, build_federation_input, federate_candidate_sources
          )
          root=Path('.')
          adapter=json.loads((root/'scripts/verifier-evidence-adapter/fixture.json').read_text(encoding='utf-8'))
          attest=json.loads((root/'scripts/verifier-scoped-attestations/fixture.json').read_text(encoding='utf-8'))
          artifact={'id':'urn:uu-aap:artifact:p1.9:schema','description':'P1.9 schema validation reference'}
          adapter['artifact']=deepcopy(artifact); attest['artifact']=deepcopy(artifact)
          record=build_federation_input(adapt_evidence(adapter),bridge_attestations(attest))
          result=federate_candidate_sources(record)
          input_schema=json.loads((root/'scripts/verifier-candidate-federation/input.schema.json').read_text(encoding='utf-8'))
          result_schema=json.loads((root/'scripts/verifier-candidate-federation/result.schema.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(input_schema); Draft202012Validator.check_schema(result_schema)
          Draft202012Validator(input_schema).validate(record); Draft202012Validator(result_schema).validate(result)
          print('P1.9 schemas: PASS')
          PY
      - name: Prove source-bound federation and Python/browser equivalence
        run: python scripts/verifier-candidate-federation/test.py
      - name: Re-run P1.1 through P1.8 verifier firewalls
        run: |
          python scripts/verifier-presentation-contract/test.py
          python scripts/verifier-distribution-surface/test.py
          python scripts/verifier-interactive-surface/test.py
          python scripts/verifier-evidence-adapter/test.py
          python scripts/verifier-candidate-acceptance/test.py
          python scripts/verifier-policy-localization/test.py
          python scripts/verifier-contestability/test.py
          python scripts/verifier-scoped-attestations/test.py
      - name: Build full local Pages artifact through P1.9 with localization last
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-distribution-surface/build_site.py --output "${RUNNER_TEMP}/uuaap-pages"
          cmp --silent "${RUNNER_TEMP}/uuaap-pages/verifier/index.html" scripts/verifier-presentation-contract/reference.html
          python scripts/verifier-interactive-surface/build_interactive_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-evidence-adapter/build_adapter_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-candidate-acceptance/build_acceptance_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-contestability/build_contestability_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-scoped-attestations/build_attestation_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-candidate-federation/build_candidate_site.py --site "${RUNNER_TEMP}/uuaap-pages"
          cmp --silent "${RUNNER_TEMP}/uuaap-pages/verifier/index.html" scripts/verifier-presentation-contract/reference.html
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/candidates/index.html"
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/candidates/app.js"
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/candidates/example.json"
          test -s "${RUNNER_TEMP}/uuaap-pages/verifier/candidates/example-result.json"
          cp "${RUNNER_TEMP}/uuaap-pages/verifier/candidates/example.json" "${RUNNER_TEMP}/candidates.before"
          cp "${RUNNER_TEMP}/uuaap-pages/verifier/candidates/example-result.json" "${RUNNER_TEMP}/candidates-result.before"

          python scripts/verifier-policy-localization/build_policy_l10n.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-contestability/localize_contestability.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-scoped-attestations/localize_attestation.py --site "${RUNNER_TEMP}/uuaap-pages"
          python scripts/verifier-candidate-federation/localize_candidates.py --site "${RUNNER_TEMP}/uuaap-pages"

          cmp --silent "${RUNNER_TEMP}/uuaap-pages/verifier/index.html" scripts/verifier-presentation-contract/reference.html
          cmp --silent "${RUNNER_TEMP}/candidates.before" "${RUNNER_TEMP}/uuaap-pages/verifier/candidates/example.json"
          cmp --silent "${RUNNER_TEMP}/candidates-result.before" "${RUNNER_TEMP}/uuaap-pages/verifier/candidates/example-result.json"
          grep -q 'data-locale="ru"' "${RUNNER_TEMP}/uuaap-pages/verifier/candidates/index.html"
          grep -q 'data-i18n="root.candidates_link"' "${RUNNER_TEMP}/uuaap-pages/index.html"
          grep -q 'data-i18n="candidates.heading"' "${RUNNER_TEMP}/uuaap-pages/verifier/candidates/index.html"
          grep -q '"candidates.heading"' "${RUNNER_TEMP}/uuaap-pages/verifier/assets/messages.json"
          grep -q '../adapt/app.js' "${RUNNER_TEMP}/uuaap-pages/verifier/candidates/index.html"
          grep -q '../attest/app.js' "${RUNNER_TEMP}/uuaap-pages/verifier/candidates/index.html"
          if grep -Eqi 'https?://' "${RUNNER_TEMP}/uuaap-pages/verifier/candidates/index.html"; then
            echo 'ERROR: P1.9 candidates page introduced an external network target' >&2
            exit 1
          fi
          node scripts/verifier-policy-localization/test-browser.js "${RUNNER_TEMP}/uuaap-pages/verifier/assets/l10n.js"
      - name: Confirm Core and historical P1.4/P1.5/P1.8 semantics remain unmodified
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.base_ref || 'main' }}"
          git fetch -q origin "$base_ref" --depth=1
          base_sha="$(git rev-parse FETCH_HEAD)"
          guarded=(
            protocols/core/
            SPEC.md
            CONTESTABILITY.md
            packages/uuaap-verifier-presentation/src/uuaap_verifier_presentation/adapters.py
            packages/uuaap-verifier-presentation/src/uuaap_verifier_presentation/acceptance.py
            packages/uuaap-verifier-presentation/src/uuaap_verifier_presentation/attestations.py
            scripts/verifier-evidence-adapter/
            scripts/verifier-candidate-acceptance/
            scripts/verifier-scoped-attestations/
          )
          if ! git diff --quiet "$base_sha" -- "${guarded[@]}"; then
            echo 'ERROR: P1.9 modified Core/SPEC or a historical P1.4/P1.5/P1.8 implementation' >&2
            git diff --name-only "$base_sha" -- "${guarded[@]}" >&2
            exit 1
          fi
      - name: Working tree remains clean
        run: test -z "$(git status --porcelain --untracked-files=all)"

  acceptance:
    name: P1.9 candidate-source federation acceptance
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - run: |
          echo 'federation != acceptance'
          echo 'source count != confidence'
          echo 'source order != priority'
          echo 'plural same-dimension candidates != consensus'
          echo 'multiple sources != independent witnesses'
          echo 'P1.8 roles/reviews -> auxiliary only'
          echo 'candidate claim -> copied unchanged'
          echo 'aggregate verdict -> FORBIDDEN'
          echo 'PASS: P1.9 Candidate Source Federation v0.1'
