name: C2PA Semantic Boundary v0.1

on:
  pull_request:
    paths:
      - 'scripts/c2pa-semantic-boundary/**'
      - '.github/workflows/c2pa-semantic-boundary-v0.1-validation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/c2pa-semantic-boundary/**'
      - '.github/workflows/c2pa-semantic-boundary-v0.1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-rubric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check scripts/c2pa-semantic-boundary/evaluate.js
      - run: node --check scripts/c2pa-semantic-boundary/check-live-report.js
      - run: node --check scripts/c2pa-semantic-boundary/test.js
      - run: node scripts/c2pa-semantic-boundary/test.js
      - run: test -z "$(git status --porcelain)"

  live-c2pa-composition:
    runs-on: ubuntu-latest
    env:
      C2PATOOL_VERSION: '0.27.16'
      C2PATOOL_ARCHIVE_SHA256: '62eed34f0c90a24b696b1969c8aad4340e11ec7264e1cf6fc375ad15c1db7663'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Fetch pinned c2patool binary
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/contentauth/c2pa-rs/releases/download/c2patool-v${C2PATOOL_VERSION}/c2patool-v${C2PATOOL_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error "$url" --output /tmp/c2patool.tar.gz
          echo "${C2PATOOL_ARCHIVE_SHA256}  /tmp/c2patool.tar.gz" | sha256sum --check --strict
          mkdir -p /tmp/c2patool
          tar -xzf /tmp/c2patool.tar.gz -C /tmp/c2patool
          bin="$(find /tmp/c2patool -type f -name c2patool -print -quit)"
          test -n "$bin"
          chmod +x "$bin"
          echo "C2PA_BIN=$bin" >> "$GITHUB_ENV"
      - name: Create deterministic source asset
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 --decode > /tmp/source.png
          test -s /tmp/source.png
      - name: Generate fresh C2PA asset with official test signer
        shell: bash
        run: |
          set -euo pipefail
          "$C2PA_BIN" /tmp/source.png --create digitalCapture --output /tmp/c2pa-live.png --force
          test -s /tmp/c2pa-live.png
      - name: Validate freshly generated C2PA asset
        shell: bash
        run: |
          set -euo pipefail
          "$C2PA_BIN" /tmp/c2pa-live.png > /tmp/c2pa-report.json
          test -s /tmp/c2pa-report.json
      - name: Catch unsafe signer to author promotion
        run: >-
          node scripts/c2pa-semantic-boundary/check-live-report.js
          /tmp/c2pa-report.json
          scripts/c2pa-semantic-boundary/rubric-v0.1.json
          scripts/c2pa-semantic-boundary/fixtures/live-signer-overlay.json
      - run: test -z "$(git status --porcelain)"
