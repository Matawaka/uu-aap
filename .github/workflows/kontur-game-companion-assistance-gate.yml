name: KONTUR Game Companion assistance gate validation

on:
  pull_request:
    paths:
      - 'pilots/kontur-game-companion/assistance-gate/**'
      - '.github/workflows/kontur-game-companion-assistance-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate assistance escalation and spoiler budget gate
        run: python pilots/kontur-game-companion/assistance-gate/validate.py
