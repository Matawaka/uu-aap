name: UU-AAP AI Gateway GitHub adapter v0.1 validation

on:
  pull_request:
    paths:
      - "protocols/integration/ai-gateway/**"
      - "protocols/core/v0.1/**"
      - "protocols/core/extensions/v0.1/**"
      - "protocols/core/extensions/composition/v0.1/**"
      - "protocols/core/evolution/v0.1/**"
      - "protocols/core/extensions/intent-evidence/v0.1/**"
      - ".github/workflows/ai-gateway-github-adapter-v0.1-validation.yml"
  push:
    branches: [main]
    paths:
      - "protocols/integration/ai-gateway/**"
      - "protocols/core/v0.1/**"
      - "protocols/core/extensions/v0.1/**"
      - "protocols/core/extensions/composition/v0.1/**"
      - "protocols/core/evolution/v0.1/**"
      - "protocols/core/extensions/intent-evidence/v0.1/**"
      - ".github/workflows/ai-gateway-github-adapter-v0.1-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen Core v0.1
        run: node protocols/core/v0.1/validate-core.js
      - name: Validate extension composition
        run: node protocols/core/extensions/v0.1/validate-extensions.js
      - name: Validate extension composition receipt
        run: node protocols/core/extensions/composition/v0.1/validate-composition-receipt.js
      - name: Validate stack evolution
        run: node protocols/core/evolution/v0.1/validate-evolution.js
      - name: Validate Non-Induced Intent
        run: node protocols/core/extensions/intent-evidence/v0.1/validate-intent-evidence.js
      - name: Validate AI Gateway contract
        run: node protocols/integration/ai-gateway/v0.1/validate-gateway.js
      - name: Validate GitHub adapter binding
        run: node protocols/integration/ai-gateway/adapters/v0.1/validate-adapter.js
