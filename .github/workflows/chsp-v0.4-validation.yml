name: CHSP v0.4 validation

on:
  pull_request:
    paths:
      - 'protocols/chsp/**'
      - '.github/workflows/chsp-v0.4-validation.yml'
  push:
    branches: [main]
    paths:
      - 'protocols/chsp/**'
      - '.github/workflows/chsp-v0.4-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate CHSP v0.4 Python and JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile protocols/chsp/v0.4/chsp_v04.py
          python3 -m py_compile protocols/chsp/v0.4/test_chsp_v04.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('protocols/chsp/v0.4')
          for path in sorted(root.glob('*.json')):
              json.load(path.open(encoding='utf-8'))
              print('validated', path)
          PY

      - name: Exercise CHSP v0.4 authorization boundaries
        run: python3 protocols/chsp/v0.4/test_chsp_v04.py

      - name: Keep CHSP v0.3 green
        run: python3 protocols/chsp/v0.3/test_chsp_v03.py

      - name: Keep CHSP v0.2 green
        run: python3 protocols/chsp/v0.2/test_chsp_v02.py

      - name: Keep CHSP v0.1 green
        run: python3 protocols/chsp/v0.1/test_chsp.py

      - name: Keep Human Canonical Recognition v0.6 green
        run: python3 protection/rescue/v0.6/test_canonical_recognition.py

      - name: Keep Canonical Succession Proposal v0.5 green
        run: python3 protection/rescue/v0.5/test_canonical_succession.py

      - name: Keep Rescue Execution Envelope v0.4 green
        run: python3 protection/rescue/v0.4/test_rescue_execution.py

      - name: Keep Survival Plane v0.3 green
        run: python3 protection/rescue/v0.3/test_survival_plane_v03.py

      - name: Keep Survival Plane v0.2 green
        run: python3 protection/rescue/v0.2/test_survival_plane.py

      - name: Keep Project Rescue v0.1 green
        run: python3 protection/rescue/v0.1/test_rescue_assessor.py

      - name: Assert CHSP v0.4 has no network, Git, account or process execution surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          path = Path('protocols/chsp/v0.4/chsp_v04.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          forbidden = {'socket', 'urllib', 'http', 'requests', 'subprocess', 'git', 'paramiko'}
          found = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  found.update(alias.name.split('.')[0] for alias in node.names if alias.name.split('.')[0] in forbidden)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  root = node.module.split('.')[0]
                  if root in forbidden:
                      found.add(root)
          if found:
              raise SystemExit(f'forbidden execution/network imports: {sorted(found)}')
          print('local-only import surface: PASS')
          PY

      - name: Assert no automatic stewardship, ownership, publication or KONTUR path exists
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('protocols/chsp/v0.4')
          policy = json.load((root / 'reference.chsp-handover-authorization-policy.json').open())
          req = policy['requirements']
          assert req['automatic_execution'] is False
          assert req['automatic_ownership_transfer'] is False
          assert req['automatic_canonical_origin_mutation'] is False
          assert req['automatic_kontur_activation'] is False
          auth_schema = json.load((root / 'chsp-canonical-stewardship-handover-authorization.schema.json').open())
          props = auth_schema['properties']['claims']['properties']
          for key in [
              'candidate_stewardship_effective', 'execution_performed', 'canonical_successor_established',
              'repository_ownership_transferred', 'account_control_transferred', 'canonical_origin_mutated',
              'canonical_publication_executed', 'kontur_activated', 'distributed_consensus_established',
              'legal_effect_established', 'universal_trust_established'
          ]:
              assert props[key]['const'] is False, key
          assert props['bounded_handover_recording_authorized']['const'] is True
          print('authorization/execution separation: PASS')
          PY
