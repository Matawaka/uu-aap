name: KONTUR Game Companion pause-resume validation

on:
  pull_request:
    paths:
      - 'pilots/kontur-game-companion/pause-resume/**'
      - '.github/workflows/kontur-game-companion-pause-resume.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pause-resume session boundary
        run: python pilots/kontur-game-companion/pause-resume/validate.py
