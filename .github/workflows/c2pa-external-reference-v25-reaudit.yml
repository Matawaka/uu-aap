name: C2PA external-reference v2.5 bounded re-audit candidate

on:
  pull_request:
    paths:
      - 'scripts/c2pa-external-reference-v25/**'
      - '.github/workflows/c2pa-external-reference-v25-reaudit.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/c2pa-external-reference-v25/**'
      - '.github/workflows/c2pa-external-reference-v25-reaudit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-representation-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check scripts/c2pa-external-reference-v25/verify-resource.js
      - run: node --check scripts/c2pa-external-reference-v25/test.js
      - run: node --test scripts/c2pa-external-reference-v25/test.js
      - run: test -z "$(git status --porcelain)"

  pinned-24-sdk-regression-only:
    runs-on: ubuntu-latest
    env:
      C2PATOOL_VERSION: '0.27.16'
      C2PATOOL_ARCHIVE_SHA256: '62eed34f0c90a24b696b1969c8aad4340e11ec7264e1cf6fc375ad15c1db7663'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Acquire existing P0.2 pinned c2patool binary
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/contentauth/c2pa-rs/releases/download/c2patool-v${C2PATOOL_VERSION}/c2patool-v${C2PATOOL_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error "$url" --output /tmp/c2patool.tar.gz
          echo "${C2PATOOL_ARCHIVE_SHA256}  /tmp/c2patool.tar.gz" | sha256sum --check --strict
          mkdir -p /tmp/c2patool
          tar -xzf /tmp/c2patool.tar.gz -C /tmp/c2patool
          bin="$(find /tmp/c2patool -type f -name c2patool -print -quit)"
          test -n "$bin"
          chmod +x "$bin"
          echo "C2PA_BIN=$bin" >> "$GITHUB_ENV"
      - name: Generate and sign existing deterministic 2.4 baseline fixture
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 --decode > /tmp/source.png
          node scripts/c2pa-external-reference/build-config.js scripts/c2pa-external-reference/fixtures/external-uu-aap-record.json /tmp/manifest.json
          "$C2PA_BIN" /tmp/source.png --manifest /tmp/manifest.json --create digitalCapture --output /tmp/baseline.png --force > /tmp/sign.json
          "$C2PA_BIN" /tmp/baseline.png > /tmp/read.json
          node scripts/c2pa-external-reference/verify-reference.js /tmp/read.json scripts/c2pa-external-reference/fixtures/external-uu-aap-record.json
          cp scripts/c2pa-external-reference/fixtures/external-uu-aap-record.json /tmp/tampered.json
          printf ' ' >> /tmp/tampered.json
          if node scripts/c2pa-external-reference/verify-reference.js /tmp/read.json /tmp/tampered.json; then
            echo 'Unexpected binding acceptance of modified external record' >&2
            exit 1
          fi
      - run: test -z "$(git status --porcelain)"

  # Observes current public SDK handling of the SAME P0.2 fixture. This does NOT
  # establish C2PA 2.5 conformance or full cross-SDK preservation.
  pinned-28-sdk-successor-observation:
    runs-on: ubuntu-latest
    env:
      C2PATOOL_VERSION: '0.28.4'
      # GitHub Release API asset digest for contentauth/c2patool v0.28.4
      C2PATOOL_ARCHIVE_SHA256: '097e9efaff765baf7738a40c640012419cad419ce3e1aa36cf68e0576309c971'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Download and pin official c2patool successor binary
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/contentauth/c2patool/releases/download/v${C2PATOOL_VERSION}/v${C2PATOOL_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error "$url" --output /tmp/c2patool-successor.tar.gz
          echo "${C2PATOOL_ARCHIVE_SHA256}  /tmp/c2patool-successor.tar.gz" | sha256sum --check --strict
          mkdir -p /tmp/c2patool-successor
          tar -xzf /tmp/c2patool-successor.tar.gz -C /tmp/c2patool-successor
          bin="$(find /tmp/c2patool-successor -type f -name c2patool -print -quit)"
          test -n "$bin"
          chmod +x "$bin"
          "$bin" --version
          echo "C2PA_BIN=$bin" >> "$GITHUB_ENV"
      - name: Compare successor SDK sign/re-read/reference preservation
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 --decode > /tmp/source.png
          node scripts/c2pa-external-reference/build-config.js scripts/c2pa-external-reference/fixtures/external-uu-aap-record.json /tmp/manifest.json
          "$C2PA_BIN" /tmp/source.png --manifest /tmp/manifest.json --create digitalCapture --output /tmp/successor.png --force > /tmp/successor-sign.json
          "$C2PA_BIN" /tmp/successor.png > /tmp/successor-read.json
          node scripts/c2pa-external-reference/verify-reference.js /tmp/successor-read.json scripts/c2pa-external-reference/fixtures/external-uu-aap-record.json
          cp scripts/c2pa-external-reference/fixtures/external-uu-aap-record.json /tmp/tampered-successor.json
          printf ' ' >> /tmp/tampered-successor.json
          if node scripts/c2pa-external-reference/verify-reference.js /tmp/successor-read.json /tmp/tampered-successor.json; then
            echo 'Unexpected acceptance of tampered record by successor SDK path' >&2
            exit 1
          fi
      - run: test -z "$(git status --porcelain)"
