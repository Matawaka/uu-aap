name: Core Pilot 004 Run 001 outcome validation

on:
  pull_request:
    paths:
      - 'pilots/core-pilot-004/run-001/**'
      - '.github/workflows/core-pilot-004-run-001-outcome.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Run 001 execution receipt
        run: python pilots/core-pilot-004/run-001/validate_outcome.py
