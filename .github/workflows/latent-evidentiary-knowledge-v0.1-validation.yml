name: Latent Evidentiary Knowledge v0.1 validation

on:
  pull_request:
    paths:
      - 'protocols/integration/latent-evidentiary-knowledge/v0.1/**'
      - '.github/workflows/latent-evidentiary-knowledge-v0.1-validation.yml'
  push:
    branches: [main]
    paths:
      - 'protocols/integration/latent-evidentiary-knowledge/v0.1/**'
      - '.github/workflows/latent-evidentiary-knowledge-v0.1-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate fail-closed latent evidence activation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node protocols/integration/latent-evidentiary-knowledge/v0.1/validate.js
