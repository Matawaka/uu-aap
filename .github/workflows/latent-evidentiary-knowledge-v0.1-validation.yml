name: Latent Evidentiary Knowledge v0.1 validation

on:
  push:
    paths:
      - 'protocols/integration/latent-evidentiary-knowledge/v0.1/**'
      - '.github/workflows/latent-evidentiary-knowledge-v0.1-validation.yml'
  pull_request:
    paths:
      - 'protocols/integration/latent-evidentiary-knowledge/v0.1/**'
      - '.github/workflows/latent-evidentiary-knowledge-v0.1-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Latent Evidentiary Knowledge v0.1
        run: node protocols/integration/latent-evidentiary-knowledge/v0.1/validate-latent-evidentiary-knowledge.js
