name: Witness Key Provenance Same-Run All-Seven v0.1

on:
  pull_request:
    paths:
      - 'scripts/witness-key-provenance-same-run-all-seven/v0.1/**'
      - '.github/workflows/witness-key-provenance-same-run-all-seven-v0.1.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/witness-key-provenance-same-run-all-seven/v0.1/**'
      - '.github/workflows/witness-key-provenance-same-run-all-seven-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  witness-key-provenance-same-run-all-seven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'

      - name: Preserve merged PR 938 frozen predecessor unchanged
        shell: bash
        run: |
          set -euo pipefail
          old=scripts/witness-key-provenance-all-seven/v0.1
          python "$old/test_reproof.py"
          python "$old/receipt_validator.py" "$old/profile.json" "$old/qualification-receipt.json"
          test "$(git hash-object "$old/profile.json")" = 'c2fc9dae0db399e9d2c14c4010d0f2b7d93d9bb0'
          test "$(git hash-object "$old/qualification-receipt.json")" = '3d02d7c5b95be3fd813faa4f1118da0ecb6dabe7'
          python - <<'PY'
          import json
          r=json.load(open('scripts/witness-key-provenance-all-seven/v0.1/qualification-receipt.json'))
          assert r['receipt_fingerprint_sha256']=='0e46babcd7db57080b282d5216f50f4b9e4955eeed0cf53a14e8c77294ca142a'
          assert r['composed_exact_pinned_witness_key_count']==7
          assert r['all_seven_operator_source_observations_composed'] is True
          assert r['claims']['all_seven_currently_reobserved_in_one_run'] is False
          assert r['verdict']=='ALL_SEVEN_PINNED_WITNESS_KEYS_OPERATOR_SOURCE_OBSERVED_ACROSS_BOUND_PREDECESSOR_AND_SUCCESSOR_EVIDENCE_IDENTITY_AND_INDEPENDENCE_NOT_ESTABLISHED'
          print('merged #938 frozen predecessor parity PASS')
          PY

      - name: Validate exact successor bindings and hostile suite
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0f064ffc60c15ce98125b657f2f32eba09e0d933 HEAD
          python scripts/witness-key-provenance-same-run-all-seven/v0.1/validate_sources.py
          python scripts/witness-key-provenance-same-run-all-seven/v0.1/test_reproof.py
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          p='scripts/witness-key-provenance-same-run-all-seven/v0.1/receipt.schema.json'
          s=json.load(open(p,encoding='utf-8')); Draft202012Validator.check_schema(s)
          print('VALID schema:',p)
          PY

      - name: Fetch exact six-source same-run allowlist read-only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors --proto '=https' \
            https://witness.stagemole.eu/about -o /tmp/stagemole-about.txt
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors --proto '=https' \
            https://transparency.dev/witnesses -o /tmp/trustfabric-witnesses.html
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors --proto '=https' \
            https://remora.n621.de/ -o /tmp/remora.html
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors --proto '=https' \
            https://raw.githubusercontent.com/geomys/magnolia/0545421c001b16c0fb328cd9254010c46fa424a6/cmd/hetrix/geomys.go \
            -o /tmp/geomys-magnolia-geomys.go
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors --proto '=https' \
            https://www.rgdd.se/poc-witness/about -o /tmp/rgdd-about.txt
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors --proto '=https' \
            https://witness1.smartit.nu/witness1/about.txt -o /tmp/smartit-about.txt
          test -s /tmp/stagemole-about.txt
          test -s /tmp/trustfabric-witnesses.html
          test -s /tmp/remora.html
          test -s /tmp/geomys-magnolia-geomys.go
          test -s /tmp/rgdd-about.txt
          test -s /tmp/smartit-about.txt
          test "$(git hash-object /tmp/geomys-magnolia-geomys.go)" = '95a3e95134487229343bb6197f6fa1723cfa20d7'
          cat > /tmp/source-map.json <<'JSON'
          {
            "https://witness.stagemole.eu/about": "/tmp/stagemole-about.txt",
            "https://transparency.dev/witnesses": "/tmp/trustfabric-witnesses.html",
            "https://remora.n621.de/": "/tmp/remora.html",
            "https://raw.githubusercontent.com/geomys/magnolia/0545421c001b16c0fb328cd9254010c46fa424a6/cmd/hetrix/geomys.go": "/tmp/geomys-magnolia-geomys.go",
            "https://www.rgdd.se/poc-witness/about": "/tmp/rgdd-about.txt",
            "https://witness1.smartit.nu/witness1/about.txt": "/tmp/smartit-about.txt"
          }
          JSON

      - name: Re-observe all seven exact pins in one bounded run
        shell: bash
        run: |
          set -euo pipefail
          dir=scripts/witness-key-provenance-same-run-all-seven/v0.1
          python "$dir/reproof.py" --profile "$dir/profile.json" --source-map /tmp/source-map.json > /tmp/witness-key-provenance-same-run-all-seven.json
          python "$dir/receipt_validator.py" "$dir/profile.json" /tmp/witness-key-provenance-same-run-all-seven.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/witness-key-provenance-same-run-all-seven.json'))
          assert r['verdict']=='ALL_SEVEN_PINNED_WITNESS_KEYS_SOURCE_MATERIAL_REOBSERVED_IN_ONE_BOUNDED_RUN_IDENTITY_INDEPENDENCE_AND_CURRENT_ACTIVITY_NOT_ESTABLISHED',r
          assert r['matched_witness_key_count']==7,r
          assert r['unique_source_url_count']==6,r
          assert r['unique_source_host_count']==6,r
          assert r['all_seven_reobserved_in_one_bounded_run'] is True,r
          assert r['claims']['all_seven_currently_active_proven'] is False
          assert r['claims']['witness_identity_proven'] is False
          assert r['claims']['operator_independence_proven'] is False
          assert all(v is False for v in r['claims'].values())
          assert r['automatic_action'] is False
          assert r['external_mutation_performed'] is False
          print(r['verdict'])
          print('same-run keys / urls / hosts:',r['matched_witness_key_count'],r['unique_source_url_count'],r['unique_source_host_count'])
          print('receipt fingerprint:',r['receipt_fingerprint_sha256'])
          PY

      - name: Validate frozen qualification evidence when materialized
        shell: bash
        run: |
          set -euo pipefail
          frozen=scripts/witness-key-provenance-same-run-all-seven/v0.1/qualification-receipt.json
          if [ -f "$frozen" ]; then
            python scripts/witness-key-provenance-same-run-all-seven/v0.1/receipt_validator.py \
              scripts/witness-key-provenance-same-run-all-seven/v0.1/profile.json "$frozen"
            python - <<'PY'
          import json
          live=json.load(open('/tmp/witness-key-provenance-same-run-all-seven.json'))
          old=json.load(open('scripts/witness-key-provenance-same-run-all-seven/v0.1/qualification-receipt.json'))
          def stable(r):
              return {
                  'verdict':r['verdict'],
                  'predecessor':r['predecessor'],
                  'source_contract':[(x['id'],x['witness_vkey'],x['source_url'],x['source_classification'],x['exact_vkey_observed']) for x in r['source_records']],
                  'matched_witness_key_count':r['matched_witness_key_count'],
                  'unique_source_url_count':r['unique_source_url_count'],
                  'unique_source_host_count':r['unique_source_host_count'],
                  'observed_witness_vkeys':r['observed_witness_vkeys'],
                  'all_seven_reobserved_in_one_bounded_run':r['all_seven_reobserved_in_one_bounded_run'],
                  'key_provenance_assurance':r['key_provenance_assurance'],
                  'claims':r['claims'],
              }
          assert stable(live)==stable(old),(stable(live),stable(old))
          print('current same-run semantic source contract == frozen qualification; body digests remain historical evidence')
          PY
          else
            echo 'first qualification run: frozen same-run qualification receipt not materialized yet'
          fi

      - name: Upload bounded same-run provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: witness-key-provenance-same-run-all-seven-${{ github.sha }}
          path: |
            /tmp/witness-key-provenance-same-run-all-seven.json
            /tmp/stagemole-about.txt
            /tmp/trustfabric-witnesses.html
            /tmp/remora.html
            /tmp/geomys-magnolia-geomys.go
            /tmp/rgdd-about.txt
            /tmp/smartit-about.txt
          if-no-files-found: error
          retention-days: 30

      - name: Assert additive successor-only diff boundary
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              git fetch --quiet origin "${GITHUB_BASE_REF}"
              changed="$(git diff --name-only "origin/${GITHUB_BASE_REF}"...HEAD)"
              ;;
            push|workflow_dispatch)
              changed="$(git diff --name-only HEAD^..HEAD)"
              ;;
            *) echo "unsupported event ${GITHUB_EVENT_NAME}" >&2; exit 1 ;;
          esac
          test -n "$changed"
          while IFS= read -r file; do
            case "$file" in
              scripts/witness-key-provenance-same-run-all-seven/v0.1/*|.github/workflows/witness-key-provenance-same-run-all-seven-v0.1.yml) ;;
              *) echo "unexpected changed path: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          ! grep -q '^scripts/witness-key-provenance-all-seven/' <<< "$changed"
          ! grep -q '^scripts/witness-key-provenance-reproof/' <<< "$changed"
          ! grep -q '^scripts/anchored-witnessed-consistency-pilot/' <<< "$changed"
          ! grep -q '^protocols/core/' <<< "$changed"
          ! grep -q '^protocols/interface-registry/' <<< "$changed"
          ! grep -q '^SPEC.md$' <<< "$changed"
          ! grep -q '^PRINCIPLES.md$' <<< "$changed"

      - name: Prove repository-read-only execution
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
