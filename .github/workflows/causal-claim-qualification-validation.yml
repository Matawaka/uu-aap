name: CausalClaimQualification validation

on:
  pull_request:
    paths:
      - "protocols/integration/**"
      - "protocols/ial/**"
      - "proposals/ccrp/**"
      - "proposals/poai/**"
      - ".github/workflows/causal-claim-qualification-validation.yml"
  push:
    branches:
      - main
    paths:
      - "protocols/integration/**"
      - "protocols/ial/**"
      - "proposals/ccrp/**"
      - "proposals/poai/**"
      - ".github/workflows/causal-claim-qualification-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  causal-claim-qualification:
    name: Causal claim qualification validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with immutable tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema>=4.22,<5"

      - name: Validate upstream protocol registry
        run: node protocols/registry/v0.1/validate-registry.js

      - name: Check causal qualification JavaScript
        run: |
          node --check protocols/integration/v0.1/qualify-causal-claims.js
          node --check protocols/integration/v0.1/test-causal-claim-qualification.js

      - name: Validate qualification policy schema and live policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(Path('protocols/integration/v0.1/causal-qualification-policy.schema.json').read_text(encoding='utf-8'))
          policy = json.loads(Path('protocols/integration/v0.1/policies/exact-local-git-transition.causal-qualification-policy.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(policy)
          print('VALID causal qualification policy schema and canonical live policy')
          PY

      - name: Validate CausalClaimQualification schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path('protocols/integration/v0.1/causal-claim-qualification.schema.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          print('VALID schema: causal-claim-qualification.schema.json')
          PY

      - name: Reproduce intervention evidence and qualify typed causal claims
        run: |
          node protocols/integration/v0.1/test-causal-claim-qualification.js \
            /tmp/causal-claim-qualification.json

      - name: Validate generated qualification and overclaim boundary
        run: |
          python - <<'PY'
          import copy
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker, ValidationError

          schema = json.loads(Path('protocols/integration/v0.1/causal-claim-qualification.schema.json').read_text(encoding='utf-8'))
          qualification = json.loads(Path('/tmp/causal-claim-qualification.json').read_text(encoding='utf-8'))
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          validator.validate(qualification)

          result = qualification['qualification_result']
          assert result['status'] == 'bounded_predicates_qualified_stronger_claims_withheld'
          assert result['policy_relative'] is True
          assert result['qualified_predicate_count'] == 2
          assert result['withheld_predicate_count'] == 5
          assert result['uncertainty_status'] == 'material_uncertainty_preserved'
          assert result['universal_causal_truth_established'] is False

          expected = [
              ('originating_execution_contributed_to_exact_transition', 'qualified', True),
              ('model_relative_intervention_sensitivity', 'qualified', True),
              ('necessary_cause', 'deferred', False),
              ('sufficient_cause', 'deferred', False),
              ('exclusive_cause', 'deferred', False),
              ('counterfactual_causal_proof', 'not_qualified', False),
              ('generalized_external_consequence_causality', 'out_of_scope', False),
          ]
          assert len(qualification['decisions']) == len(expected)
          for decision, (predicate, status, establishes) in zip(qualification['decisions'], expected):
              assert decision['predicate'] == predicate
              assert decision['status'] == status
              assert decision['establishes_predicate'] is establishes
              assert decision['reason_codes']
              assert decision['evidence_refs']

          claims = qualification['claims']
          for key in [
              'exact_qualification_policy_applied',
              'predecessor_evidence_verified',
              'typed_causal_predicates_evaluated',
              'bounded_execution_contribution_qualified',
              'model_relative_intervention_sensitivity_qualified',
              'stronger_causal_predicates_withheld',
              'policy_scope_relativity_explicit',
              'uncertainty_preserved',
          ]:
              assert claims[key] is True, key

          forbidden = [
              'necessary_cause_established',
              'sufficient_cause_established',
              'exclusive_cause_established',
              'counterfactual_causal_proof_certified',
              'generalized_external_consequence_causality_established',
              'universal_causal_truth_established',
              'responsibility_for_outcome_adjudicated',
              'legal_responsibility_determined',
              'legal_effect_established',
              'moral_blame_assigned',
              'moral_correctness_established',
              'truth_certified',
              'remote_branch_or_ref_canonicality_established',
              'poai_materialization_event_recorded',
              'poai_successor_record_identity_inferred',
              'universal_canonicality_established',
              'poai_v_conformance_established',
          ]
          for key in forbidden:
              assert claims[key] is False, key
              bad = copy.deepcopy(qualification)
              bad['claims'][key] = True
              try:
                  validator.validate(bad)
              except ValidationError:
                  pass
              else:
                  raise AssertionError(f'schema accepted forbidden qualification overclaim: {key}')

          for index in [2, 3, 4, 5, 6]:
              bad = copy.deepcopy(qualification)
              bad['decisions'][index]['status'] = 'qualified'
              bad['decisions'][index]['establishes_predicate'] = True
              try:
                  validator.validate(bad)
              except ValidationError:
                  pass
              else:
                  raise AssertionError(f'schema accepted stronger causal predicate qualification at index {index}')

          bad = copy.deepcopy(qualification)
          bad['decisions'].pop()
          try:
              validator.validate(bad)
          except ValidationError:
              pass
          else:
              raise AssertionError('schema accepted missing predicate decision')

          for scalar_key in ['probability', 'score', 'percentage', 'likelihood', 'confidence_score']:
              bad = copy.deepcopy(qualification)
              bad['decisions'][0][scalar_key] = 0.9
              try:
                  validator.validate(bad)
              except ValidationError:
                  pass
              else:
                  raise AssertionError(f'schema accepted prohibited scalar field: {scalar_key}')

          print('Two bounded causal predicates qualified by exact policy; stronger predicates remain withheld')
          PY

      - name: Independently reject policy rule escalation
        run: |
          python - <<'PY'
          import copy
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker, ValidationError

          schema = json.loads(Path('protocols/integration/v0.1/causal-qualification-policy.schema.json').read_text(encoding='utf-8'))
          policy = json.loads(Path('protocols/integration/v0.1/policies/exact-local-git-transition.causal-qualification-policy.json').read_text(encoding='utf-8'))
          validator = Draft202012Validator(schema, format_checker=FormatChecker())

          for predicate in ['necessary_cause', 'sufficient_cause', 'exclusive_cause']:
              bad = copy.deepcopy(policy)
              bad['predicate_rules'][predicate]['status'] = 'qualified'
              bad['predicate_rules'][predicate]['establishes_predicate'] = True
              try:
                  validator.validate(bad)
              except ValidationError:
                  pass
              else:
                  raise AssertionError(f'policy schema accepted forbidden live-rule escalation: {predicate}')

          print('Canonical v0.1 policy schema rejects escalation of withheld causal predicates')
          PY

      - name: Confirm causal qualification produced no repository mutation
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
