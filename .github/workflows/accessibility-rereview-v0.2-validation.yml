name: Accessibility Re-review v0.2 validation

on:
  pull_request:
    paths:
      - 'review/accessibility/v0.2/**'
      - '.github/workflows/accessibility-rereview-v0.2-validation.yml'
  push:
    branches: [main]
    paths:
      - 'review/accessibility/v0.2/**'
      - '.github/workflows/accessibility-rereview-v0.2-validation.yml'

permissions:
  contents: read

env:
  ORIGIN_FRONTIER: 68b8e166355f91e3541bae4e34a4e9538dd616bf
  PREDECESSOR_REVIEW_FRONTIER: 588b4643ed86a4835f87ed54f14828e62a3787b2
  PREDECESSOR_ASSESSOR_BLOB: 6baf8df3446ce21b32bb295a97e74c4718be81f2
  PREDECESSOR_INPUT_BLOB: ec0259c7c8290e7bd183e2ac4091e958b7dc48ba
  INPUT: review/accessibility/v0.2/current-surfaces.input.json
  REPORT: /tmp/accessibility-rereview-v0.2.json
  P0_INPUT: /tmp/release-candidate-after-accessibility-rereview.input.json
  P0_REPORT: /tmp/release-candidate-after-accessibility-rereview.report.json

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind re-review frontier and lineage
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            target='${{ github.event.pull_request.base.sha }}'
          else
            target="$GITHUB_SHA"
          fi
          test -n "$target"
          echo "TARGET_FRONTIER=$target" >> "$GITHUB_ENV"
          git cat-file -e "${PREDECESSOR_REVIEW_FRONTIER}^{commit}"
          git cat-file -e "${ORIGIN_FRONTIER}^{commit}"
          git merge-base --is-ancestor "$PREDECESSOR_REVIEW_FRONTIER" "$target"
          git merge-base --is-ancestor "$ORIGIN_FRONTIER" "$target"

      - name: Preserve predecessor review evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "${PREDECESSOR_REVIEW_FRONTIER}:review/accessibility/v0.1/accessibility-review.js")" = "$PREDECESSOR_ASSESSOR_BLOB"
          test "$(git rev-parse "${PREDECESSOR_REVIEW_FRONTIER}:review/accessibility/v0.1/current-surfaces.input.json")" = "$PREDECESSOR_INPUT_BLOB"
          test "$(git hash-object review/accessibility/v0.1/accessibility-review.js)" = "$PREDECESSOR_ASSESSOR_BLOB"
          test "$(git hash-object review/accessibility/v0.1/current-surfaces.input.json)" = "$PREDECESSOR_INPUT_BLOB"

      - name: Prove post-remediation browser surfaces are exact
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            path="$1" expected="$2"
            test "$(git rev-parse "${ORIGIN_FRONTIER}:$path")" = "$expected"
            test "$(git rev-parse "${TARGET_FRONTIER}:$path")" = "$expected"
            test "$(git hash-object "$path")" = "$expected"
          }
          check_blob docs/index.html 0a0d47c17c1c666f6f32f1e569097248c160662d
          check_blob docs/poai/index.html a121fa138e1f984f6876e640e5583beb74c7fa3a
          check_blob docs/poai/accessibility.js 15a36b0ee606120baeb639ee5cd9f8390bf63c09
          check_blob docs/poai/styles.css be50b83bbe70c26cade53c558bd011db15515773

      - name: Verify remediation source observations
        shell: bash
        run: |
          set -euo pipefail
          grep -F "setAttribute('role', 'status')" docs/poai/accessibility.js >/dev/null
          grep -F "setAttribute('aria-live', 'polite')" docs/poai/accessibility.js >/dev/null
          grep -F "setAttribute('aria-atomic', 'true')" docs/poai/accessibility.js >/dev/null
          grep -F -- '--muted: #5f6975' docs/poai/styles.css >/dev/null
          grep -F -- '--accent-contrast: #ffffff' docs/poai/styles.css >/dev/null
          grep -F -- '--accent-contrast: #161b22' docs/poai/styles.css >/dev/null
          grep -F 'color: var(--accent-contrast)' docs/poai/styles.css >/dev/null
          for key in ArrowRight ArrowLeft Home End; do grep -F "$key" docs/poai/accessibility.js >/dev/null; done
          grep -F 'button:focus-visible' docs/poai/styles.css >/dev/null
          grep -F '@media (max-width: 820px)' docs/poai/styles.css >/dev/null

      - name: Re-run predecessor review semantics
        run: |
          node review/accessibility/v0.1/test-accessibility-review.js
          node review/accessibility/v0.1/test-import-safe.js

      - name: Run Accessibility Re-review v0.2 tests
        run: |
          node --check review/accessibility/v0.2/accessibility-rereview.js
          node review/accessibility/v0.2/test-accessibility-rereview.js
          node review/accessibility/v0.2/test-import-safe.js
          node -e "JSON.parse(require('node:fs').readFileSync(process.env.INPUT,'utf8'))"

      - name: Rebind re-review to equivalent current frontier and assess
        shell: bash
        run: |
          set -euo pipefail
          TARGET_FRONTIER="$TARGET_FRONTIER" node <<'NODE'
          const fs = require('node:fs');
          const input = JSON.parse(fs.readFileSync(process.env.INPUT, 'utf8'));
          input.reviewed_revision = process.env.TARGET_FRONTIER;
          input.surface_equivalence_verified = true;
          fs.writeFileSync('/tmp/accessibility-rereview-input.json', `${JSON.stringify(input, null, 2)}\n`);
          NODE
          node review/accessibility/v0.2/accessibility-rereview.js /tmp/accessibility-rereview-input.json > "$REPORT"
          node <<'NODE'
          const r = require('/tmp/accessibility-rereview-v0.2.json');
          if (r.reviewed_revision !== process.env.TARGET_FRONTIER) throw new Error('re-review frontier mismatch');
          if (r.outcome !== 'INSUFFICIENT_EVIDENCE') throw new Error(`expected INSUFFICIENT_EVIDENCE, got ${r.outcome}`);
          if (r.failed_dimensions.length !== 0) throw new Error('unexpected failed accessibility dimension');
          const expected = ['zoom_reflow','screen_reader','language_presentation'];
          if (JSON.stringify(r.insufficient_evidence_dimensions) !== JSON.stringify(expected)) throw new Error('unexpected residual evidence gaps');
          if (!r.predecessor_blocking_findings_resolved) throw new Error('predecessor blocking finding not resolved');
          if (r.remaining_blocking_findings.length !== 0) throw new Error('blocking accessibility finding remains');
          if (r.remediation_findings.some((x) => x.status !== 'RESOLVED')) throw new Error('remediation finding unresolved');
          if (!r.contrast_checks.every((x) => x.pass)) throw new Error('contrast remediation not verified');
          if (r.p0_mapping.status !== 'INSUFFICIENT_EVIDENCE' || r.p0_mapping.blocking !== false) throw new Error('unexpected P0 mapping');
          if (r.wcag_conformance_certified || r.universal_accessibility_proven || r.legal_compliance_established || r.release_authorized || r.publication_authorized || r.authority_created || r.runtime_activated) throw new Error('re-review overclaim');
          NODE

      - name: Re-run Release Candidate Checkpoint after re-review
        shell: bash
        run: |
          set -euo pipefail
          TARGET_FRONTIER="$TARGET_FRONTIER" node <<'NODE'
          const fs = require('node:fs');
          const input = JSON.parse(fs.readFileSync('tooling/release-candidate-checkpoint/v0.2/post-t5-frontier.input.json','utf8'));
          const review = JSON.parse(fs.readFileSync('/tmp/accessibility-rereview-v0.2.json','utf8'));
          const target = process.env.TARGET_FRONTIER;
          input.git_revision = target;
          for (const gate of input.engineering_evidence) gate.observed_at_revision = target;
          for (const gate of input.governance_evidence) gate.observed_at_revision = target;
          const gate = input.governance_evidence.find((x) => x.gate_id === 'accessibility');
          gate.status = review.p0_mapping.status;
          gate.blocking = review.p0_mapping.blocking;
          gate.source_path = 'review/accessibility/v0.2/README.md';
          gate.reviewed_revision = target;
          gate.explicit_review_outcome = true;
          gate.note = 'Accessibility Re-review v0.2 verified contrast and live-status remediation; empirical zoom/reflow, screen-reader and bilingual assistive-technology evidence remains incomplete.';
          fs.writeFileSync(process.env.P0_INPUT, `${JSON.stringify(input, null, 2)}\n`);
          NODE
          node tooling/release-candidate-checkpoint/v0.2/release-candidate-checkpoint.js "$P0_INPUT" > "$P0_REPORT"
          node <<'NODE'
          const r = require('/tmp/release-candidate-after-accessibility-rereview.report.json');
          if (r.git_revision !== process.env.TARGET_FRONTIER) throw new Error('P0 frontier mismatch');
          if (r.engineering.status !== 'PASS') throw new Error('engineering regression');
          if (r.decision !== 'RELEASE_CANDIDATE_REVIEW_PENDING') throw new Error(`expected RELEASE_CANDIDATE_REVIEW_PENDING, got ${r.decision}`);
          if (r.blocking_findings.length !== 0) throw new Error('unexpected blocking governance finding');
          const accessibility = r.governance.gates.find((x) => x.gate_id === 'accessibility');
          if (accessibility.status !== 'INSUFFICIENT_EVIDENCE' || accessibility.blocking !== false) throw new Error('accessibility gate mapping mismatch');
          if (r.release_authorized || r.publication_authorized || r.certification_granted || r.legal_status_established || r.authority_created || r.runtime_activated) throw new Error('P0 overclaim');
          NODE

      - name: Constrain re-review diff to evidence only
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git diff --name-only "$ORIGIN_FRONTIER"...HEAD | grep -Ev '^(review/accessibility/v0.2/|\.github/workflows/accessibility-rereview-v0.2-validation\.yml$)' || true)"
          test -z "$bad"

      - name: Guard re-review runtime as read-only assessment
        shell: bash
        run: |
          set -euo pipefail
          runtime=review/accessibility/v0.2/accessibility-rereview.js
          ! grep -Eq 'child_process|execSync|spawnSync|writeFile|appendFile|createWriteStream|node:http|node:https|node:net|node:dgram|fetch\(' "$runtime"
          grep -F "require('../v0.1/accessibility-review.js')" "$runtime" >/dev/null

      - name: Confirm checkout unchanged
        run: test -z "$(git status --porcelain)"

      - name: Upload re-review and checkpoint evidence
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-rereview-v0.2-${{ github.sha }}
          path: |
            /tmp/accessibility-rereview-v0.2.json
            /tmp/release-candidate-after-accessibility-rereview.report.json
          if-no-files-found: error
