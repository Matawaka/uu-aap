name: Evidence Replication Receipt v0.1 validation

on:
  pull_request:
    paths:
      - 'protection/evidence/replication/v0.1/**'
      - '.github/workflows/evidence-replication-receipt-v0.1-validation.yml'
  push:
    branches: [main]
    paths:
      - 'protection/evidence/replication/v0.1/**'
      - '.github/workflows/evidence-replication-receipt-v0.1-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Evidence replication receipt boundary
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'

      - name: Validate code and JSON Schema
        run: |
          node --check protection/evidence/replication/v0.1/evidence-replication-receipt.js
          node --check protection/evidence/replication/v0.1/test-evidence-replication-receipt.js
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          p = Path('protection/evidence/replication/v0.1/evidence-replication-receipt.schema.json')
          Draft202012Validator.check_schema(json.loads(p.read_text(encoding='utf-8')))
          print('VALID schema:', p)
          PY

      - name: Run fail-closed replication tests
        run: node protection/evidence/replication/v0.1/test-evidence-replication-receipt.js

      - name: Assert local-only non-authoritative implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('protection/evidence/replication/v0.1')
          executable = '\n'.join(p.read_text(encoding='utf-8') for p in root.glob('*.js'))
          forbidden_exec = [
              "require('child_process')", 'require("child_process")',
              "require('http')", 'require("http")',
              "require('https')", 'require("https")',
              'fetch(', 'server/kontur/', 'ActivationExecutor', 'activation-preflight',
          ]
          for token in forbidden_exec:
              if token in executable:
                  raise SystemExit(f'forbidden executable replication surface token: {token}')

          schema = Path(root / 'evidence-replication-receipt.schema.json').read_text(encoding='utf-8')
          required_false_claims = [
              'physical_independence_proven', 'origin_established', 'canonical_successor_established',
              'authority_transferred', 'custody_transferred', 'evidence_truth_certified',
              'legal_liability_determined', 'rescue_authorized', 'kontur_readiness_established',
              'kontur_activation_authorized', 'kontur_activated',
          ]
          for claim in required_false_claims:
              if f'"{claim}": {{ "const": false }}' not in schema:
                  raise SystemExit(f'missing schema false-claim guard: {claim}')
          print('Local-only / KONTUR-independent guard: PASS')
          PY

      - name: Assert workflow cannot mutate repository
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/evidence-replication-receipt-v0.1-validation.yml')
          text = p.read_text(encoding='utf-8')
          forbidden = [
              'contents' + ': write',
              'git ' + 'push',
              'gh pr ' + 'merge',
              'pull-requests' + ': write',
              'actions' + ': write',
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'forbidden workflow mutation token: {token}')
          print('Read-only workflow guard: PASS')
          PY

      - name: Confirm checkout was not mutated
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
