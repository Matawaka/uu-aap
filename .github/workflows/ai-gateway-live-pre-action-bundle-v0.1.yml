name: UU-AAP AI Gateway live pre-action bundle v0.1

on:
  pull_request:
    paths:
      - 'experiments/ai-gateway-live-executor-v0.1/pre-action-bundle-v0.1/**'
      - 'protocols/core/v0.1/**'
      - 'protocols/integration/ai-gateway/v0.1/**'
      - '.github/workflows/ai-gateway-live-pre-action-bundle-v0.1.yml'
  push:
    branches: [ main ]
    paths:
      - 'experiments/ai-gateway-live-executor-v0.1/pre-action-bundle-v0.1/**'
      - 'protocols/core/v0.1/**'
      - 'protocols/integration/ai-gateway/v0.1/**'
      - '.github/workflows/ai-gateway-live-pre-action-bundle-v0.1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frozen Core v0.1
        run: node protocols/core/v0.1/validate-core.js
      - name: Validate AI Gateway v0.1
        run: node protocols/integration/ai-gateway/v0.1/validate-gateway.js
      - name: Validate live pre-action bundle profile
        run: node experiments/ai-gateway-live-executor-v0.1/pre-action-bundle-v0.1/validate-pre-action-bundle.js
