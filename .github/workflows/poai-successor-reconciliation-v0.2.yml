name: PoAI Successor Reconciliation v0.2
on:
  pull_request:
    paths:
      - 'protocols/experimental/poai-successor-reconciliation/v0.2/**'
      - '.github/workflows/poai-successor-reconciliation-v0.2.yml'
  push:
    branches: [main]
    paths:
      - 'protocols/experimental/poai-successor-reconciliation/v0.2/**'
      - '.github/workflows/poai-successor-reconciliation-v0.2.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node protocols/experimental/poai-successor-reconciliation/v0.1/test-map.js
      - run: node protocols/experimental/poai-successor-reconciliation/v0.2/test-resolution.js
      - run: node protocols/integration/purpose-bounded-identity-evidence/v0.1/test-identity-evidence.js
      - run: node protocols/integration/scoped-authority-evidence/v0.1/test-authority-evidence.js
      - run: node protocols/integration/materialization-authority/v0.1/test-materialization-authority.js
      - run: node protocols/integration/policy-relative-materialization/v0.1/test-policy-relative-materialization.js
      - run: test -z "$(git status --porcelain)"
