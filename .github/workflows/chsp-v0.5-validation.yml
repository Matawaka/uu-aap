name: CHSP v0.5 validation

on:
  pull_request:
    paths:
      - 'protocols/chsp/**'
      - '.github/workflows/chsp-v0.5-validation.yml'
  push:
    branches: [main]
    paths:
      - 'protocols/chsp/**'
      - '.github/workflows/chsp-v0.5-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate CHSP v0.5 Python and JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile protocols/chsp/v0.5/chsp_v05.py
          python3 -m py_compile protocols/chsp/v0.5/test_chsp_v05.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('protocols/chsp/v0.5')
          for path in sorted(root.glob('*.json')):
              json.load(path.open(encoding='utf-8'))
              print('validated', path)
          PY

      - name: Exercise CHSP v0.5 bounded execution boundaries
        run: python3 protocols/chsp/v0.5/test_chsp_v05.py

      - name: Keep CHSP v0.4 green
        run: python3 protocols/chsp/v0.4/test_chsp_v04.py

      - name: Keep CHSP v0.3 green
        run: python3 protocols/chsp/v0.3/test_chsp_v03.py

      - name: Keep CHSP v0.2 green
        run: python3 protocols/chsp/v0.2/test_chsp_v02.py

      - name: Keep CHSP v0.1 green
        run: python3 protocols/chsp/v0.1/test_chsp.py

      - name: Keep Human Canonical Recognition v0.6 green
        run: python3 protection/rescue/v0.6/test_canonical_recognition.py

      - name: Keep Canonical Succession Proposal v0.5 green
        run: python3 protection/rescue/v0.5/test_canonical_succession.py

      - name: Keep Rescue Execution Envelope v0.4 green
        run: python3 protection/rescue/v0.4/test_rescue_execution.py

      - name: Keep Survival Plane v0.3 green
        run: python3 protection/rescue/v0.3/test_survival_plane_v03.py

      - name: Keep Survival Plane v0.2 green
        run: python3 protection/rescue/v0.2/test_survival_plane.py

      - name: Keep Project Rescue v0.1 green
        run: python3 protection/rescue/v0.1/test_rescue_assessor.py

      - name: Assert CHSP v0.5 has no network, Git, account or external process execution surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          path = Path('protocols/chsp/v0.5/chsp_v05.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          forbidden = {'socket', 'urllib', 'http', 'requests', 'subprocess', 'git', 'paramiko'}
          found = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  found.update(alias.name.split('.')[0] for alias in node.names if alias.name.split('.')[0] in forbidden)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  root = node.module.split('.')[0]
                  if root in forbidden:
                      found.add(root)
          if found:
              raise SystemExit(f'forbidden external execution/network imports: {sorted(found)}')
          print('local-only execution surface: PASS')
          PY

      - name: Assert protocol stewardship is not external control
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('protocols/chsp/v0.5')
          state_schema = json.load((root / 'chsp-canonical-stewardship-state.schema.json').open())
          state_claims = state_schema['properties']['claims']['properties']
          assert state_claims['chsp_protocol_canonical_stewardship_effective']['const'] is True
          assert state_claims['effective_scope_chsp_protocol_only']['const'] is True
          for key in [
              'repository_ownership_transferred','account_control_transferred','canonical_origin_mutated',
              'canonical_publication_executed','external_system_control_changed','kontur_activated',
              'predecessor_legal_rights_adjudicated','legal_ownership_adjudicated',
              'distributed_consensus_established','universal_trust_established'
          ]:
              assert state_claims[key]['const'] is False, key
          receipt_schema = json.load((root / 'chsp-handover-execution-receipt.schema.json').open())
          receipt_claims = receipt_schema['properties']['claims']['properties']
          assert receipt_claims['chsp_handover_execution_performed']['const'] is True
          assert receipt_claims['chsp_stewardship_state_recorded']['const'] is True
          for key in [
              'recorder_is_authority_source','repository_ownership_transferred','account_control_transferred',
              'canonical_origin_mutated','canonical_publication_executed','external_system_mutation_performed',
              'kontur_activated','global_revocation_absence_proven','global_replay_prevention_established',
              'legal_effect_established','distributed_consensus_established','universal_trust_established'
          ]:
              assert receipt_claims[key]['const'] is False, key
          print('CHSP protocol/external-control separation: PASS')
          PY
