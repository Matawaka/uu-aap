name: KONTUR Useful Interaction Evidence Admission v0.1
on:
  pull_request:
    paths:
      - 'pilots/kontur-game-companion/useful-interaction-evidence-admission-v0.1/**'
      - '.github/workflows/kontur-useful-interaction-evidence-admission-v0.1.yml'
  push:
    branches: [main]
    paths:
      - 'pilots/kontur-game-companion/useful-interaction-evidence-admission-v0.1/**'
      - '.github/workflows/kontur-useful-interaction-evidence-admission-v0.1.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python pilots/kontur-game-companion/useful-interaction-evidence-admission-v0.1/validate.py
      - run: python pilots/kontur-game-companion/interaction-receipt/validate.py
      - run: python pilots/kontur-game-companion/integrated-conversation-trace/validate.py
      - run: python pilots/kontur-game-companion/external-observation-session/field-evidence/terminal-state-commit-001/validate.py
      - run: node pilots/kontur-game-companion/non-binding-attention-v0.1/test-attention.js
      - run: test -z "$(git status --porcelain)"
