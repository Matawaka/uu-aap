name: Protocol registry validation

on:
  pull_request:
    paths:
      - "protocols/registry/**"
      - "protocols/ccrp/v0.1/release-manifest.json"
      - "protocols/ccrp/checkpoints/ccrp-v0.1-release.json"
      - ".github/workflows/protocol-registry-validation.yml"
  push:
    branches:
      - main
    paths:
      - "protocols/registry/**"
      - "protocols/ccrp/v0.1/release-manifest.json"
      - "protocols/ccrp/checkpoints/ccrp-v0.1-release.json"
      - ".github/workflows/protocol-registry-validation.yml"

permissions:
  contents: read

jobs:
  validate-registry:
    name: Protocol registry validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate registry Git bindings
        run: node protocols/registry/v0.1/validate-registry.js
      - name: Test exact resolver behavior
        run: node protocols/registry/v0.1/test-resolver.js
