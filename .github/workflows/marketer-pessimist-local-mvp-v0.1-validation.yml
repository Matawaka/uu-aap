name: Маркетолог Пессимиста Local Stress-Test MVP v0.1 validation

on:
  pull_request:
    paths:
      - "products/marketer-pessimist/v0.1/local-mvp/**"
      - "products/marketer-pessimist/v0.1/product-contract.json"
      - "products/marketer-pessimist/v0.1/validate_contract.py"
      - "schemas/product-contract/v0.1/**"
      - ".github/workflows/marketer-pessimist-local-mvp-v0.1-validation.yml"
  push:
    branches: [main]
    paths:
      - "products/marketer-pessimist/v0.1/local-mvp/**"
      - "products/marketer-pessimist/v0.1/product-contract.json"
      - "products/marketer-pessimist/v0.1/validate_contract.py"
      - ".github/workflows/marketer-pessimist-local-mvp-v0.1-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ORIGIN_FRONTIER: a9e948af070fb2606051476cb6b6fdcb744a74fb
      EXPECTED_CONTRACT_HASH: sha256:83a61669152e34221ab2df1f5024211356a10a4e347ef86b27a8e11d96f46fa6
      MVP_EXAMPLE: products/marketer-pessimist/v0.1/local-mvp/examples/synthetic-onboarding.input.json
      MVP_RECEIPT: /tmp/marketer-pessimist-stress-test-receipt.json
      PYTHONPYCACHEPREFIX: /tmp/marketer-pessimist-local-mvp-pycache
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema>=4.22,<5"

      - name: Verify successor origin and unchanged Product Contract identity
        run: |
          git cat-file -e "${ORIGIN_FRONTIER}^{commit}"
          git merge-base --is-ancestor "$ORIGIN_FRONTIER" HEAD
          python - <<'PY'
          import json, os
          from pathlib import Path
          contract = json.loads(Path('products/marketer-pessimist/v0.1/product-contract.json').read_text(encoding='utf-8'))
          assert contract['identity']['content_hash'] == os.environ['EXPECTED_CONTRACT_HASH']
          assert contract['contract_id'] == 'marketer-pessimist-product-contract'
          assert contract['product']['id'] == 'marketer-pessimist'
          print('PASS: exact predecessor Product Contract identity preserved')
          PY

      - name: Re-run canonical Product Contract validator
        run: python products/marketer-pessimist/v0.1/validate_contract.py

      - name: Check local MVP JavaScript syntax
        run: |
          node --check products/marketer-pessimist/v0.1/local-mvp/stress-test.js
          node --check products/marketer-pessimist/v0.1/local-mvp/receipt-binding.js
          node --check products/marketer-pessimist/v0.1/local-mvp/test-stress-test.js
          node --check products/marketer-pessimist/v0.1/local-mvp/test-receipt-binding.js

      - name: Validate committed synthetic input
        run: node products/marketer-pessimist/v0.1/local-mvp/stress-test.js validate "$MVP_EXAMPLE"

      - name: Run Маркетолог Пессимиста local MVP conformance
        run: node products/marketer-pessimist/v0.1/local-mvp/test-stress-test.js

      - name: Validate exact receipt/input binding
        run: node products/marketer-pessimist/v0.1/local-mvp/test-receipt-binding.js

      - name: Validate schema/runtime parity
        run: node products/marketer-pessimist/v0.1/local-mvp/test-schema-runtime-parity.js

      - name: Validate import safety
        run: node products/marketer-pessimist/v0.1/local-mvp/test-import-safe.js

      - name: Validate input and generated receipt against JSON Schemas
        run: |
          node products/marketer-pessimist/v0.1/local-mvp/stress-test.js stress-test "$MVP_EXAMPLE" > "$MVP_RECEIPT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          base = Path('products/marketer-pessimist/v0.1/local-mvp')
          pairs = [
              (base / 'input.schema.json', Path(os.environ['MVP_EXAMPLE'])),
              (base / 'receipt.schema.json', Path(os.environ['MVP_RECEIPT'])),
          ]
          for schema_path, data_path in pairs:
              schema = json.loads(schema_path.read_text(encoding='utf-8'))
              data = json.loads(data_path.read_text(encoding='utf-8'))
              Draft202012Validator(schema, format_checker=FormatChecker()).validate(data)
              print(f'PASS: {data_path} validates against {schema_path}')
          PY

      - name: Validate CLI command boundary
        run: |
          node products/marketer-pessimist/v0.1/local-mvp/stress-test.js help
          for cmd in publish send campaign spend target profile execute mutate reject accept; do
            if node products/marketer-pessimist/v0.1/local-mvp/stress-test.js "$cmd" - >/tmp/marketer-mvp.out 2>/tmp/marketer-mvp.err; then
              echo "forbidden command accepted: $cmd" >&2
              exit 1
            fi
            grep -q "MARKETER_PESSIMIST_LOCAL_MVP_REJECTED" /tmp/marketer-mvp.err
          done

      - name: Guard production runtime as local no-effect
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const files = [
            'products/marketer-pessimist/v0.1/local-mvp/stress-test.js',
            'products/marketer-pessimist/v0.1/local-mvp/receipt-binding.js'
          ];
          const text = files.map(file => fs.readFileSync(file, 'utf8')).join('\n');
          const forbidden = [
            'child_process',
            "require('http')",
            "require('https')",
            'http.request',
            'https.request',
            'fetch(',
            'XMLHttpRequest',
            'WebSocket',
            'writeFileSync',
            'writeFile(',
            'appendFile',
            'execSync',
            'spawnSync',
            'OpenAI',
            'Anthropic'
          ];
          for (const token of forbidden) {
            if (text.includes(token)) throw new Error(`forbidden production surface: ${token}`);
          }
          console.log('PASS: production MVP surface is deterministic local no-effect');
          NODE

      - name: Confirm repository checkout unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
