name: KONTUR Game Companion runtime transport binding grant validation

on:
  pull_request:
    paths:
      - 'pilots/kontur-game-companion/runtime-transport-binding-grant/**'
      - '.github/workflows/kontur-game-companion-runtime-transport-binding-grant.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-runtime-transport-binding-grant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate separate runtime transport binding grant boundary
        run: python pilots/kontur-game-companion/runtime-transport-binding-grant/validate.py
