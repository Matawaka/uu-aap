name: Core Pilot 003 validation

on:
  pull_request:
    paths:
      - 'pilots/core-pilot-003/**'
      - '.github/workflows/core-pilot-003.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bounded delegation
        run: python pilots/core-pilot-003/validate.py
