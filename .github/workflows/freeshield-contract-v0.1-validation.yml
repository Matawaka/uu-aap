name: FREESHIELD Protective Contract v0.1 validation

on:
  pull_request:
    paths:
      - "products/freeshield/v0.1/**"
      - "schemas/product-contract/v0.1/**"
      - "ROADMAP.md"
      - "README.ru.md"
      - ".github/workflows/freeshield-contract-v0.1-validation.yml"
  push:
    branches:
      - main
    paths:
      - "products/freeshield/v0.1/**"
      - "schemas/product-contract/v0.1/**"
      - "ROADMAP.md"
      - "README.ru.md"
      - ".github/workflows/freeshield-contract-v0.1-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Reusable schema + FREESHIELD fail-closed semantics
    runs-on: ubuntu-latest
    env:
      PYTHONPYCACHEPREFIX: /tmp/freeshield-pycache
      EXPECTED_ORIGIN_FRONTIER: c831b643a9b984a274c5093033c28ea4a8a26794
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema>=4.22,<5"

      - name: Verify exact origin frontier
        run: |
          git cat-file -e "${EXPECTED_ORIGIN_FRONTIER}^{commit}"
          git merge-base --is-ancestor "$EXPECTED_ORIGIN_FRONTIER" HEAD
          test "$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('products/freeshield/v0.1/product-contract.json').read_text(encoding='utf-8'))['frontier']['revision'])
          PY
          )" = "$EXPECTED_ORIGIN_FRONTIER"

      - name: Check validator syntax
        run: |
          python -m py_compile schemas/product-contract/v0.1/validate_product_contract.py
          python -m py_compile products/freeshield/v0.1/validate_contract.py

      - name: Validate reusable Product Contract v0.1
        run: python schemas/product-contract/v0.1/validate_product_contract.py

      - name: Validate FREESHIELD Protective Contract v0.1
        run: python products/freeshield/v0.1/validate_contract.py

      - name: Guard validators as local-only
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('schemas/product-contract/v0.1/validate_product_contract.py'),
              Path('products/freeshield/v0.1/validate_contract.py'),
          ]
          forbidden = [
              'subprocess',
              'socket',
              'urllib',
              'requests',
              'http.client',
              'child_process',
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              for token in forbidden:
                  assert token not in text, f'{path}: {token}'
          print('PASS: Product Contract and FREESHIELD validators are local-only')
          PY

      - name: Confirm validation did not mutate checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
