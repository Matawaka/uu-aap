name: Маркетолог Пессимиста Product Contract v0.1 validation

on:
  pull_request:
    paths:
      - "products/marketer-pessimist/v0.1/**"
      - "schemas/product-contract/v0.1/**"
      - "ROADMAP.md"
      - "README.ru.md"
      - ".github/workflows/marketer-pessimist-contract-v0.1-validation.yml"
  push:
    branches:
      - main
    paths:
      - "products/marketer-pessimist/v0.1/**"
      - "schemas/product-contract/v0.1/**"
      - "ROADMAP.md"
      - "README.ru.md"
      - ".github/workflows/marketer-pessimist-contract-v0.1-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Reusable schema + product-specific fail-closed validation
    runs-on: ubuntu-latest
    env:
      PYTHONPYCACHEPREFIX: /tmp/marketer-pessimist-pycache
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema>=4.22,<5"

      - name: Check validator syntax
        run: |
          python -m py_compile schemas/product-contract/v0.1/validate_product_contract.py
          python -m py_compile products/marketer-pessimist/v0.1/validate_contract.py

      - name: Verify exact origin frontier exists and is an ancestor
        run: |
          FRONTIER="$(python - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('products/marketer-pessimist/v0.1/product-contract.json').read_text(encoding='utf-8'))
          print(contract['frontier']['revision'])
          PY
          )"
          test "$FRONTIER" = "70c1dfe0e2d4f3e8401050c4e7f56a5e76d11b4d"
          git cat-file -e "${FRONTIER}^{commit}"
          git merge-base --is-ancestor "$FRONTIER" HEAD

      - name: Revalidate reusable Product Contract layer
        run: python schemas/product-contract/v0.1/validate_product_contract.py

      - name: Validate Маркетолог Пессимиста Product Contract
        run: python products/marketer-pessimist/v0.1/validate_contract.py

      - name: Guard product validator as local-only
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('products/marketer-pessimist/v0.1/validate_contract.py').read_text(encoding='utf-8')
          forbidden = [
              'subprocess',
              'socket',
              'urllib',
              'requests',
              'http.client',
              'child_process',
          ]
          for token in forbidden:
              assert token not in text, token
          print('PASS: Маркетолог Пессимиста contract validator is local-only')
          PY

      - name: Confirm validation did not mutate checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
