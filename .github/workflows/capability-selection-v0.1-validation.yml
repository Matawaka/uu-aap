name: UU-AAP Capability Selection v0.1 validation

on:
  pull_request:
    paths:
      - 'protocols/integration/capability-selection/v0.1/**'
      - '.github/workflows/capability-selection-v0.1-validation.yml'
      - 'protocols/integration/execution-capability-descriptor/v0.1/**'
      - 'protocols/integration/execution-lifecycle/v0.1/**'
      - 'protocols/core/v0.1/**'
  push:
    branches: [ main ]
    paths:
      - 'protocols/integration/capability-selection/v0.1/**'
      - '.github/workflows/capability-selection-v0.1-validation.yml'
      - 'protocols/integration/execution-capability-descriptor/v0.1/**'
      - 'protocols/integration/execution-lifecycle/v0.1/**'
      - 'protocols/core/v0.1/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate UU-AAP Core v0.1
        run: node protocols/core/v0.1/validate-core.js
      - name: Validate Bounded Execution Lifecycle v0.1
        run: node protocols/integration/execution-lifecycle/v0.1/validate-execution-lifecycle.js
      - name: Validate Execution Capability Descriptor v0.1
        run: |
          node protocols/integration/execution-capability-descriptor/v0.1/validate-execution-capability-descriptor.js
          node protocols/integration/execution-capability-descriptor/v0.1/test-import-safe-validator.js
      - name: Validate Capability Selection v0.1 historical conformance
        run: |
          node --check protocols/integration/capability-selection/v0.1/validate-capability-selection.js
          node protocols/integration/capability-selection/v0.1/validate-capability-selection.js
      - name: Validate Capability Selection import-safe library seam
        run: |
          node --check protocols/integration/capability-selection/v0.1/test-import-safe-validator.js
          node protocols/integration/capability-selection/v0.1/test-import-safe-validator.js
