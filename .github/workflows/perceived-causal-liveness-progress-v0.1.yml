name: Perceived Causal Liveness Progress v0.1
on:
  pull_request:
    paths:
      - 'protocols/experimental/perceived-causal-liveness/v0.1/**'
      - '.github/workflows/perceived-causal-liveness-progress-v0.1.yml'
  push:
    branches: [main]
    paths:
      - 'protocols/experimental/perceived-causal-liveness/v0.1/**'
      - '.github/workflows/perceived-causal-liveness-progress-v0.1.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check protocols/experimental/perceived-causal-liveness/v0.1/progress.js
          node protocols/experimental/perceived-causal-liveness/v0.1/test-progress.js
      - run: test -z "$(git status --porcelain)"
