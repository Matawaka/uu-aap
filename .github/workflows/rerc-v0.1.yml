name: RERC v0.1

on:
  pull_request:
    paths:
      - 'protocols/integration/rerc/v0.1/**'
      - '.github/workflows/rerc-v0.1.yml'
  push:
    branches: [main]
    paths:
      - 'protocols/integration/rerc/v0.1/**'
      - '.github/workflows/rerc-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORIGIN_FRONTIER: 0039375897f2de683afac62e902335f53a1a7d98

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
      - name: Run RERC semantic and hostile vectors
        run: node protocols/integration/rerc/v0.1/test-rerc.js /tmp/rerc-v0.1
      - name: Validate generated graph/receipt schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root=Path('protocols/integration/rerc/v0.1'); out=Path('/tmp/rerc-v0.1')
          gs=json.loads((root/'relation-graph.schema.json').read_text())
          rs=json.loads((root/'suppression-compression-receipt.schema.json').read_text())
          Draft202012Validator.check_schema(gs); Draft202012Validator.check_schema(rs)
          gv=Draft202012Validator(gs); rv=Draft202012Validator(rs)
          for n in ['observed-graph.json','operational-graph.json','restored-graph.json']:
            gv.validate(json.loads((out/n).read_text()))
          rv.validate(json.loads((out/'suppression-receipt.json').read_text()))
          print('RERC_SCHEMAS_PASS')
          PY
      - name: Guard immutable predecessor/Core/interface boundaries
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "$ORIGIN_FRONTIER" HEAD -- \
            protocols/core/ SPEC.md PRINCIPLES.md CONTESTABILITY.md RESPONSIBILITY.md \
            schema/uu-aap-manifest.schema.json docs/ROADMAP-CURRENT.md \
            tooling/backlog-entity-reconciliation/v0.1/ protocols/interface-registry/v0.1/ \
            protocols/integration/event-responsive-dormancy/v0.1/
      - name: Require RERC-only diff
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            case "$p" in
              .github/workflows/rerc-v0.1.yml|protocols/integration/rerc/v0.1/*) ;;
              *) echo "unexpected changed path: $p" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$ORIGIN_FRONTIER" HEAD)
      - name: Clean tree
        run: test -z "$(git status --porcelain --untracked-files=all)"
