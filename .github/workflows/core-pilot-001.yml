name: Core Pilot 001 validation

on:
  pull_request:
    paths:
      - 'pilots/core-pilot-001/**'
      - '.github/workflows/core-pilot-001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Core Pilot 001
        run: python pilots/core-pilot-001/validate.py
