name: KONTUR Game Companion observational lane validation

on:
  pull_request:
    paths:
      - 'pilots/kontur-game-companion/observational-lane/**'
      - '.github/workflows/kontur-game-companion-observational-lane.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate cautious parallel observational boundary
        run: python pilots/kontur-game-companion/observational-lane/validate.py
