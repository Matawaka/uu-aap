name: OpenAI Content Provenance Reference Adapter v0.1

on:
  pull_request:
    paths:
      - 'scripts/openai-provenance-reference-adapter/**'
      - '.github/workflows/openai-provenance-reference-adapter-v0.1.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/openai-provenance-reference-adapter/**'
      - '.github/workflows/openai-provenance-reference-adapter-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  deterministic-reference-adapter:
    name: deterministic provider adapter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install schema validator
        run: python -m pip install 'jsonschema>=4.22,<5'

      - name: Syntax check without repository writes
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for path in [
              Path('scripts/openai-provenance-reference-adapter/adapter.py'),
              Path('scripts/openai-provenance-reference-adapter/test_adapter.py'),
          ]:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              print(f'PASS syntax: {path}')
          PY

      - name: Run deterministic and hostile-vector tests
        run: python scripts/openai-provenance-reference-adapter/test_adapter.py

      - name: Reproduce committed receipt exactly
        shell: bash
        run: |
          set -euo pipefail
          python scripts/openai-provenance-reference-adapter/adapter.py \
            scripts/openai-provenance-reference-adapter/fixtures/both-detected.json \
            > /tmp/openai-provenance-receipt.json
          diff -u \
            scripts/openai-provenance-reference-adapter/expected-both-detected-receipt.json \
            /tmp/openai-provenance-receipt.json

      - name: Validate receipt schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('scripts/openai-provenance-reference-adapter')
          schema = json.loads((root / 'openai-provenance-evidence-receipt.schema.json').read_text())
          receipt = json.loads((root / 'expected-both-detected-receipt.json').read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(receipt)
          print('PASS: OpenAIProvenanceEvidenceReceipt schema')
          PY

      - name: Re-run predecessor semantic-boundary rubric
        run: node scripts/c2pa-semantic-boundary/test.js

      - name: Confirm Core remains untouched
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.base_ref || 'main' }}"
          git fetch -q origin "$base_ref" --depth=1
          base_sha="$(git rev-parse FETCH_HEAD)"
          if ! git diff --quiet "$base_sha" -- protocols/core/; then
            echo 'ERROR: provider reference adapter must not modify UU-AAP Core' >&2
            git diff --name-only "$base_sha" -- protocols/core/ >&2
            exit 1
          fi

      - name: Working tree remains clean
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$dirty" ]]; then
            echo 'ERROR: validation changed the repository working tree' >&2
            printf '%s\n' "$dirty" >&2
            exit 1
          fi
