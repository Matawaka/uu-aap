name: MarketCloser Response Candidate Construction v0.1 validation

on:
  pull_request:
    paths:
      - 'applications/marketcloser/v0.1/response-candidate/v0.1/**'
      - '.github/workflows/marketcloser-response-candidate-v0.1-validation.yml'
  push:
    branches: [main]
    paths:
      - 'applications/marketcloser/v0.1/response-candidate/v0.1/**'
      - '.github/workflows/marketcloser-response-candidate-v0.1-validation.yml'

permissions:
  contents: read

env:
  ORIGIN_FRONTIER: 0cac7d49bda673f6bd500fcedf74031064f8ee53
  LAYER: applications/marketcloser/v0.1/response-candidate/v0.1
  FIXTURE: applications/marketcloser/v0.1/response-candidate/v0.1/examples/synthetic-response-wait.input.json
  WAIT_RECEIPT: /tmp/marketcloser-response-wait-receipt.json
  POS_INPUT: /tmp/marketcloser-response-positive-input.json
  POS_RECEIPT: /tmp/marketcloser-response-positive-receipt.json
  PYTHONPYCACHEPREFIX: /tmp/marketcloser-response-candidate-pycache

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JSON Schema validator
        run: python -m pip install 'jsonschema>=4.22,<5'

      - name: Verify exact successor origin
        run: |
          git cat-file -e "${ORIGIN_FRONTIER}^{commit}"
          git merge-base --is-ancestor "$ORIGIN_FRONTIER" HEAD

      - name: Re-run MarketCloser application and data predecessors
        run: |
          python applications/marketcloser/v0.1/validate_boundary.py
          node applications/marketcloser/v0.1/deployment-observation/v0.1/test-deployment-observation.js
          node applications/marketcloser/v0.1/deployment-observation/v0.1/test-receipt-binding.js
          node applications/marketcloser/v0.1/minimized-real-review-bridge/v0.1/test-bridge.js
          node applications/marketcloser/v0.1/minimized-real-review-bridge/v0.1/test-receipt-binding.js

      - name: Re-run authority permit and revalidation predecessors
        run: |
          node applications/marketcloser/v0.1/real-review-run-authority-gate/v0.1/test-authority-gate.js
          node applications/marketcloser/v0.1/real-review-run-permit/v0.1/test-permit.js
          node applications/marketcloser/v0.1/real-review-run-permit/v0.1/test-receipt-binding.js
          node applications/marketcloser/v0.1/real-review-local-run-revalidation/v0.1/test-revalidation.js
          node applications/marketcloser/v0.1/real-review-local-run-revalidation/v0.1/test-receipt-binding.js

      - name: Re-run Real Stress-Test Adapter predecessor
        run: |
          node applications/marketcloser/v0.1/real-stress-test-adapter/v0.1/test-engine-parity.js
          node applications/marketcloser/v0.1/real-stress-test-adapter/v0.1/test-adapter.js
          node applications/marketcloser/v0.1/real-stress-test-adapter/v0.1/test-receipt-binding.js

      - name: Re-run Human Analysis Disposition predecessor
        run: |
          node applications/marketcloser/v0.1/human-analysis-disposition/v0.1/test-disposition.js
          node applications/marketcloser/v0.1/human-analysis-disposition/v0.1/test-receipt-binding.js
          node applications/marketcloser/v0.1/human-analysis-disposition/v0.1/test-schema-runtime-parity.js

      - name: Re-run Marketer Pessimist contract and analysis predecessors
        run: |
          python products/marketer-pessimist/v0.1/validate_contract.py
          node products/marketer-pessimist/v0.1/local-mvp/test-stress-test.js
          node products/marketer-pessimist/v0.1/local-mvp/test-receipt-binding.js
          node products/marketer-pessimist/v0.1/real-review-intake/v0.1/test-intake.js
          node products/marketer-pessimist/v0.1/real-review-intake/v0.1/test-candidate-binding.js

      - name: Check response candidate JavaScript syntax
        run: |
          node --check "$LAYER/response-candidate.js"
          node --check "$LAYER/receipt-binding.js"
          node --check "$LAYER/synthetic-positive-helper.js"
          node --check "$LAYER/test-response-candidate.js"
          node --check "$LAYER/test-receipt-binding.js"
          node --check "$LAYER/test-schema-runtime-parity.js"
          node --check "$LAYER/test-import-safe.js"

      - name: Validate committed waiting fixture
        run: node "$LAYER/response-candidate.js" validate "$FIXTURE"

      - name: Confirm committed fixture cannot construct a response candidate
        run: |
          node "$LAYER/response-candidate.js" inspect "$FIXTURE" > /tmp/marketcloser-response-wait-inspection.json
          node - <<'NODE'
          const fs = require('fs');
          const R = require('./applications/marketcloser/v0.1/response-candidate/v0.1/response-candidate.js');
          const input = JSON.parse(fs.readFileSync(process.env.FIXTURE, 'utf8'));
          const inspection = JSON.parse(fs.readFileSync('/tmp/marketcloser-response-wait-inspection.json', 'utf8'));
          if (inspection.classification !== 'DISPOSITION_ACCEPTANCE_REQUIRED') throw new Error('committed fixture unexpectedly advanced');
          if (inspection.response_candidate_created !== false) throw new Error('committed fixture created candidate');
          const receipt = R.deriveReceipt(input);
          fs.writeFileSync(process.env.WAIT_RECEIPT, `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          if node "$LAYER/response-candidate.js" candidate "$FIXTURE" >/tmp/unexpected-response-candidate.json 2>/tmp/expected-response-rejection.log; then
            echo 'Committed waiting fixture unexpectedly constructed a response candidate' >&2
            exit 1
          fi

      - name: Run response candidate conformance
        run: node "$LAYER/test-response-candidate.js"

      - name: Validate exact response candidate source binding
        run: node "$LAYER/test-receipt-binding.js"

      - name: Validate schema runtime parity
        run: node "$LAYER/test-schema-runtime-parity.js"

      - name: Validate import safety
        run: node "$LAYER/test-import-safe.js"

      - name: Validate waiting and positive JSON Schemas
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          base = Path(os.environ['LAYER'])
          pairs = [
              (base / 'input.schema.json', Path(os.environ['FIXTURE'])),
              (base / 'receipt.schema.json', Path(os.environ['WAIT_RECEIPT'])),
              (base / 'input.schema.json', Path(os.environ['POS_INPUT'])),
              (base / 'receipt.schema.json', Path(os.environ['POS_RECEIPT'])),
          ]
          for schema_path, instance_path in pairs:
              schema = json.loads(schema_path.read_text(encoding='utf-8'))
              instance = json.loads(instance_path.read_text(encoding='utf-8'))
              Draft202012Validator(schema, format_checker=FormatChecker()).validate(instance)
              print(f'VALID schema: {instance_path}')
          PY

      - name: Validate CLI boundary
        run: |
          node "$LAYER/response-candidate.js" help >/dev/null
          node "$LAYER/response-candidate.js" validate "$FIXTURE" >/dev/null
          node "$LAYER/response-candidate.js" inspect "$FIXTURE" >/dev/null
          for command in approve copy export publish send respond campaign provider mutate execute authorize permit; do
            if node "$LAYER/response-candidate.js" "$command" "$FIXTURE" >/tmp/forbidden.out 2>/tmp/forbidden.err; then
              echo "Forbidden command unexpectedly succeeded: $command" >&2
              exit 1
            fi
          done

      - name: Guard production surface as local deterministic draft constructor
        run: |
          if grep -En "writeFile|appendFile|createWriteStream|child_process|exec\\(|spawn\\(|fetch\\(|http\\.|https\\.|net\\.|dgram|OpenAI|Anthropic" "$LAYER/response-candidate.js" "$LAYER/receipt-binding.js"; then
            echo 'Forbidden production mutation/network/provider surface detected' >&2
            exit 1
          fi

      - name: Confirm no real or accepted response evidence is committed
        run: |
          ! grep -R "matawaka-marketcloser-public-34a3.twc1.net" "$LAYER"
          ! grep -R '"disposition_receipt"[[:space:]]*:[[:space:]]*{' "$LAYER/examples"
          ! grep -R '"customer_context"[[:space:]]*:[[:space:]]*{' "$LAYER/examples"
          ! grep -R '"classification"[[:space:]]*:[[:space:]]*"RESPONSE_CANDIDATE_READY"' "$LAYER/examples"
          ! grep -R '"approved"[[:space:]]*:[[:space:]]*true' "$LAYER/examples"
          ! grep -R '"published"[[:space:]]*:[[:space:]]*true' "$LAYER/examples"

      - name: Confirm repository checkout unchanged
        run: test -z "$(git status --porcelain)"
