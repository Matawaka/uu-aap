name: Architecture Convergence Readiness v0.1 validation

on:
  pull_request:
    paths:
      - 'docs/ARCHITECTURE-CONVERGENCE-READINESS-v0.1.md'
      - 'schemas/architecture/v0.1/**'
      - '.github/workflows/architecture-convergence-readiness-v0.1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python and JSON syntax
        run: |
          python -m py_compile schemas/architecture/v0.1/architecture_convergence_assessor.py
          python -m py_compile schemas/architecture/v0.1/tests/test_architecture_convergence_readiness_v01.py
          python -m json.tool schemas/architecture/v0.1/architecture-convergence-readiness.schema.json >/dev/null
          python -m json.tool schemas/architecture/v0.1/examples/architecture-convergence-readiness.example.json >/dev/null

      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'

      - name: Exercise architecture convergence readiness
        run: python schemas/architecture/v0.1/tests/test_architecture_convergence_readiness_v01.py

      - name: Verify predecessor Git object and ancestry, then assess convergence
        run: |
          PREDECESSOR="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('schemas/architecture/v0.1/examples/architecture-convergence-readiness.example.json').read_text())['canonical_predecessor_sha'])
          PY
          )"
          ASSESSED="$(git rev-parse HEAD)"
          git cat-file -e "${PREDECESSOR}^{commit}"
          git merge-base --is-ancestor "$PREDECESSOR" "$ASSESSED"
          python schemas/architecture/v0.1/architecture_convergence_assessor.py \
            schemas/architecture/v0.1/examples/architecture-convergence-readiness.example.json \
            --repo-root . \
            --observed-predecessor-sha "$PREDECESSOR" \
            --assessed-revision-sha "$ASSESSED" \
            --predecessor-object-exists true \
            --predecessor-is-ancestor true

      - name: Keep Sustainability Kernel closure green
        run: python schemas/sustainability/v0.1/tests/test_kernel_conformance_closure_v01.py

      - name: Keep CHSP v1.1 stabilization green
        run: python protocols/chsp/v1.1/test_chsp_v11.py

      - name: Keep Rescue v0.6 recognition green
        run: python protection/rescue/v0.6/test_canonical_recognition.py

      - name: Keep KONTUR readiness aggregation green without activation
        run: node server/kontur/v0.1/test-readiness-aggregator.js

      - name: Assert convergence assessor has no external execution surface
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p = Path('schemas/architecture/v0.1/architecture_convergence_assessor.py')
          tree = ast.parse(p.read_text())
          banned = {'socket','subprocess','urllib','requests','http','paramiko'}
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      assert alias.name.split('.')[0] not in banned, alias.name
              if isinstance(node, ast.ImportFrom) and node.module:
                  assert node.module.split('.')[0] not in banned, node.module
          print('assessor external execution surface: absent')
          PY

      - name: Assert workflow remains read-only and activation-free
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/architecture-convergence-readiness-v0.1-validation.yml').read_text()
          forbidden = [
              'contents:' + ' write',
              'pull_request' + '_target',
              'secrets' + '.',
              'activation-' + 'executor.js',
          ]
          for token in forbidden:
              assert token not in text, token
          assert 'permissions:\n  contents: read' in text
          print('workflow boundary: read-only and activation-free')
          PY
