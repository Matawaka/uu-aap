          fi

      - name: Confirm Successor Proposal Sidecar is not a Genesis PoAI record
        run: |
          if python proposals/poai/tools/validate_poai.py --schema proposals/poai/schema/poai-record.schema.json /tmp/successor-proposal-sidecar.json; then
