      - name: Confirm Observed Outcome Sidecar is not a Genesis PoAI record
        run: |
          if python proposals/poai/tools/validate_poai.py --schema proposals/poai/schema/poai-record.schema.json /tmp/outcome-sidecar.json; then
            echo "ERROR: experimental Observed Outcome Sidecar was incorrectly accepted as a Genesis PoAI record"; exit 1
          else
