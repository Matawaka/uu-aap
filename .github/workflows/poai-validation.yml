      - name: Confirm Binding Receipt is not a Genesis PoAI record
        run: |
          if python proposals/poai/tools/validate_poai.py --schema proposals/poai/schema/poai-record.schema.json /tmp/binding-receipt.json; then
            echo "ERROR: experimental Binding Receipt was incorrectly accepted as a Genesis PoAI record"; exit 1
          else
            echo "Expected separation confirmed: Binding Receipt is outside the Genesis PoAI record schema"
          fi

      - name: Confirm Signature Envelope is not a Genesis PoAI record
        run: |
          if python proposals/poai/tools/validate_poai.py --schema proposals/poai/schema/poai-record.schema.json /tmp/signature-envelope.json; then
            echo "ERROR: experimental Signature Envelope was incorrectly accepted as a Genesis PoAI record"; exit 1
          else
            echo "Expected separation confirmed: Signature Envelope is outside the Genesis PoAI record schema"
          fi

      - name: Confirm Key Continuity Envelope is not a Genesis PoAI record
        run: |
          if python proposals/poai/tools/validate_poai.py --schema proposals/poai/schema/poai-record.schema.json /tmp/key-continuity-envelope.json; then
