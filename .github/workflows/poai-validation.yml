name: PoAI Genesis validation

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "proposals/poai/**"
      - "docs/poai/**"
      - ".github/workflows/poai-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: PoAI Genesis validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema>=4.22,<5"

      - name: Validate public examples
        run: |
          python proposals/poai/tools/validate_poai.py \
            --schema proposals/poai/schema/poai-record.schema.json \
            proposals/poai/examples/vibe-coding-reality.poai.json \
            proposals/poai/examples/quasi-existent-future.synthetic.poai.json \
            proposals/poai/examples/quasi-existent-future.synthetic.successor.poai.json \
            proposals/poai/examples/augmented-observer.synthetic.poai.json

      - name: Run interoperability vectors
        run: |
          python proposals/poai/tools/validate_poai.py \
            --schema proposals/poai/schema/poai-record.schema.json \
            --test-vectors proposals/poai/test-vectors

      - name: Validate materialization machine layer
        run: |
          node --check proposals/poai/materialization/tools/materialization-core.js
          node --check proposals/poai/materialization/test-materialization.js
          node proposals/poai/materialization/test-materialization.js \
            /tmp/materialization-event.json \
            /tmp/materialization-candidate.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          pairs = [
              (Path('proposals/poai/materialization/schema/materialization-policy.schema.json'), Path('proposals/poai/materialization/examples/synthetic-shipment.materialization-policy.json')),
              (Path('proposals/poai/materialization/schema/materialization-event.schema.json'), Path('/tmp/materialization-event.json')),
          ]
          for schema_path, instance_path in pairs:
              schema = json.loads(schema_path.read_text(encoding='utf-8'))
              instance = json.loads(instance_path.read_text(encoding='utf-8'))
              Draft202012Validator(schema, format_checker=FormatChecker()).validate(instance)
              print(f'VALID schema: {instance_path}')
          PY
          python proposals/poai/tools/validate_poai.py \
            --schema proposals/poai/schema/poai-record.schema.json \
            /tmp/materialization-candidate.json

      - name: Confirm materialization artifacts are not Genesis PoAI records
        run: |
          if python proposals/poai/tools/validate_poai.py --schema proposals/poai/schema/poai-record.schema.json proposals/poai/materialization/examples/synthetic-shipment.materialization-policy.json; then
            echo "ERROR: Materialization Policy was incorrectly accepted as a Genesis PoAI record"; exit 1
          else
            echo "Expected separation confirmed: Materialization Policy is outside the Genesis PoAI record schema"
          fi
          if python proposals/poai/tools/validate_poai.py --schema proposals/poai/schema/poai-record.schema.json /tmp/materialization-event.json; then
            echo "ERROR: Materialization Event was incorrectly accepted as a Genesis PoAI record"; exit 1
          else
            echo "Expected separation confirmed: Materialization Event is outside the Genesis PoAI record schema"
          fi

      - name: Validate browser interface and experimental artifacts
        run: |
          node --check docs/poai/validator.js
          node --check docs/poai/i18n.js
          node --check docs/poai/dynamic-i18n.js
          node --check docs/poai/builder-core.js
          node --check docs/poai/builder-ui.js
          node --check docs/poai/app.js
          node --check docs/poai/accessibility.js
          node --check docs/poai/review-cues.js
          node --check docs/poai/review-sidecar.js
          node --check docs/poai/appeal-sidecar.js
          node --check docs/poai/adjudication-sidecar.js
          node --check docs/poai/execution-sidecar.js
          node --check docs/poai/execution-verification-sidecar.js
          node --check docs/poai/outcome-sidecar.js
          node --check docs/poai/successor-proposal-sidecar.js
          node --check docs/poai/binding-receipt.js
          node --check docs/poai/signature-envelope.js
          node --check docs/poai/key-continuity.js
          node --check docs/poai/identity-evidence.js
          node --check docs/poai/authority-evidence.js
          node docs/poai/test-validator.js
          node docs/poai/test-dynamic-i18n.js
          node docs/poai/test-builder.js /tmp/deeper-builder.poai.json
          node docs/poai/test-review-cues.js
          node docs/poai/test-review-sidecar.js /tmp/review-sidecar.json
          node docs/poai/test-appeal-sidecar.js /tmp/appeal-sidecar.json
          node docs/poai/test-adjudication-sidecar.js /tmp/adjudication-sidecar.json
          node docs/poai/test-execution-sidecar.js /tmp/execution-sidecar.json
          node docs/poai/test-execution-verification-sidecar.js /tmp/execution-verification-sidecar.json
          node docs/poai/test-outcome-sidecar.js /tmp/outcome-sidecar.json
          node docs/poai/test-successor-proposal-sidecar.js /tmp/successor-proposal-sidecar.json
          node docs/poai/test-binding-receipt.js /tmp/binding-receipt.json
          node docs/poai/test-signature-envelope.js /tmp/signature-envelope.json
          node docs/poai/test-key-continuity.js /tmp/key-continuity-envelope.json
          node docs/poai/test-identity-evidence.js /tmp/identity-evidence.json
          node docs/poai/test-authority-evidence.js /tmp/authority-evidence.json
          python proposals/poai/tools/validate_poai.py \
            --schema proposals/poai/schema/poai-record.schema.json \
            /tmp/deeper-builder.poai.json

      - name: Confirm Review Sidecar is not a Genesis PoAI record
        run: |
          if python proposals/poai/tools/validate_poai.py --schema proposals/poai/schema/poai-record.schema.json /tmp/review-sidecar.json; then
            echo "ERROR: experimental Review Sidecar was incorrectly accepted as a Genesis PoAI record"; exit 1
          else
            echo "Expected separation confirmed: Review Sidecar is outside the Genesis PoAI record schema"
          fi

      - name: Confirm Appeal Request Sidecar is not a Genesis PoAI record
        run: |
          if python proposals/poai/tools/validate_poai.py --schema proposals/poai/schema/poai-record.schema.json /tmp/appeal-sidecar.json; then
            echo "ERROR: experimental Appeal Request Sidecar was incorrectly accepted as a Genesis PoAI record"; exit 1
          else
            echo "Expected separation confirmed: Appeal Request Sidecar is outside the Genesis PoAI record schema"
          fi

      - name: Confirm Adjudication Sidecar is not a Genesis PoAI record
        run: |
          if python proposals/poai/tools/validate_poai.py --schema proposals/poai/schema/poai-record.schema.json /tmp/adjudication-sidecar.json; then
            echo "ERROR: experimental Adjudication Sidecar was incorrectly accepted as a Genesis PoAI record"; exit 1
          else
