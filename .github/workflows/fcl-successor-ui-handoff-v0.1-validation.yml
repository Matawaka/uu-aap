name: FCL Successor UI Handoff v0.1 validation

on:
  pull_request:
    paths:
      - 'protocols/fcl/v0.1/handoff/**'
      - 'protocols/fcl/v0.1/delivery/**'
      - 'protocols/fcl/v0.1/progress/**'
      - 'protocols/fcl/v0.1/fcl.js'
      - 'protocols/fcl/v0.1/test-fcl.js'
      - '.github/workflows/fcl-successor-ui-handoff-v0.1-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'protocols/fcl/v0.1/handoff/**'
      - 'protocols/fcl/v0.1/delivery/**'
      - 'protocols/fcl/v0.1/progress/**'
      - 'protocols/fcl/v0.1/fcl.js'
      - 'protocols/fcl/v0.1/test-fcl.js'
      - '.github/workflows/fcl-successor-ui-handoff-v0.1-validation.yml'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Re-run predecessor FCL v0.1 conformance
        run: node protocols/fcl/v0.1/test-fcl.js
      - name: Re-run predecessor Progress Chain v0.1 conformance
        run: node protocols/fcl/v0.1/progress/test-progress-chain.js
      - name: Re-run predecessor Projection Delivery v0.1 conformance
        run: node protocols/fcl/v0.1/delivery/test-delivery.js
      - name: Run Successor UI Handoff v0.1 conformance
        run: node protocols/fcl/v0.1/handoff/test-handoff.js
      - name: Validate and assess handoff example
        run: |
          node protocols/fcl/v0.1/handoff/handoff.js validate protocols/fcl/v0.1/handoff/examples/successor.handoff.json
          node protocols/fcl/v0.1/handoff/handoff.js assess protocols/fcl/v0.1/handoff/examples/successor.handoff.json
