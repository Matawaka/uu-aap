name: KONTUR Game Companion local synthetic network user-surface enablement materialization validation

on:
  pull_request:
    paths:
      - 'pilots/kontur-game-companion/network-user-surface-enablement-materialization/**'
      - 'pilots/kontur-game-companion/network-user-surface-enablement-grant/**'
      - 'pilots/kontur-game-companion/network-user-surface-enablement-externalization-review/**'
      - '.github/workflows/kontur-game-companion-network-user-surface-enablement-materialization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-network-user-surface-enablement-materialization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate local synthetic network user-surface enablement materialization
        run: python pilots/kontur-game-companion/network-user-surface-enablement-materialization/validate.py
