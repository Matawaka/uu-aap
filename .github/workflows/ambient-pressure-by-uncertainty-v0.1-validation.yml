name: Ambient Pressure by Uncertainty v0.1 validation

on:
  pull_request:
    paths:
      - "protocols/integration/v0.1/ambient-pressure-by-uncertainty/**"
      - ".github/workflows/ambient-pressure-by-uncertainty-v0.1-validation.yml"
  push:
    branches:
      - main
    paths:
      - "protocols/integration/v0.1/ambient-pressure-by-uncertainty/**"
      - ".github/workflows/ambient-pressure-by-uncertainty-v0.1-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Ambient pressure uncertainty semantics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: node --check protocols/integration/v0.1/ambient-pressure-by-uncertainty/validate.js
      - name: Validate fixture and negative vectors
        run: node protocols/integration/v0.1/ambient-pressure-by-uncertainty/validate.js
      - name: Confirm read-only repository state
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
