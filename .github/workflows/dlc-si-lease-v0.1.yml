name: DLC-SI Lease Lifecycle v0.1
on:
  pull_request:
    paths:
      - 'protocols/experimental/dlc-si/v0.1/**'
      - '.github/workflows/dlc-si-lease-v0.1.yml'
  push:
    branches: [main]
    paths:
      - 'protocols/experimental/dlc-si/v0.1/**'
      - '.github/workflows/dlc-si-lease-v0.1.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check protocols/experimental/dlc-si/v0.1/lease.js
      - run: node protocols/experimental/dlc-si/v0.1/test-lease.js
      - run: test -z "$(git status --porcelain)"
