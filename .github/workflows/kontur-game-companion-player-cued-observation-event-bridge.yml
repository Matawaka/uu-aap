name: KONTUR Game Companion player-cued completed-observation context bridge validation

on:
  pull_request:
    paths:
      - 'pilots/kontur-game-companion/player-cued-observation-event-bridge/**'
      - 'pilots/kontur-game-companion/external-observation-session/**'
      - 'pilots/kontur-game-companion/external-sandbox-sidecar-ingest/**'
      - 'pilots/kontur-game-companion/local-trial-pilot/**'
      - 'pilots/kontur-game-companion/bounded-initiative/**'
      - 'pilots/kontur-game-companion/focus-diversity/**'
      - 'pilots/kontur-game-companion/interaction-receipt/**'
      - 'pilots/kontur-game-companion/pause-resume/**'
      - 'pilots/kontur-game-companion/candidate-envelope/**'
      - '.github/workflows/kontur-game-companion-player-cued-observation-event-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate player-cued completed-observation context bridge
        run: python pilots/kontur-game-companion/player-cued-observation-event-bridge/validate.py
