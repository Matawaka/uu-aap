name: Core Pilot 002 validation

on:
  pull_request:
    paths:
      - 'pilots/core-pilot-002/**'
      - '.github/workflows/core-pilot-002.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Core Pilot 002
        run: python pilots/core-pilot-002/validate.py
