name: Project Survival Plane v0.5 validation

on:
  pull_request:
    paths:
      - 'protection/rescue/v0.5/**'
      - '.github/workflows/project-survival-plane-v0.5-validation.yml'
  push:
    branches: [main]
    paths:
      - 'protection/rescue/v0.5/**'
      - '.github/workflows/project-survival-plane-v0.5-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Python and JSON syntax
        run: |
          set -euo pipefail
          python3 -m py_compile protection/rescue/v0.5/canonical_succession.py
          python3 -m py_compile protection/rescue/v0.5/test_canonical_succession.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('protection/rescue/v0.5')
          for path in sorted(root.glob('*.json')):
              json.load(path.open(encoding='utf-8'))
              print('validated', path)
          PY

      - name: Exercise Canonical Succession Proposal fail-closed boundaries
        run: python3 protection/rescue/v0.5/test_canonical_succession.py

      - name: Keep Rescue Execution Envelope v0.4 green
        run: python3 protection/rescue/v0.4/test_rescue_execution.py

      - name: Keep Survival Plane v0.3 green
        run: python3 protection/rescue/v0.3/test_survival_plane_v03.py

      - name: Keep Survival Plane v0.2 green
        run: python3 protection/rescue/v0.2/test_survival_plane.py

      - name: Keep Project Rescue v0.1 green
        run: python3 protection/rescue/v0.1/test_rescue_assessor.py

      - name: Assert v0.5 implementation cannot mutate Git or use network
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('protection/rescue/v0.5/canonical_succession.py').read_text(encoding='utf-8')
          forbidden = [
              'requests', 'urllib.request', 'http.client', 'socket.',
              '["push"', "['push'", '["fetch"', "['fetch'", '["clone"', "['clone'",
              '["update-ref"', "['update-ref'", '["tag"', "['tag'", '["branch"', "['branch'",
              'remote", "add', "remote', 'add", 'remote", "set-url', "remote', 'set-url",
          ]
          found = [item for item in forbidden if item in src]
          if found:
              raise SystemExit('forbidden network/Git mutation primitive in v0.5 implementation: ' + ', '.join(found))
          print('v0.5 remains local/read-only proposal tooling')
          PY

      - name: Assert canonical recognition remains impossible in v0.5 claims
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          root = Path('protection/rescue/v0.5')
          policy = json.loads((root / 'reference.canonical-succession-policy.json').read_text(encoding='utf-8'))
          assert policy['requirements']['human_recognition_required'] is True
          assert policy['claims']['automatic_canonical_recognition_enabled'] is False
          assert policy['claims']['automatic_origin_creation_enabled'] is False
          assert policy['claims']['ownership_transfer_enabled'] is False
          assert policy['claims']['kontur_activation_enabled'] is False

          spec = importlib.util.spec_from_file_location('succession_v05_ci', root / 'canonical_succession.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          claims = module.proposal_claims()
          assert claims['human_recognition_required'] is True
          assert claims['candidate_is_noncanonical'] is True
          for key in [
              'canonical_successor_established', 'canonical_origin_mutated', 'ownership_transferred',
              'kontur_activated', 'distributed_consensus_established', 'universal_canonicality_established',
              'legal_effect_established', 'truth_certified',
          ]:
              assert claims[key] is False, key

          proposal_schema = json.loads((root / 'canonical-succession-proposal.schema.json').read_text(encoding='utf-8'))
          pclaims = proposal_schema['properties']['claims']['properties']
          assert pclaims['human_recognition_required']['const'] is True
          assert pclaims['canonical_successor_established']['const'] is False
          assessment_schema = json.loads((root / 'canonical-succession-assessment.schema.json').read_text(encoding='utf-8'))
          aclaims = assessment_schema['properties']['claims']['properties']
          assert aclaims['human_recognition_required']['const'] is True
          assert aclaims['canonical_successor_established']['const'] is False
          print('v0.5 canonical recognition boundary remains explicit and non-executable')
          PY
