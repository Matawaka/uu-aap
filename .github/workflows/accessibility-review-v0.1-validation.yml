name: Accessibility Review v0.1 validation

on:
  pull_request:
    paths:
      - 'review/accessibility/v0.1/**'
      - '.github/workflows/accessibility-review-v0.1-validation.yml'
  push:
    branches: [main]
    paths:
      - 'review/accessibility/v0.1/**'
      - '.github/workflows/accessibility-review-v0.1-validation.yml'

permissions:
  contents: read

env:
  ORIGIN_FRONTIER: bccc88edd556546abf20f58610b40ec67c127b85
  INPUT: review/accessibility/v0.1/current-surfaces.input.json
  REPORT: /tmp/accessibility-review-v0.1.json
  P0_INPUT: /tmp/release-candidate-after-accessibility.input.json
  P0_REPORT: /tmp/release-candidate-after-accessibility.report.json

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind current reviewed frontier
        shell: bash
        run: |
          set -euo pipefail
          target="$(git rev-parse HEAD)"
          echo "TARGET_FRONTIER=$target" >> "$GITHUB_ENV"
          git cat-file -e "${ORIGIN_FRONTIER}^{commit}"
          git merge-base --is-ancestor "$ORIGIN_FRONTIER" "$target"
          git merge-base --is-ancestor 07009a16566fb839acd753215231c6a9c86a896d "$target"

      - name: Prove reviewed browser surfaces are byte-identical to origin
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            path="$1" expected="$2"
            test "$(git rev-parse "${ORIGIN_FRONTIER}:$path")" = "$expected"
            test "$(git rev-parse "${TARGET_FRONTIER}:$path")" = "$expected"
          }
          check_blob docs/index.html 0a0d47c17c1c666f6f32f1e569097248c160662d
          check_blob docs/poai/index.html a121fa138e1f984f6876e640e5583beb74c7fa3a
          check_blob docs/poai/accessibility.js 4c7837e567e51a29b0b88df9393332dd554e51c4
          check_blob docs/poai/styles.css ff742e95ac96f5d513483168ddd58ca1aa2766ea

      - name: Verify factual source observations
        shell: bash
        run: |
          set -euo pipefail
          grep -F '<html lang="en">' docs/index.html >/dev/null
          grep -F '<main>' docs/index.html >/dev/null
          grep -F 'aria-label="PoAI Level 3 tools"' docs/poai/index.html >/dev/null
          grep -F 'aria-label="PoAI JSON input"' docs/poai/index.html >/dev/null
          grep -F "setAttribute('role', 'tablist')" docs/poai/accessibility.js >/dev/null
          grep -F "setAttribute('role', 'tab')" docs/poai/accessibility.js >/dev/null
          grep -F "setAttribute('role', 'tabpanel')" docs/poai/accessibility.js >/dev/null
          for key in ArrowRight ArrowLeft Home End; do grep -F "$key" docs/poai/accessibility.js >/dev/null; done
          grep -F 'button:focus-visible' docs/poai/styles.css >/dev/null
          grep -F '@media (max-width: 820px)' docs/poai/styles.css >/dev/null
          grep -F -- '--muted: #66717f' docs/poai/styles.css >/dev/null
          grep -F -- '--surface-2: #f0f2f5' docs/poai/styles.css >/dev/null
          grep -F -- '--accent: #7aa2ff' docs/poai/styles.css >/dev/null
          grep -F 'button.primary, button.active' docs/poai/styles.css >/dev/null
          grep -F 'color: white' docs/poai/styles.css >/dev/null
          ! grep -F 'aria-live' docs/poai/index.html docs/poai/accessibility.js

      - name: Run bounded accessibility review tests
        run: |
          node --check review/accessibility/v0.1/accessibility-review.js
          node review/accessibility/v0.1/test-accessibility-review.js
          node review/accessibility/v0.1/test-import-safe.js
          node -e "JSON.parse(require('node:fs').readFileSync(process.env.INPUT,'utf8'))"

      - name: Rebind review to current equivalent frontier and assess
        shell: bash
        run: |
          set -euo pipefail
          TARGET_FRONTIER="$TARGET_FRONTIER" node <<'NODE'
          const fs = require('node:fs');
          const input = JSON.parse(fs.readFileSync(process.env.INPUT, 'utf8'));
          input.reviewed_revision = process.env.TARGET_FRONTIER;
          input.surface_equivalence_verified = true;
          fs.writeFileSync('/tmp/accessibility-review-input.json', `${JSON.stringify(input, null, 2)}\n`);
          NODE
          node review/accessibility/v0.1/accessibility-review.js /tmp/accessibility-review-input.json > "$REPORT"
          node <<'NODE'
          const r = require('/tmp/accessibility-review-v0.1.json');
          if (r.reviewed_revision !== process.env.TARGET_FRONTIER) throw new Error('review frontier mismatch');
          if (r.outcome !== 'FAIL') throw new Error(`expected factual FAIL, got ${r.outcome}`);
          if (!r.failed_dimensions.includes('color_contrast')) throw new Error('expected color_contrast finding');
          if (r.p0_mapping.status !== 'INSUFFICIENT_EVIDENCE' || r.p0_mapping.blocking !== true) throw new Error('unexpected P0 mapping');
          if (r.wcag_conformance_certified || r.universal_accessibility_proven || r.legal_compliance_established || r.release_authorized || r.authority_created || r.runtime_activated) throw new Error('review overclaim');
          NODE

      - name: Re-run Release Candidate Checkpoint with explicit accessibility outcome
        shell: bash
        run: |
          set -euo pipefail
          TARGET_FRONTIER="$TARGET_FRONTIER" node <<'NODE'
          const fs = require('node:fs');
          const input = JSON.parse(fs.readFileSync('tooling/release-candidate-checkpoint/v0.2/post-t5-frontier.input.json','utf8'));
          const review = JSON.parse(fs.readFileSync('/tmp/accessibility-review-v0.1.json','utf8'));
          const target = process.env.TARGET_FRONTIER;
          input.git_revision = target;
          for (const gate of input.engineering_evidence) gate.observed_at_revision = target;
          for (const gate of input.governance_evidence) gate.observed_at_revision = target;
          const gate = input.governance_evidence.find((x) => x.gate_id === 'accessibility');
          gate.status = review.p0_mapping.status;
          gate.blocking = review.p0_mapping.blocking;
          gate.source_path = 'review/accessibility/v0.1/README.md';
          gate.reviewed_revision = target;
          gate.explicit_review_outcome = true;
          gate.note = 'Current-frontier Accessibility Review v0.1 found a blocking color-contrast defect and additional assistive-technology evidence gaps.';
          fs.writeFileSync(process.env.P0_INPUT, `${JSON.stringify(input, null, 2)}\n`);
          NODE
          node tooling/release-candidate-checkpoint/v0.2/release-candidate-checkpoint.js "$P0_INPUT" > "$P0_REPORT"
          node <<'NODE'
          const r = require('/tmp/release-candidate-after-accessibility.report.json');
          if (r.git_revision !== process.env.TARGET_FRONTIER) throw new Error('P0 frontier mismatch');
          if (r.engineering.status !== 'PASS') throw new Error('engineering regression');
          if (r.decision !== 'BLOCKED') throw new Error(`expected BLOCKED, got ${r.decision}`);
          if (!r.blocking_findings.includes('accessibility')) throw new Error('accessibility must be blocking');
          if (r.release_authorized || r.publication_authorized || r.certification_granted || r.legal_status_established || r.authority_created || r.runtime_activated) throw new Error('P0 overclaim');
          NODE

      - name: Guard review runtime as read-only assessment
        shell: bash
        run: |
          set -euo pipefail
          runtime=review/accessibility/v0.1/accessibility-review.js
          ! grep -Eq 'child_process|execSync|spawnSync|writeFile|appendFile|createWriteStream|node:http|node:https|node:net|node:dgram|fetch\(' "$runtime"

      - name: Confirm checkout unchanged
        run: test -z "$(git status --porcelain)"

      - name: Upload accessibility and checkpoint evidence
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-review-v0.1-${{ github.sha }}
          path: |
            /tmp/accessibility-review-v0.1.json
            /tmp/release-candidate-after-accessibility.report.json
          if-no-files-found: error
