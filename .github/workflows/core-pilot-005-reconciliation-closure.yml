name: Core Pilot 005 reconciliation closure validation

on:
  pull_request:
    paths:
      - 'pilots/core-pilot-005/reconciliation-closure/**'
      - '.github/workflows/core-pilot-005-reconciliation-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate ABSENT and CONFLICT closure
        run: python pilots/core-pilot-005/reconciliation-closure/validate.py
