name: CCRP validation

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "proposals/ccrp/**"
      - ".github/workflows/ccrp-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ccrp:
    name: CCRP validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema>=4.22,<5"

      - name: Validate CCRP C0 schema vectors
        run: |
          python - <<'PY'
          import copy
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_path = Path('proposals/ccrp/schema/work-context.c0.schema.json')
          fixture_paths = [
              Path('proposals/ccrp/examples/c0-same-actor-chat-a.work-context.json'),
              Path('proposals/ccrp/examples/c0-same-actor-chat-b.work-context.json'),
          ]

          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          validator = Draft202012Validator(schema)

          fixtures = []
          for fixture_path in fixture_paths:
              fixture = json.loads(fixture_path.read_text(encoding='utf-8'))
              validator.validate(fixture)
              fixtures.append(fixture)
              print(f'VALID CCRP/C0 schema: {fixture_path}')

          missing_context = copy.deepcopy(fixtures[0])
          del missing_context['context_id']
          assert list(validator.iter_errors(missing_context)), 'missing context_id must be rejected'

          premature_admission = copy.deepcopy(fixtures[0])
          premature_admission['claims']['execution_admitted'] = True
          assert list(validator.iter_errors(premature_admission)), 'C0 execution admission claim must be rejected'

          premature_lease = copy.deepcopy(fixtures[0])
          premature_lease['lease'] = {'lease_id': 'urn:ccrp:lease:not-yet-allowed'}
          assert list(validator.iter_errors(premature_lease)), 'C0 lease must be rejected'

          print('CCRP/C0 negative schema vectors rejected as expected')
          PY

      - name: Run CCRP C0 semantic vectors
        run: |
          node --check proposals/ccrp/tools/ccrp-core.js
          node --check proposals/ccrp/test-c0.js
          node proposals/ccrp/test-c0.js

      - name: Validate CCRP C1 operation intent schema vectors
        run: |
          python - <<'PY'
          import copy
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(Path('proposals/ccrp/schema/operation-intent.c1.schema.json').read_text(encoding='utf-8'))
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          fixture_paths = [
              Path('proposals/ccrp/examples/c1-chat-a-exclusive.operation-intent.json'),
              Path('proposals/ccrp/examples/c1-chat-b-exclusive.operation-intent.json'),
          ]
          fixtures = []
          for fixture_path in fixture_paths:
              fixture = json.loads(fixture_path.read_text(encoding='utf-8'))
              validator.validate(fixture)
              fixtures.append(fixture)
              print(f'VALID CCRP/C1 operation intent: {fixture_path}')

          missing_idempotency = copy.deepcopy(fixtures[0])
          del missing_idempotency['idempotency_key']
          assert list(validator.iter_errors(missing_idempotency)), 'missing idempotency key must be rejected'

          premature_admission = copy.deepcopy(fixtures[0])
          premature_admission['claims']['execution_admitted'] = True
          assert list(validator.iter_errors(premature_admission)), 'C1 operation intent must not establish execution admission'

          malformed_context = copy.deepcopy(fixtures[0])
          malformed_context['context_ref']['context_id'] = 'not-a-ccrp-context'
          assert list(validator.iter_errors(malformed_context)), 'malformed context ref must be rejected'

          print('CCRP/C1 negative operation-intent schema vectors rejected as expected')
          PY

      - name: Run CCRP C1 collision vectors
        run: |
          node --check proposals/ccrp/test-c1.js
          node proposals/ccrp/test-c1.js /tmp/ccrp-c1

      - name: Validate CCRP C1 collision result schema vectors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(Path('proposals/ccrp/schema/collision-result.c1.schema.json').read_text(encoding='utf-8'))
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          expected = {
              'exclusive.collision-result.json': 'exclusive_operation_collision',
              'stale.collision-result.json': 'stale_base',
              'duplicate.collision-result.json': 'duplicate_operation',
              'wrongContext.collision-result.json': 'wrong_context',
              'noCollision.collision-result.json': 'no_collision',
          }
          for name, collision_type in expected.items():
              path = Path('/tmp/ccrp-c1') / name
              result = json.loads(path.read_text(encoding='utf-8'))
              validator.validate(result)
              assert result['collision_type'] == collision_type
              assert result['source_intents_preserved'] is True
              assert result['claims']['collision_checked'] is True
              assert result['claims']['collision_resolved'] is False
              assert result['claims']['execution_admitted'] is False
              assert result['claims']['materialization_permitted'] is False
              print(f'VALID CCRP/C1 collision result: {collision_type}')
          PY

      - name: Validate CCRP C2 execution lease schema vectors
        run: |
          python - <<'PY'
          import copy
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(Path('proposals/ccrp/schema/execution-lease.c2.schema.json').read_text(encoding='utf-8'))
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          fixture_paths = [
              Path('proposals/ccrp/examples/c2-chat-a-superseded.execution-lease.json'),
              Path('proposals/ccrp/examples/c2-chat-b-current.execution-lease.json'),
          ]
          fixtures = []
          for fixture_path in fixture_paths:
              fixture = json.loads(fixture_path.read_text(encoding='utf-8'))
              validator.validate(fixture)
              fixtures.append(fixture)
              print(f'VALID CCRP/C2 execution lease: {fixture_path}')

          bad_epoch = copy.deepcopy(fixtures[1])
          bad_epoch['epoch'] = 0
          assert list(validator.iter_errors(bad_epoch)), 'C2 lease epoch must be positive'

          active_without_owner = copy.deepcopy(fixtures[1])
          active_without_owner['claims']['current_execution_owner_established'] = False
          assert list(validator.iter_errors(active_without_owner)), 'active lease must identify current execution owner'

          superseded_still_owner = copy.deepcopy(fixtures[0])
          superseded_still_owner['claims']['current_execution_owner_established'] = True
          assert list(validator.iter_errors(superseded_still_owner)), 'superseded lease must not retain current ownership'

          print('CCRP/C2 negative lease schema vectors rejected as expected')
          PY

      - name: Run CCRP C2 execution fencing vectors
        run: |
          node --check proposals/ccrp/tools/ccrp-c2.js
          node --check proposals/ccrp/test-c2.js
          node proposals/ccrp/test-c2.js /tmp/ccrp-c2

      - name: Validate CCRP C2 execution admission result schema vectors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(Path('proposals/ccrp/schema/execution-admission-result.c2.schema.json').read_text(encoding='utf-8'))
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          expected = {
              'admitted.execution-admission-result.json': 'admitted',
              'staleExecutor.execution-admission-result.json': 'not_admitted',
              'wrongSession.execution-admission-result.json': 'not_admitted',
              'expired.execution-admission-result.json': 'not_admitted',
              'outOfScope.execution-admission-result.json': 'not_admitted',
              'blockingCollision.execution-admission-result.json': 'not_admitted',
              'staleRevision.execution-admission-result.json': 'not_admitted',
          }
          for name, decision in expected.items():
              path = Path('/tmp/ccrp-c2') / name
              result = json.loads(path.read_text(encoding='utf-8'))
              validator.validate(result)
              assert result['decision'] == decision
              assert result['source_artifacts_preserved'] is True
              assert result['claims']['historical_provenance_preserved'] is True
              assert result['claims']['materialization_permitted'] is False
              assert result['claims']['canonical_state_established'] is False
              assert result['claims']['poai_authority_established'] is False
              if decision == 'admitted':
                  assert result['claims']['execution_admitted'] is True
                  assert result['claims']['current_execution_owner_established'] is True
                  assert result['claims']['lease_established'] is True
              else:
                  assert result['claims']['execution_admitted'] is False
              print(f'VALID CCRP/C2 execution admission result: {name} -> {decision}')
          PY

      - name: Confirm CCRP artifacts are outside Genesis records
        run: |
          for artifact in \
            proposals/ccrp/examples/c0-same-actor-chat-a.work-context.json \
            proposals/ccrp/examples/c0-same-actor-chat-b.work-context.json \
            proposals/ccrp/examples/c1-chat-a-exclusive.operation-intent.json \
            proposals/ccrp/examples/c1-chat-b-exclusive.operation-intent.json \
            proposals/ccrp/examples/c2-chat-a-superseded.execution-lease.json \
            proposals/ccrp/examples/c2-chat-b-current.execution-lease.json \
            /tmp/ccrp-c1/exclusive.collision-result.json \
            /tmp/ccrp-c1/stale.collision-result.json \
            /tmp/ccrp-c1/duplicate.collision-result.json \
            /tmp/ccrp-c1/wrongContext.collision-result.json \
            /tmp/ccrp-c1/noCollision.collision-result.json \
            /tmp/ccrp-c2/admitted.execution-admission-result.json \
            /tmp/ccrp-c2/staleExecutor.execution-admission-result.json \
            /tmp/ccrp-c2/wrongSession.execution-admission-result.json \
            /tmp/ccrp-c2/expired.execution-admission-result.json \
            /tmp/ccrp-c2/outOfScope.execution-admission-result.json \
            /tmp/ccrp-c2/blockingCollision.execution-admission-result.json \
            /tmp/ccrp-c2/staleRevision.execution-admission-result.json
          do
            if python proposals/poai/tools/validate_poai.py --schema proposals/poai/schema/poai-record.schema.json "$artifact"; then
              echo "ERROR: CCRP artifact was incorrectly accepted as a Genesis PoAI record: $artifact"; exit 1
            else
              echo "Expected separation confirmed: $artifact"
            fi
          done

      - name: Preserve CCRP C0 assurance boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          false_claims = [
              'execution_admitted',
              'current_execution_owner_established',
              'lease_established',
              'canonical_state_established',
              'poai_authority_established',
              'universal_canonicality_established',
              'truth_certified',
              'causal_proof_certified',
              'legal_responsibility_determined',
              'moral_correctness_established',
              'legal_effect_established',
              'poai_v_conformance_established',
          ]

          for path in [
              Path('proposals/ccrp/examples/c0-same-actor-chat-a.work-context.json'),
              Path('proposals/ccrp/examples/c0-same-actor-chat-b.work-context.json'),
          ]:
              artifact = json.loads(path.read_text(encoding='utf-8'))
              assert artifact['claims']['context_identified'] is True
              for claim in false_claims:
                  assert artifact['claims'][claim] is False, f'{path}: {claim}'

          print('CCRP/C0 assurance boundary preserved')
          PY

      - name: Preserve CCRP C1 assurance boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          false_claims = [
              'collision_resolved',
              'execution_admitted',
              'current_execution_owner_established',
              'lease_established',
              'materialization_permitted',
              'canonical_state_established',
              'poai_authority_established',
              'universal_canonicality_established',
              'truth_certified',
              'causal_proof_certified',
              'legal_responsibility_determined',
              'moral_correctness_established',
              'legal_effect_established',
              'poai_v_conformance_established',
          ]

          for path in sorted(Path('/tmp/ccrp-c1').glob('*.collision-result.json')):
              artifact = json.loads(path.read_text(encoding='utf-8'))
              assert artifact['claims']['collision_checked'] is True
              for claim in false_claims:
                  assert artifact['claims'][claim] is False, f'{path}: {claim}'

          print('CCRP/C1 detects collisions without resolving or admitting execution')
          PY

      - name: Preserve CCRP C2 assurance boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          false_claims = [
              'materialization_permitted',
              'canonical_state_established',
              'poai_authority_established',
              'universal_canonicality_established',
              'truth_certified',
              'causal_proof_certified',
              'legal_responsibility_determined',
              'moral_correctness_established',
              'legal_effect_established',
              'poai_v_conformance_established',
          ]

          results = {}
          for path in sorted(Path('/tmp/ccrp-c2').glob('*.execution-admission-result.json')):
              artifact = json.loads(path.read_text(encoding='utf-8'))
              results[path.name] = artifact
              assert artifact['claims']['historical_provenance_preserved'] is True
              for claim in false_claims:
                  assert artifact['claims'][claim] is False, f'{path}: {claim}'

          admitted = results['admitted.execution-admission-result.json']
          assert admitted['claims']['execution_admitted'] is True
          assert admitted['claims']['current_execution_owner_established'] is True
          assert admitted['claims']['lease_established'] is True

          stale = results['staleExecutor.execution-admission-result.json']
          assert stale['claims']['execution_admitted'] is False
          assert 'stale_epoch' in stale['reason_codes']
          assert 'stale_fencing_token' in stale['reason_codes']
          assert stale['claims']['current_execution_owner_established'] is True

          print('CCRP/C2 admits only the current fenced executor and preserves stronger boundaries')
          PY

      - name: Run CCRP C3 convergent collaboration vectors
        run: |
          node --check proposals/ccrp/tools/ccrp-c3.js
          node --check proposals/ccrp/test-c3.js
          node proposals/ccrp/test-c3.js /tmp/ccrp-c3

      - name: Validate CCRP C3 collaboration operation and reconciliation schemas
        run: |
          python - <<'PY'
          import copy
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          operation_schema = json.loads(Path('proposals/ccrp/schema/collaboration-operation.c3.schema.json').read_text(encoding='utf-8'))
          result_schema = json.loads(Path('proposals/ccrp/schema/reconciliation-result.c3.schema.json').read_text(encoding='utf-8'))
          operation_validator = Draft202012Validator(operation_schema, format_checker=FormatChecker())
          result_validator = Draft202012Validator(result_schema, format_checker=FormatChecker())

          operations = []
          for name in ['operationA.collaboration-operation.json', 'operationB.collaboration-operation.json']:
              artifact = json.loads((Path('/tmp/ccrp-c3') / name).read_text(encoding='utf-8'))
              operation_validator.validate(artifact)
              operations.append(artifact)
              print(f'VALID CCRP/C3 collaboration operation: {name}')

          premature = copy.deepcopy(operations[0])
          premature['claims']['reconciliation_checked'] = True
          assert list(operation_validator.iter_errors(premature)), 'C3 source operation must not claim reconciliation before evaluation'

          expected = {
              'forward.reconciliation-result.json': 'merge',
              'reverse.reconciliation-result.json': 'merge',
              'identical.reconciliation-result.json': 'merge',
              'semanticConflict.reconciliation-result.json': 'human_resolution_required',
              'pathOverlap.reconciliation-result.json': 'human_resolution_required',
              'exclusiveResult.reconciliation-result.json': 'reject',
              'baseMismatch.reconciliation-result.json': 'hold',
              'intentMismatch.reconciliation-result.json': 'reject',
              'duplicate.reconciliation-result.json': 'reject',
          }
          for name, decision in expected.items():
              artifact = json.loads((Path('/tmp/ccrp-c3') / name).read_text(encoding='utf-8'))
              result_validator.validate(artifact)
              assert artifact['decision'] == decision
              assert artifact['source_operations_preserved'] is True
              assert artifact['claims']['reconciliation_checked'] is True
              assert artifact['claims']['execution_admitted'] is False
              assert artifact['claims']['materialization_permitted'] is False
              assert artifact['claims']['canonical_state_established'] is False
              assert artifact['claims']['poai_authority_established'] is False
              if decision == 'merge':
                  assert artifact['claims']['deterministic_convergence_established'] is True
                  assert artifact['claims']['coordination_relative_convergence_established'] is True
              else:
                  assert artifact['claims']['deterministic_convergence_established'] is False
                  assert artifact['provisional_converged_projection'] is None
              print(f'VALID CCRP/C3 reconciliation result: {name} -> {decision}')

          forward = json.loads((Path('/tmp/ccrp-c3') / 'forward.reconciliation-result.json').read_text(encoding='utf-8'))
          reverse = json.loads((Path('/tmp/ccrp-c3') / 'reverse.reconciliation-result.json').read_text(encoding='utf-8'))
          assert forward == reverse, 'arrival order must not change deterministic C3 result'
          print('CCRP/C3 schema and arrival-order convergence vectors validated')
          PY

      - name: Confirm CCRP C3 artifacts are outside Genesis records
        run: |
          for artifact in \
            /tmp/ccrp-c3/operationA.collaboration-operation.json \
            /tmp/ccrp-c3/operationB.collaboration-operation.json \
            /tmp/ccrp-c3/forward.reconciliation-result.json \
            /tmp/ccrp-c3/semanticConflict.reconciliation-result.json \
            /tmp/ccrp-c3/baseMismatch.reconciliation-result.json
          do
            if python proposals/poai/tools/validate_poai.py --schema proposals/poai/schema/poai-record.schema.json "$artifact"; then
              echo "ERROR: CCRP/C3 artifact was incorrectly accepted as a Genesis PoAI record: $artifact"; exit 1
            else
              echo "Expected separation confirmed: $artifact"
            fi
          done

      - name: Preserve CCRP C3 assurance boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          false_claims = [
              'execution_admitted',
              'materialization_permitted',
              'canonical_state_established',
              'poai_authority_established',
              'policy_relative_canonicality_established',
              'universal_canonicality_established',
              'truth_certified',
              'causal_proof_certified',
              'legal_responsibility_determined',
              'moral_correctness_established',
              'legal_effect_established',
              'poai_v_conformance_established',
          ]

          results = {}
          for path in sorted(Path('/tmp/ccrp-c3').glob('*.reconciliation-result.json')):
              artifact = json.loads(path.read_text(encoding='utf-8'))
              results[path.name] = artifact
              assert artifact['source_operations_preserved'] is True
              assert artifact['claims']['reconciliation_checked'] is True
              for claim in false_claims:
                  assert artifact['claims'][claim] is False, f'{path}: {claim}'

          forward = results['forward.reconciliation-result.json']
          reverse = results['reverse.reconciliation-result.json']
          assert forward['decision'] == 'merge'
          assert forward['claims']['coordination_relative_convergence_established'] is True
          assert forward['claims']['deterministic_convergence_established'] is True
          assert forward['provisional_converged_projection_digest'] == reverse['provisional_converged_projection_digest']

          conflict = results['semanticConflict.reconciliation-result.json']
          assert conflict['decision'] == 'human_resolution_required'
          assert conflict['claims']['human_resolution_required'] is True
          assert conflict['provisional_converged_projection'] is None

          held = results['baseMismatch.reconciliation-result.json']
          assert held['decision'] == 'hold'
          assert 'base_revision_mismatch_rebase_required' in held['reason_codes']

          print('CCRP/C3 converges compatible work without materialization or arbitrary semantic winner selection')
          PY
