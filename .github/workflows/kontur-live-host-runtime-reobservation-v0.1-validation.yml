name: KONTUR Live Host Runtime Re-observation v0.1 validation

on:
  pull_request:
    paths:
      - "server/kontur/v0.1/live-host-runtime-observer.js"
      - "server/kontur/v0.1/test-live-host-runtime-reobservation.js"
      - "server/kontur/v0.1/activation-executor.js"
      - "server/kontur/v0.1/activation-executor-core.js"
      - "server/kontur/v0.1/live-host-eligibility.js"
      - "server/kontur/v0.1/kontur-activation-execution-policy.schema.json"
      - "server/kontur/v0.1/policies/reference-server.activation-execution-policy.json"
      - "server/kontur/v0.1/LIVE_HOST_ELIGIBILITY.md"
      - "server/kontur/v0.1/LIVE_HOST_RUNTIME_REOBSERVATION.md"
      - ".github/workflows/kontur-live-host-runtime-reobservation-v0.1-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Runtime facts must be re-observed before live effects
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout read-only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.25.1"

      - name: Check modified JavaScript
        run: |
          node --check server/kontur/v0.1/live-host-runtime-observer.js
          node --check server/kontur/v0.1/activation-executor.js
          node --check server/kontur/v0.1/test-live-host-runtime-reobservation.js

      - name: Validate execution policy schema and policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          root = Path('server/kontur/v0.1')
          schema = json.loads((root / 'kontur-activation-execution-policy.schema.json').read_text(encoding='utf-8'))
          policy = json.loads((root / 'policies/reference-server.activation-execution-policy.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(policy)
          assert policy['requirements']['live_host_runtime_reobservation_before_mutation'] is True
          print('PASS: live runtime re-observation is policy-bound')
          PY

      - name: Keep pure live-host eligibility vectors green
        run: node server/kontur/v0.1/test-live-host-eligibility.js /tmp/kontur-live-host-pure-evaluator

      - name: Run execution-time runtime re-observation vectors
        run: node server/kontur/v0.1/test-live-host-runtime-reobservation.js /tmp/kontur-runtime-reobservation

      - name: Require fail-closed before Core Kernel or ledger effects
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/kontur-runtime-reobservation/runtime-reobservation-vectors.json').read_text(encoding='utf-8'))
          assert result['caller_asserted_positive_command_validated_in_memory_only'] is True
          assert result['ci_environment_detected'] is True
          assert result['actual_runtime_decision'] == 'live_host_ineligible'
          assert result['sandbox_marker_decision'] == 'live_host_ineligible'
          assert result['execution_attempt_rejected_before_effect'] is True
          assert result['kernel_calls'] == 0
          assert result['initial_ledger_recovery_calls'] == 0
          assert result['ledger_commit_calls'] == 0
          assert result['post_commit_recovery_calls'] == 0
          assert result['live_execute_completed'] is False
          print('PASS: caller-asserted positive receipt cannot cross live effect boundary in CI')
          PY

      - name: Assert observer itself has no activation path
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('server/kontur/v0.1/live-host-runtime-observer.js').read_text(encoding='utf-8')
          forbidden = [
              'responsibility-kernel.js',
              'responsibility-ledger.js',
              'transitionResponsibility',
              'commitLedgerEntry',
              'executeActivation',
              'buildExecuteCommand'
          ]
          for token in forbidden:
              assert token not in source, f'observer gained activation path token: {token}'
          print('PASS: runtime observer remains observation-only')
          PY

      - name: Assert Executor performs runtime re-observation only at effect-bound ledger validation
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('server/kontur/v0.1/activation-executor.js').read_text(encoding='utf-8')
          assert "require('./live-host-runtime-observer.js')" in source
          assert 'live_host_runtime_reobservation_before_mutation' in source
          assert 'RuntimeHost.assertRuntimeMatchesEligibilityReceipt' in source
          marker = 'if (ledgerRoot !== null && ledgerRoot !== undefined)'
          assert marker in source
          print('PASS: live effect-bound path re-observes current runtime')
          PY

      - name: Assert CI never performs positive live execution
        run: |
          test ! -e /tmp/kontur-runtime-reobservation/candidate-live-ledger/head.json
          echo "PASS: no live ledger head was created"

      - name: Confirm checkout was not mutated by tests
        run: git diff --exit-code
