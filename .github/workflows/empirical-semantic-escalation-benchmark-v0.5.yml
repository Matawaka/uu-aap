name: Empirical Semantic-Escalation Benchmark v0.5

on:
  pull_request:
    paths:
      - 'research/related-work-novelty-boundary-2025-2026/v0.5/**'
      - '.github/workflows/empirical-semantic-escalation-benchmark-v0.5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Revalidate frozen v0.1-v0.4 research
        run: |
          python research/related-work-novelty-boundary-2025-2026/v0.1/validate_landscape.py
          python research/related-work-novelty-boundary-2025-2026/v0.1/test_landscape.py
          python research/related-work-novelty-boundary-2025-2026/v0.1/validate_qualification.py
          python research/related-work-novelty-boundary-2025-2026/v0.2/validate_pressure.py
          python research/related-work-novelty-boundary-2025-2026/v0.2/test_pressure.py
          python research/related-work-novelty-boundary-2025-2026/v0.2/validate_implementation.py
          python research/related-work-novelty-boundary-2025-2026/v0.2/validate_qualification.py
          python research/related-work-novelty-boundary-2025-2026/v0.3/validate_foundational.py
          python research/related-work-novelty-boundary-2025-2026/v0.3/test_foundational.py
          python research/related-work-novelty-boundary-2025-2026/v0.3/validate_implementation.py
          python research/related-work-novelty-boundary-2025-2026/v0.3/validate_qualification.py
          python research/related-work-novelty-boundary-2025-2026/v0.4/validate_taxonomy.py
          python research/related-work-novelty-boundary-2025-2026/v0.4/test_taxonomy.py
          python research/related-work-novelty-boundary-2025-2026/v0.4/validate_implementation.py
          python research/related-work-novelty-boundary-2025-2026/v0.4/validate_qualification.py

      - name: Validate and reproduce v0.5 benchmark
        run: |
          python research/related-work-novelty-boundary-2025-2026/v0.5/validate_benchmark.py
          python research/related-work-novelty-boundary-2025-2026/v0.5/runner.py --check
          python research/related-work-novelty-boundary-2025-2026/v0.5/test_benchmark.py
          python research/related-work-novelty-boundary-2025-2026/v0.5/validate_implementation.py
          if [ -f research/related-work-novelty-boundary-2025-2026/v0.5/qualification-receipt.json ]; then
            python research/related-work-novelty-boundary-2025-2026/v0.5/validate_qualification.py
          fi

      - name: Bind exact stacked predecessor
        shell: bash
        run: |
          set -euo pipefail
          expected='1473ab2005c876816dab12ae46ed7f39bbfbad6b'
          event_base='${{ github.event.pull_request.base.sha }}'
          if [ -n "$event_base" ] && [ "$event_base" != "$expected" ]; then
            echo "v0.5 stacked predecessor moved: expected $expected, observed $event_base" >&2
            exit 1
          fi
          git cat-file -e "$expected^{commit}"

      - name: Prove v0.5 additive-only boundary
        shell: bash
        run: |
          set -euo pipefail
          base='1473ab2005c876816dab12ae46ed7f39bbfbad6b'
          mapfile -t changed < <(git diff --name-only "$base" HEAD)
          for path in "${changed[@]}"; do
            case "$path" in
              research/related-work-novelty-boundary-2025-2026/v0.5/*|.github/workflows/empirical-semantic-escalation-benchmark-v0.5.yml)
                ;;
              *)
                echo "Unexpected path outside bounded v0.5 benchmark: $path" >&2
                exit 1
                ;;
            esac
          done
          test "${#changed[@]}" -gt 0

      - name: Prove predecessor research and semantic runtime surfaces unchanged
        shell: bash
        run: |
          set -euo pipefail
          base='1473ab2005c876816dab12ae46ed7f39bbfbad6b'
          if ! git diff --quiet "$base" HEAD -- research/related-work-novelty-boundary-2025-2026/v0.1 research/related-work-novelty-boundary-2025-2026/v0.2 research/related-work-novelty-boundary-2025-2026/v0.3 research/related-work-novelty-boundary-2025-2026/v0.4; then
            echo 'v0.5 attempted to rewrite frozen predecessor research evidence' >&2
            exit 1
          fi
          if git diff --name-only "$base" HEAD | grep -E '^(SPEC\.md|PRINCIPLES\.md|protocols/core/|proposals/poai/|interop/c2pa/|packages/|applications/|scripts/)'; then
            echo 'v0.5 touched a protected semantic/runtime/product surface' >&2
            exit 1
          fi
