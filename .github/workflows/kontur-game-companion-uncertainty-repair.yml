name: KONTUR Game Companion uncertainty repair validation

on:
  pull_request:
    paths:
      - 'pilots/kontur-game-companion/uncertainty-repair/**'
      - '.github/workflows/kontur-game-companion-uncertainty-repair.yml'
      - '.github/workflows/kontur-game-companion-chain-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate graceful error dialogue and uncertainty repair
        run: python pilots/kontur-game-companion/uncertainty-repair/validate.py
