name: KONTUR Game Companion cross-layer chain validation

on:
  pull_request:
    paths:
      - 'pilots/kontur-game-companion/**'
      - '.github/workflows/kontur-game-companion-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate exact cross-layer dependency bindings
        run: python pilots/kontur-game-companion/dependency-contract/validate.py

      - name: Validate cross-cutting safety boundary
        run: python pilots/kontur-game-companion/safety-boundary/validate.py

      - name: Validate Observational Lane
        run: python pilots/kontur-game-companion/observational-lane/validate.py

      - name: Validate Assistance Gate
        run: python pilots/kontur-game-companion/assistance-gate/validate.py

      - name: Validate Shared Discovery Memory
        run: python pilots/kontur-game-companion/shared-discovery-memory/validate.py

      - name: Validate Bounded Initiative
        run: python pilots/kontur-game-companion/bounded-initiative/validate.py

      - name: Validate Focus Diversity
        run: python pilots/kontur-game-companion/focus-diversity/validate.py

      - name: Validate Interaction Receipt
        run: python pilots/kontur-game-companion/interaction-receipt/validate.py

      - name: Validate Pause / Resume
        run: python pilots/kontur-game-companion/pause-resume/validate.py

      - name: Validate Conversational Variety
        run: python pilots/kontur-game-companion/conversation-variety/validate.py

      - name: Validate Graceful Error Dialogue / Uncertainty Repair
        run: python pilots/kontur-game-companion/uncertainty-repair/validate.py

      - name: Validate Discovery Prompt Gate / Self-Discovery Surface
        run: python pilots/kontur-game-companion/self-discovery-gate/validate.py

      - name: Validate Bounded Playfulness / Humor Contract
        run: python pilots/kontur-game-companion/bounded-playfulness/validate.py

      - name: Validate synthetic integrated conversation trace
        run: python pilots/kontur-game-companion/integrated-conversation-trace/validate.py

      - name: Validate deterministic synthetic session runner
        run: python pilots/kontur-game-companion/session-runner/validate.py

      - name: Validate candidate policy-request envelope generator
        run: python pilots/kontur-game-companion/candidate-envelope/validate.py

      - name: Validate pre-text policy evaluation harness
        run: python pilots/kontur-game-companion/policy-evaluation-harness/validate.py

      - name: Validate synthetic candidate materializer and Interaction Receipt bridge
        run: python pilots/kontur-game-companion/candidate-materializer/validate.py

      - name: Validate synthetic response dispatch gate
        run: python pilots/kontur-game-companion/response-dispatch-gate/validate.py

      - name: Validate shadow runtime null transport harness
        run: python pilots/kontur-game-companion/shadow-runtime/validate.py

      - name: Validate runtime activation readiness boundary
        run: python pilots/kontur-game-companion/runtime-activation-boundary/validate.py

      - name: Validate externalization authority challenge / live activation request
        run: python pilots/kontur-game-companion/externalization-authority-challenge/validate.py

      - name: Validate authority review receipt
        run: python pilots/kontur-game-companion/authority-review-receipt/validate.py
