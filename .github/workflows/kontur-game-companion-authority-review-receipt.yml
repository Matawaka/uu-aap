name: KONTUR Game Companion authority review receipt validation

on:
  pull_request:
    paths:
      - 'pilots/kontur-game-companion/authority-review-receipt/**'
      - '.github/workflows/kontur-game-companion-authority-review-receipt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-authority-review-receipt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate authority review receipt
        run: python pilots/kontur-game-companion/authority-review-receipt/validate.py
