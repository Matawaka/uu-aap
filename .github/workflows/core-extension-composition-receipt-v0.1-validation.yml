name: UU-AAP extension composition receipt v0.1 validation

on:
  pull_request:
    paths:
      - "protocols/core/extensions/v0.1/**"
      - "protocols/core/extensions/composition/v0.1/**"
      - ".github/workflows/core-extension-composition-receipt-v0.1-validation.yml"
  push:
    branches: [main]
    paths:
      - "protocols/core/extensions/v0.1/**"
      - "protocols/core/extensions/composition/v0.1/**"
      - ".github/workflows/core-extension-composition-receipt-v0.1-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate predecessor extension receipts
        run: node protocols/core/extensions/v0.1/validate-extensions.js
      - name: Validate composition receipt and semantic-laundering firewall
        run: node protocols/core/extensions/composition/v0.1/validate-composition-receipt.js
