name: IP Rights Registration v0.1 validation

on:
  pull_request:
    paths:
      - 'docs/legal/IP-RIGHTS-REGISTRATION-PROTOCOL-v0.1.md'
      - 'docs/legal/ROSPATENT-WAVE-1-v0.1.md'
      - 'docs/legal/IP-WAVE-1-AUTHORSHIP-EVIDENCE-GATE-v0.1.md'
      - 'docs/legal/IP-WAVE-1-PRIVATE-EVIDENCE-CHECKPOINT-v0.1.md'
      - 'docs/legal/IP-WAVE-1-RIGHTS-CLEARANCE-v0.1.md'
      - 'schemas/ip/v0.1/**'
      - '.github/workflows/ip-rights-registration-v0.1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate syntax
        run: |
          python -m py_compile schemas/ip/v0.1/ip_registration_validator.py
          python -m py_compile schemas/ip/v0.1/tests/test_ip_registration_v01.py
          python -m json.tool schemas/ip/v0.1/ip-rights-registration-record.schema.json >/dev/null
          python -m json.tool schemas/ip/v0.1/human-authorship-evidence-record.schema.json >/dev/null
          python -m json.tool schemas/ip/v0.1/private-evidence-checkpoint.schema.json >/dev/null
          python -m json.tool schemas/ip/v0.1/examples/uu-aap-core-registration-plan.json >/dev/null
          python -m json.tool schemas/ip/v0.1/examples/uu-aap-core-authorship-review.json >/dev/null
          python -m json.tool schemas/ip/v0.1/examples/uu-aap-core-private-evidence-checkpoint.json >/dev/null

      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'

      - name: Validate registration records
        run: |
          python schemas/ip/v0.1/ip_registration_validator.py \
            schemas/ip/v0.1/examples/uu-aap-core-registration-plan.json

      - name: Validate human authorship evidence records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          root = Path('schemas/ip/v0.1')
          schema = json.loads((root / 'human-authorship-evidence-record.schema.json').read_text())
          record = json.loads((root / 'examples/uu-aap-core-authorship-review.json').read_text())
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(record)

          assert record['human_creative_contribution']['status'] == 'EVIDENCED'
          assert record['ai_assistance']['status'] == 'AI_USED'
          assert record['ai_assistance']['generated_expression_scope'] == 'SUBSTANTIAL'
          assert record['ai_assistance']['human_transformation_status'] == 'EVIDENCED'
          assert record['employment_and_contract']['status'] == 'CLEAR'
          assert record['coauthor_and_third_party']['coauthor_status'] == 'NONE_EVIDENCED'
          assert record['coauthor_and_third_party']['source_origin_status'] == 'CLEAR'
          assert record['outcome']['classification'] == 'AI_ASSISTED_HUMAN_CREATION_EVIDENCED'
          assert record['outcome']['rights_gate_effect'] == 'MAY_ADVANCE_AFTER_RIGHTS_BASIS'
          print('human authorship evidence record: evidenced and bounded')
          PY

      - name: Validate private evidence checkpoint
        run: |
          python - <<'PY'
          import copy
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          root = Path('schemas/ip/v0.1')
          schema = json.loads((root / 'private-evidence-checkpoint.schema.json').read_text())
          record = json.loads((root / 'examples/uu-aap-core-private-evidence-checkpoint.json').read_text())
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          validator.validate(record)

          def advance_allowed(candidate):
              answers = candidate['factual_answers']
              return (
                  candidate['private_declaration']['status'] == 'COMPLETED'
                  and candidate['private_declaration']['digest'] is not None
                  and candidate['classification'] in {'HUMAN_AUTHORED', 'AI_ASSISTED_HUMAN_CREATION'}
                  and all(value != 'UNKNOWN' for value in answers.values())
                  and answers['other_human_creative_contributors'] == 'NONE'
                  and answers['within_employment_duties'] == 'NO'
                  and answers['commission_or_customer_contract_affects_rights'] == 'NO'
                  and answers['exclusive_right_assignment_affects_scope'] == 'NO'
                  and answers['third_party_expression_incorporated'] == 'NO'
              )

          assert record['private_declaration']['status'] == 'COMPLETED'
          assert record['private_declaration']['digest'].startswith('sha256:')
          assert record['classification'] == 'AI_ASSISTED_HUMAN_CREATION'
          assert record['gate_result']['effect'] == 'MAY_ADVANCE_TO_RIGHTS_CLEARED'
          assert record['gate_result']['unresolved_items'] == []
          assert advance_allowed(record)

          # Fail closed: removing the retained private digest must revoke advancement.
          missing_digest = copy.deepcopy(record)
          missing_digest['private_declaration']['digest'] = None
          assert not advance_allowed(missing_digest)

          # Fail closed: introducing a rights-allocation uncertainty must revoke advancement.
          uncertain_employment = copy.deepcopy(record)
          uncertain_employment['factual_answers']['within_employment_duties'] = 'UNKNOWN'
          assert not advance_allowed(uncertain_employment)

          print('private evidence checkpoint: completed, advancement justified, fail-closed preserved')
          PY

      - name: Exercise fail-closed legal readiness gates
        run: python schemas/ip/v0.1/tests/test_ip_registration_v01.py

      - name: Assert workflow is read-only
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/ip-rights-registration-v0.1-validation.yml').read_text()
          forbidden = [
              'contents:' + ' write',
              'pull_request' + '_target',
              'secrets' + '.',
              'gh' + ' api',
              'cu' + 'rl ',
          ]
          for token in forbidden:
              assert token not in text, token
          assert 'permissions:\n  contents: read' in text
          print('workflow boundary: read-only')
          PY
