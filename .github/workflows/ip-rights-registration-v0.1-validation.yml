name: IP Rights Registration v0.1 validation

on:
  pull_request:
    paths:
      - 'docs/legal/IP-RIGHTS-REGISTRATION-PROTOCOL-v0.1.md'
      - 'docs/legal/ROSPATENT-WAVE-1-v0.1.md'
      - 'schemas/ip/v0.1/**'
      - '.github/workflows/ip-rights-registration-v0.1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate syntax
        run: |
          python -m py_compile schemas/ip/v0.1/ip_registration_validator.py
          python -m py_compile schemas/ip/v0.1/tests/test_ip_registration_v01.py
          python -m json.tool schemas/ip/v0.1/ip-rights-registration-record.schema.json >/dev/null
          python -m json.tool schemas/ip/v0.1/examples/uu-aap-core-registration-plan.json >/dev/null

      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'

      - name: Validate registration records
        run: |
          python schemas/ip/v0.1/ip_registration_validator.py \
            schemas/ip/v0.1/examples/uu-aap-core-registration-plan.json

      - name: Exercise fail-closed legal readiness gates
        run: python schemas/ip/v0.1/tests/test_ip_registration_v01.py

      - name: Assert workflow is read-only
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/ip-rights-registration-v0.1-validation.yml').read_text()
          forbidden = [
              'contents:' + ' write',
              'pull_request' + '_target',
              'secrets' + '.',
              'gh' + ' api',
              'cu' + 'rl ',
          ]
          for token in forbidden:
              assert token not in text, token
          assert 'permissions:\n  contents: read' in text
          print('workflow boundary: read-only')
          PY
