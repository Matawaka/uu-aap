name: Ecosystem portfolio validation

on:
  pull_request:
    paths:
      - 'ROADMAP.md'
      - 'README.ru.md'
      - 'docs/ecosystem/**'
      - 'schemas/ecosystem/**'
      - '.github/workflows/ecosystem-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate ecosystem portfolio snapshot
        run: python schemas/ecosystem/v0.1/validate_portfolio.py
