name: UU Society conflict harness v0.1

on:
  pull_request:
    paths:
      - "schemas/ecosystem/uu-society/v0.1/**"
      - "protocols/integration/execute-revalidation/v0.1/**"
      - "protocols/integration/pre-action-authorize-admission/v0.1/**"
      - ".github/workflows/uu-society-conflict-harness-v0.1.yml"
  push:
    branches: [main]
    paths:
      - "schemas/ecosystem/uu-society/v0.1/**"
      - "protocols/integration/execute-revalidation/v0.1/**"
      - "protocols/integration/pre-action-authorize-admission/v0.1/**"
      - ".github/workflows/uu-society-conflict-harness-v0.1.yml"

permissions:
  contents: read

jobs:
  personal-anchor-adversarial-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned validator
        run: python -m pip install jsonschema==4.23.0
      - name: Check Personal Anchor response and authority separation
        run: >-
          python -m unittest discover
          -s schemas/ecosystem/uu-society/v0.1/harness
          -p test_personal_anchor_trials.py -v
      - name: Check retained expiry and current admission bindings
        run: node --test schemas/ecosystem/uu-society/v0.1/harness/test_personal_anchor_authority.js

  deterministic-conflict-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install jsonschema==4.23.0
      - name: Run UU Society v0.1 conflict scenarios
        run: python schemas/ecosystem/uu-society/v0.1/harness/run_scenarios.py

  meta-resilience-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install jsonschema==4.23.0
      - name: Run UU Society v0.1 meta-resilience scenarios
        run: python schemas/ecosystem/uu-society/v0.1/harness/run_meta_scenarios.py

  population-simulations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install jsonschema==4.23.0
      - name: Run UU Society v0.1 deterministic population simulations
        run: python schemas/ecosystem/uu-society/v0.1/harness/run_population_simulations.py

  phase-space-exploration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install jsonschema==4.23.0
      - name: Run and replay bounded phase-space sweep
        run: python schemas/ecosystem/uu-society/v0.1/harness/run_phase_space.py --check-replay --write
      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uu-society-phase-space-v0.2
          path: schemas/ecosystem/uu-society/v0.1/harness/.artifacts/phase-space/
          retention-days: 14

  phase-landscape-sweeps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install jsonschema==4.23.0
      - name: Run UU Society v0.1 deterministic phase landscapes
        run: python schemas/ecosystem/uu-society/v0.1/harness/run_phase_landscapes.py

  endogenous-adaptation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install jsonschema==4.23.0
      - name: Run UU Society v0.4 endogenous adaptation experiments
        run: python schemas/ecosystem/uu-society/v0.1/harness/run_adaptive_simulations.py

  strategy-evolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install jsonschema==4.23.0
      - name: Run UU Society v0.5 endogenous strategy evolution
        run: python schemas/ecosystem/uu-society/v0.1/harness/run_strategy_evolution.py

  institution-evolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install jsonschema==4.23.0
      - name: Run UU Society v0.6 institution evolution
        run: python schemas/ecosystem/uu-society/v0.1/harness/run_institution_evolution.py

  constitutional-resilience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install jsonschema==4.23.0
      - name: Run UU Society v0.7 constitutional resilience experiments
        run: python schemas/ecosystem/uu-society/v0.1/harness/run_constitutional_resilience.py

  review-independence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run UU Society v0.8 review independence
        run: python schemas/ecosystem/uu-society/v0.1/harness/run_review_independence.py

  dynamic-review-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install jsonschema==4.23.0
      - name: Run UU Society v0.9 dynamic review capture
        run: python schemas/ecosystem/uu-society/v0.1/harness/run_dynamic_review_capture.py

  institutional-epistemics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install jsonschema==4.23.0
      - name: Run UU Society v1.0 institutional epistemics
        run: python schemas/ecosystem/uu-society/v0.1/harness/run_institutional_epistemics.py

  active-institutional-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install jsonschema==4.23.0
      - name: Run active verification and replay frozen receipts
        run: >-
          python schemas/ecosystem/uu-society/v0.1/harness/run_active_verification.py
          --check-reference
          --output-dir schemas/ecosystem/uu-society/v0.1/harness/.artifacts/active-verification
      - name: Check oracle separation and hostile authority boundaries
        run: >-
          python -m unittest discover
          -s schemas/ecosystem/uu-society/v0.1/harness
          -p test_active_verification.py -v
      - name: Upload deterministic search receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uu-society-active-verification-v1.1
          path: schemas/ecosystem/uu-society/v0.1/harness/.artifacts/active-verification/
          retention-days: 14

  paired-temporal-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install jsonschema==4.23.0
      - name: Run paired temporal arms and replay frozen results
        run: >-
          python schemas/ecosystem/uu-society/v0.1/harness/run_temporal_verification.py
          --check-reference
          --output-dir schemas/ecosystem/uu-society/v0.1/harness/.artifacts/temporal-verification
      - name: Check immutable clocks and hostile reauthorization boundaries
        run: >-
          python -m unittest discover
          -s schemas/ecosystem/uu-society/v0.1/harness
          -p test_temporal_verification.py -v
      - name: Upload paired calendar and authority receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uu-society-temporal-verification-v1.2
          path: schemas/ecosystem/uu-society/v0.1/harness/.artifacts/temporal-verification/
          retention-days: 14
