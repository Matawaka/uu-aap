name: UU Society conflict harness v0.1

on:
  pull_request:
    paths:
      - "schemas/ecosystem/uu-society/v0.1/**"
      - ".github/workflows/uu-society-conflict-harness-v0.1.yml"
  push:
    branches: [main]
    paths:
      - "schemas/ecosystem/uu-society/v0.1/**"
      - ".github/workflows/uu-society-conflict-harness-v0.1.yml"

permissions:
  contents: read

jobs:
  deterministic-conflict-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install jsonschema==4.23.0
      - name: Run UU Society v0.1 conflict scenarios
        run: python schemas/ecosystem/uu-society/v0.1/harness/run_scenarios.py

  meta-resilience-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install jsonschema==4.23.0
      - name: Run UU Society v0.1 meta-resilience scenarios
        run: python schemas/ecosystem/uu-society/v0.1/harness/run_meta_scenarios.py

  population-simulations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install jsonschema==4.23.0
      - name: Run UU Society v0.1 deterministic population simulations
        run: python schemas/ecosystem/uu-society/v0.1/harness/run_population_simulations.py

  phase-space-exploration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install jsonschema==4.23.0
      - name: Run and replay bounded phase-space sweep
        run: python schemas/ecosystem/uu-society/v0.1/harness/run_phase_space.py --check-replay --write
      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uu-society-phase-space-v0.2
          path: schemas/ecosystem/uu-society/v0.1/harness/.artifacts/phase-space/
          retention-days: 14

  phase-landscape-sweeps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install jsonschema==4.23.0
      - name: Run UU Society v0.1 deterministic phase landscapes
        run: python schemas/ecosystem/uu-society/v0.1/harness/run_phase_landscapes.py

  endogenous-adaptation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install jsonschema==4.23.0
      - name: Run UU Society v0.4 endogenous adaptation experiments
        run: python schemas/ecosystem/uu-society/v0.1/harness/run_adaptive_simulations.py

  strategy-evolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install jsonschema==4.23.0
      - name: Run UU Society v0.5 endogenous strategy evolution
        run: python schemas/ecosystem/uu-society/v0.1/harness/run_strategy_evolution.py
