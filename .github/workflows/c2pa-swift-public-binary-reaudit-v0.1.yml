name: C2PA Swift Public Binary Re-audit v0.1

on:
  pull_request:
    paths:
      - scripts/c2pa-swift-public-binary-reaudit/v0.1/**
      - .github/workflows/c2pa-swift-public-binary-reaudit-v0.1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer:
    strategy:
      fail-fast: false
      matrix:
        target: [release_frontier, current_main]
    runs-on: macos-15
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact predecessor and additive surface
        shell: bash
        run: |
          set -euo pipefail
          base=260e325619ffd2eed12c43f982c369e6468d5f07
          test "$(git rev-parse "$base^{tree}")" = e31aa59a911ae9d393721d6c74c7a906ba810865
          git merge-base --is-ancestor "$base" HEAD
          if [ '${{ github.event_name }}' = pull_request ]; then
            test '${{ github.event.pull_request.base.sha }}' = "$base"
          fi
          git diff --name-status "$base" HEAD > "$RUNNER_TEMP/additive-diff.txt"
          python - "$RUNNER_TEMP/additive-diff.txt" <<'PY'
          import sys
          for line in open(sys.argv[1]):
              status,path=line.rstrip('\n').split('\t')
              assert status=='A', line
              assert path.startswith('scripts/c2pa-swift-public-binary-reaudit/v0.1/') or path=='.github/workflows/c2pa-swift-public-binary-reaudit-v0.1.yml', line
          PY
      - name: Fail-closed classifier and Reader-path tests
        working-directory: scripts/c2pa-swift-public-binary-reaudit/v0.1
        run: python -m unittest -v test_reaudit test_reader
      - name: Resolve build execute and re-derive Reader-path evidence
        run: |
          python scripts/c2pa-swift-public-binary-reaudit/v0.1/qualify.py \
            --target '${{ matrix.target }}' --repo "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/reaudit-${{ matrix.target }}"
      - name: Require frozen exact-byte observation and lock
        shell: bash
        run: |
          set -euo pipefail
          p=scripts/c2pa-swift-public-binary-reaudit/v0.1
          target='${{ matrix.target }}'
          test -s "$p/frozen/$target.json"
          test -s "$p/locks/$target.resolved"
          python - "$p" "$target" <<'PY'
          import hashlib, pathlib, sys
          p=pathlib.Path(sys.argv[1]); target=sys.argv[2]
          pins={
            'current_main':('d2dfc4c6c62861531fe9f7b4c960e4bfa398762377721f12cb06ac12f4f90a37','b2d20a2a55e0e28c0f48e4af2f1e8c4bee216784662711388d49fb2d09be96c5'),
            'release_frontier':('9ac979c040ba0c4f90a792974bd55113bf052ee160c77e349335c968d201a87d','5d4e566e5e2e6f17f1ef4a662b167b4b90bef2700164080d610acfd1141f8ee4')}
          for file,want in zip((p/'frozen'/f'{target}.json',p/'locks'/f'{target}.resolved'),pins[target]):
              assert hashlib.sha256(file.read_bytes()).hexdigest()==want, str(file)
          PY
          cmp "$p/frozen/$target.json" "$RUNNER_TEMP/reaudit-$target/qualification-receipt.json"
          cmp "$p/locks/$target.resolved" "$RUNNER_TEMP/reaudit-$target/Package.resolved"
          echo 'REPRODUCED_BOUNDED_READER_PATH_CLASSIFICATION_NOT_BLANKET_COMPATIBILITY_PASS'
      - name: Repository remains byte-clean
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retain exact execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-public-reaudit-${{ matrix.target }}
          path: ${{ runner.temp }}/reaudit-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30
