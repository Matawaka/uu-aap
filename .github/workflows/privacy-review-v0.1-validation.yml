name: Privacy Review v0.1 validation

on:
  pull_request:
    paths:
      - 'review/privacy/v0.1/**'
      - '.github/workflows/privacy-review-v0.1-validation.yml'
  push:
    branches: [main]
    paths:
      - 'review/privacy/v0.1/**'
      - '.github/workflows/privacy-review-v0.1-validation.yml'

permissions:
  contents: read

env:
  ORIGIN_FRONTIER: 744d2fd12fce012555dfac993921f078c56dc88d
  INPUT: review/privacy/v0.1/current-boundaries.input.json
  REPORT: /tmp/privacy-review-v0.1.json
  P0_INPUT: /tmp/release-candidate-after-privacy.input.json
  P0_REPORT: /tmp/release-candidate-after-privacy.report.json

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind current reviewed frontier
        shell: bash
        run: |
          set -euo pipefail
          target="$(git rev-parse HEAD)"
          echo "TARGET_FRONTIER=$target" >> "$GITHUB_ENV"
          git cat-file -e "${ORIGIN_FRONTIER}^{commit}"
          git merge-base --is-ancestor "$ORIGIN_FRONTIER" "$target"
          git merge-base --is-ancestor 68b8e166355f91e3541bae4e34a4e9538dd616bf "$target"

      - name: Prove reviewed evidence surfaces are byte-identical to origin
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            path="$1" expected="$2"
            test "$(git rev-parse "${ORIGIN_FRONTIER}:$path")" = "$expected"
            test "$(git rev-parse "${TARGET_FRONTIER}:$path")" = "$expected"
          }
          check_blob review/ISSUE-02-privacy-coercion.md 5cc9ec1ff2db6735e115ec47dc65c97a1952d3e6
          check_blob docs/poai/README.md 2e91087e08d29fd96915ae92a7952a1f589e166e
          check_blob products/kontur/v0.1/consolidated-demo/README.md 89469d2849848716545399ad1bfed36b58db93cc
          check_blob applications/marketcloser/v0.1/README.md cf9784a2e3921f37fe3ae75be6e24c1a7467752f

      - name: Verify factual privacy observations
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'There is no PoAI upload endpoint and no analytics dependency' docs/poai/README.md >/dev/null
          grep -F 'raw_game_history = false' products/kontur/v0.1/consolidated-demo/README.md >/dev/null
          grep -F 'transcripts = false' products/kontur/v0.1/consolidated-demo/README.md >/dev/null
          grep -F 'identity_correlation = false' products/kontur/v0.1/consolidated-demo/README.md >/dev/null
          grep -F 'psychological_profile = false' products/kontur/v0.1/consolidated-demo/README.md >/dev/null
          grep -F 'total_history_capture = false' products/kontur/v0.1/consolidated-demo/README.md >/dev/null
          grep -F 'Public Content != Non-Personal Data' applications/marketcloser/v0.1/README.md >/dev/null
          grep -F 'personal targeting' applications/marketcloser/v0.1/README.md >/dev/null
          grep -F 'identity resolution' applications/marketcloser/v0.1/README.md >/dev/null
          grep -F 'How should private audit evidence be retained and deleted?' review/ISSUE-02-privacy-coercion.md >/dev/null
          grep -F 'higher UU-AAP authenticity' review/ISSUE-02-privacy-coercion.md >/dev/null

      - name: Run bounded Privacy Review tests
        run: |
          node --check review/privacy/v0.1/privacy-review.js
          node review/privacy/v0.1/test-privacy-review.js
          node review/privacy/v0.1/test-import-safe.js
          node -e "JSON.parse(require('node:fs').readFileSync(process.env.INPUT,'utf8'))"

      - name: Rebind privacy review to equivalent current frontier and assess
        shell: bash
        run: |
          set -euo pipefail
          TARGET_FRONTIER="$TARGET_FRONTIER" node <<'NODE'
          const fs = require('node:fs');
          const input = JSON.parse(fs.readFileSync(process.env.INPUT, 'utf8'));
          input.reviewed_revision = process.env.TARGET_FRONTIER;
          input.source_equivalence_verified = true;
          fs.writeFileSync('/tmp/privacy-review-input.json', `${JSON.stringify(input, null, 2)}\n`);
          NODE
          node review/privacy/v0.1/privacy-review.js /tmp/privacy-review-input.json > "$REPORT"
          node <<'NODE'
          const r = require('/tmp/privacy-review-v0.1.json');
          if (r.reviewed_revision !== process.env.TARGET_FRONTIER) throw new Error('privacy review frontier mismatch');
          if (r.outcome !== 'INSUFFICIENT_EVIDENCE') throw new Error(`expected INSUFFICIENT_EVIDENCE, got ${r.outcome}`);
          if (r.failed_dimensions.length !== 0) throw new Error('unexpected privacy failure');
          const expected = ['private_audit_retention_deletion','anti_surveillance_authenticity_policy','project_wide_coercive_collection_assessment'];
          if (JSON.stringify(r.insufficient_evidence_dimensions) !== JSON.stringify(expected)) throw new Error('unexpected privacy evidence gaps');
          if (r.p0_mapping.status !== 'INSUFFICIENT_EVIDENCE' || r.p0_mapping.blocking !== false) throw new Error('unexpected privacy P0 mapping');
          if (r.privacy_compliance_certified || r.legal_compliance_established || r.absence_of_surveillance_proven || r.repository_wide_privacy_proven || r.release_authorized || r.authority_created || r.runtime_activated) throw new Error('privacy review overclaim');
          NODE

      - name: Recompute current accessibility outcome
        shell: bash
        run: |
          set -euo pipefail
          TARGET_FRONTIER="$TARGET_FRONTIER" node <<'NODE'
          const fs = require('node:fs');
          const Review = require('./review/accessibility/v0.2/accessibility-rereview.js');
          const input = JSON.parse(fs.readFileSync('review/accessibility/v0.2/current-surfaces.input.json','utf8'));
          input.reviewed_revision = process.env.TARGET_FRONTIER;
          input.surface_equivalence_verified = true;
          const report = Review.assess(input);
          if (report.outcome !== 'INSUFFICIENT_EVIDENCE') throw new Error('unexpected accessibility outcome');
          if (report.p0_mapping.blocking !== false) throw new Error('accessibility blocking regression');
          fs.writeFileSync('/tmp/accessibility-current.json', `${JSON.stringify(report, null, 2)}\n`);
          NODE

      - name: Re-run Release Candidate Checkpoint with accessibility and privacy outcomes
        shell: bash
        run: |
          set -euo pipefail
          TARGET_FRONTIER="$TARGET_FRONTIER" node <<'NODE'
          const fs = require('node:fs');
          const input = JSON.parse(fs.readFileSync('tooling/release-candidate-checkpoint/v0.2/post-t5-frontier.input.json','utf8'));
          const accessibility = JSON.parse(fs.readFileSync('/tmp/accessibility-current.json','utf8'));
          const privacy = JSON.parse(fs.readFileSync('/tmp/privacy-review-v0.1.json','utf8'));
          const target = process.env.TARGET_FRONTIER;
          input.git_revision = target;
          for (const gate of input.engineering_evidence) gate.observed_at_revision = target;
          for (const gate of input.governance_evidence) gate.observed_at_revision = target;

          const a = input.governance_evidence.find((x) => x.gate_id === 'accessibility');
          a.status = accessibility.p0_mapping.status;
          a.blocking = accessibility.p0_mapping.blocking;
          a.source_path = 'review/accessibility/v0.2/README.md';
          a.reviewed_revision = target;
          a.explicit_review_outcome = true;
          a.note = 'Accessibility Re-review v0.2 resolved blocking remediation findings; empirical assistive-technology evidence remains incomplete.';

          const p = input.governance_evidence.find((x) => x.gate_id === 'privacy');
          p.status = privacy.p0_mapping.status;
          p.blocking = privacy.p0_mapping.blocking;
          p.source_path = 'review/privacy/v0.1/README.md';
          p.reviewed_revision = target;
          p.explicit_review_outcome = true;
          p.note = 'Privacy Review v0.1 confirms sampled minimization boundaries while project-wide retention/deletion and anti-surveillance authenticity policy remain insufficiently evidenced.';

          fs.writeFileSync(process.env.P0_INPUT, `${JSON.stringify(input, null, 2)}\n`);
          NODE
          node tooling/release-candidate-checkpoint/v0.2/release-candidate-checkpoint.js "$P0_INPUT" > "$P0_REPORT"
          node <<'NODE'
          const r = require('/tmp/release-candidate-after-privacy.report.json');
          if (r.git_revision !== process.env.TARGET_FRONTIER) throw new Error('P0 frontier mismatch');
          if (r.engineering.status !== 'PASS') throw new Error('engineering regression');
          if (r.decision !== 'RELEASE_CANDIDATE_REVIEW_PENDING') throw new Error(`unexpected P0 decision ${r.decision}`);
          if (r.blocking_findings.length !== 0) throw new Error('unexpected blocking finding');
          const privacy = r.governance.gates.find((x) => x.gate_id === 'privacy');
          const accessibility = r.governance.gates.find((x) => x.gate_id === 'accessibility');
          if (privacy.status !== 'INSUFFICIENT_EVIDENCE' || privacy.blocking !== false || privacy.explicit_review_outcome !== true) throw new Error('privacy P0 composition failed');
          if (accessibility.status !== 'INSUFFICIENT_EVIDENCE' || accessibility.blocking !== false || accessibility.explicit_review_outcome !== true) throw new Error('accessibility P0 composition regressed');
          if (r.release_authorized || r.publication_authorized || r.certification_granted || r.legal_status_established || r.authority_created || r.runtime_activated) throw new Error('P0 overclaim');
          NODE

      - name: Constrain Privacy Review diff to evidence only
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$ORIGIN_FRONTIER" "$TARGET_FRONTIER" > /tmp/privacy-diff.txt
          while IFS= read -r path; do
            case "$path" in
              review/privacy/v0.1/*|.github/workflows/privacy-review-v0.1-validation.yml) ;;
              *) echo "Unexpected Privacy Review change: $path" >&2; exit 1 ;;
            esac
          done < /tmp/privacy-diff.txt
          test -s /tmp/privacy-diff.txt

      - name: Guard review runtime as read-only assessment
        shell: bash
        run: |
          set -euo pipefail
          runtime=review/privacy/v0.1/privacy-review.js
          ! grep -Eq 'child_process|execSync|spawnSync|writeFile|appendFile|createWriteStream|node:http|node:https|node:net|node:dgram|fetch\(' "$runtime"

      - name: Confirm checkout unchanged
        run: test -z "$(git status --porcelain)"

      - name: Upload privacy and checkpoint evidence
        uses: actions/upload-artifact@v4
        with:
          name: privacy-review-v0.1-${{ github.sha }}
          path: |
            /tmp/privacy-review-v0.1.json
            /tmp/release-candidate-after-privacy.report.json
          if-no-files-found: error
