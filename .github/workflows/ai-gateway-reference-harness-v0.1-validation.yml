name: UU-AAP AI Gateway reference harness v0.1 validation

on:
  pull_request:
    paths:
      - 'protocols/integration/ai-gateway/**'
      - 'protocols/core/**'
      - '.github/workflows/ai-gateway-reference-harness-v0.1-validation.yml'
  push:
    branches: [main]
    paths:
      - 'protocols/integration/ai-gateway/**'
      - 'protocols/core/**'
      - '.github/workflows/ai-gateway-reference-harness-v0.1-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate frozen Core
        run: node protocols/core/v0.1/validate-core.js
      - name: Validate extension composition
        run: node protocols/core/extensions/v0.1/validate-extensions.js
      - name: Validate stack evolution
        run: node protocols/core/evolution/v0.1/validate-evolution.js
      - name: Validate Non-Induced Intent
        run: node protocols/core/extensions/intent-evidence/v0.1/validate-intent-evidence.js
      - name: Validate AI Gateway
        run: node protocols/integration/ai-gateway/v0.1/validate-gateway.js
      - name: Validate GitHub adapter
        run: node protocols/integration/ai-gateway/adapters/v0.1/validate-adapter.js
      - name: Validate executable reference harness
        run: node protocols/integration/ai-gateway/harness/v0.1/validate-harness.js
      - name: Execute ALLOW fixture
        run: node protocols/integration/ai-gateway/harness/v0.1/run-harness.js protocols/integration/ai-gateway/harness/v0.1/scenarios.fixture.json dry-run-allow-exact-frontier
      - name: Execute DENY fixture
        run: node protocols/integration/ai-gateway/harness/v0.1/run-harness.js protocols/integration/ai-gateway/harness/v0.1/scenarios.fixture.json dry-run-deny-stale-head
