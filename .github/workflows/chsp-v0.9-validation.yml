name: CHSP v0.9 validation

on:
  pull_request:
    paths:
      - 'protocols/chsp/**'
      - '.github/workflows/chsp-v0.9-validation.yml'
  push:
    branches: [main]
    paths:
      - 'protocols/chsp/**'
      - '.github/workflows/chsp-v0.9-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate CHSP v0.9 Python and JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile protocols/chsp/v0.9/chsp_v09.py
          python3 -m py_compile protocols/chsp/v0.9/test_chsp_v09.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('protocols/chsp/v0.9')
          for path in sorted(root.glob('*.json')):
              json.load(path.open(encoding='utf-8'))
              print('validated', path)
          PY

      - name: Exercise CHSP v0.9 exact execution authorization boundaries
        run: python3 protocols/chsp/v0.9/test_chsp_v09.py

      - name: Keep CHSP v0.8 green
        run: python3 protocols/chsp/v0.8/test_chsp_v08.py
      - name: Keep CHSP v0.7 green
        run: python3 protocols/chsp/v0.7/test_chsp_v07.py
      - name: Keep CHSP v0.6 green
        run: python3 protocols/chsp/v0.6/test_chsp_v06.py
      - name: Keep CHSP v0.5 green
        run: python3 protocols/chsp/v0.5/test_chsp_v05.py
      - name: Keep CHSP v0.4 green
        run: python3 protocols/chsp/v0.4/test_chsp_v04.py
      - name: Keep CHSP v0.3 green
        run: python3 protocols/chsp/v0.3/test_chsp_v03.py
      - name: Keep CHSP v0.2 green
        run: python3 protocols/chsp/v0.2/test_chsp_v02.py
      - name: Keep CHSP v0.1 green
        run: python3 protocols/chsp/v0.1/test_chsp.py

      - name: Keep Human Canonical Recognition v0.6 green
        run: python3 protection/rescue/v0.6/test_canonical_recognition.py
      - name: Keep Canonical Succession Proposal v0.5 green
        run: python3 protection/rescue/v0.5/test_canonical_succession.py
      - name: Keep Rescue Execution Envelope v0.4 green
        run: python3 protection/rescue/v0.4/test_rescue_execution.py
      - name: Keep Survival Plane v0.3 green
        run: python3 protection/rescue/v0.3/test_survival_plane_v03.py
      - name: Keep Survival Plane v0.2 green
        run: python3 protection/rescue/v0.2/test_survival_plane.py
      - name: Keep Project Rescue v0.1 green
        run: python3 protection/rescue/v0.1/test_rescue_assessor.py

      - name: Assert CHSP v0.9 has no network Git account or process execution surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          path = Path('protocols/chsp/v0.9/chsp_v09.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          forbidden = {'socket','urllib','http','requests','subprocess','git','paramiko','ftplib'}
          found = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  found.update(alias.name.split('.')[0] for alias in node.names if alias.name.split('.')[0] in forbidden)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  root = node.module.split('.')[0]
                  if root in forbidden:
                      found.add(root)
          if found:
              raise SystemExit(f'forbidden external execution/network imports: {sorted(found)}')
          print('local-only execution-authorization surface: PASS')
          PY

      - name: Assert authorization is exact bounded and non-executing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('protocols/chsp/v0.9')
          policy = json.load((root / 'reference.chsp-external-execution-authorization-policy.json').open())
          req = policy['requirements']
          for key in [
              'automatic_external_execution','ownership_transfer_authorized','account_control_transfer_authorized',
              'predecessor_access_removal_authorized','credential_rotation_authorized',
              'canonical_origin_mutation_authorized','canonical_publication_authorized','kontur_activation_authorized'
          ]:
              assert req[key] is False, key
          schema = json.load((root / 'chsp-external-execution-authorization.schema.json').open())
          claims = schema['properties']['claims']['properties']
          assert claims['bounded_exact_external_execution_authorized']['const'] is True
          assert claims['exact_envelope_operations_authorized']['const'] is True
          for key in [
              'unbounded_external_mutation_authorized','ownership_transfer_authorized','account_control_transfer_authorized',
              'predecessor_access_removal_authorized','credential_rotation_authorized','canonical_origin_mutation_authorized',
              'canonical_publication_authorized','kontur_activation_authorized','executor_invoked','execution_performed',
              'legal_ownership_adjudicated','distributed_consensus_established'
          ]:
              assert claims[key]['const'] is False, key
          print('exact bounded authorization / no execution boundary: PASS')
          PY
