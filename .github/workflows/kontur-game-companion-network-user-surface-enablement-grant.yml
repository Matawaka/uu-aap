name: KONTUR Game Companion bounded network user-surface enablement grant validation

on:
  pull_request:
    paths:
      - 'pilots/kontur-game-companion/network-user-surface-enablement-grant/**'
      - 'pilots/kontur-game-companion/network-user-surface-enablement-externalization-review/**'
      - 'pilots/kontur-game-companion/network-user-surface-enablement-challenge/**'
      - '.github/workflows/kontur-game-companion-network-user-surface-enablement-grant.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-network-user-surface-enablement-grant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate bounded network user-surface enablement grant
        run: python pilots/kontur-game-companion/network-user-surface-enablement-grant/validate.py
