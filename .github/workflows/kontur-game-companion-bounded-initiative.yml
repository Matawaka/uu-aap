name: KONTUR Game Companion bounded initiative validation

on:
  pull_request:
    paths:
      - 'pilots/kontur-game-companion/bounded-initiative/**'
      - '.github/workflows/kontur-game-companion-bounded-initiative.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bounded conversational initiative
        run: python pilots/kontur-game-companion/bounded-initiative/validate.py
