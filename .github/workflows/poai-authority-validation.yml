name: PoAI Authority Root validation

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "proposals/poai/authority/**"
      - "proposals/poai/materialization/**"
      - "proposals/poai/AUTHORITY_ROOTS.md"
      - ".github/workflows/poai-authority-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  authority-root:
    name: PoAI Authority Root validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema>=4.22,<5"

      - name: Run authority semantic vectors
        run: |
          node --check proposals/poai/authority/tools/authority-core.js
          node --check proposals/poai/authority/test-authority.js
          node proposals/poai/authority/test-authority.js \
            /tmp/authority-grant.json \
            /tmp/authority-verification.json

      - name: Validate authority schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          pairs = [
              (Path('proposals/poai/authority/schema/authority-root.schema.json'), Path('proposals/poai/authority/examples/self-governed-uu-aap.authority-root.json')),
              (Path('proposals/poai/authority/schema/authority-root.schema.json'), Path('proposals/poai/authority/roots/github/Matawaka.uu-aap.authority-root.json')),
              (Path('proposals/poai/authority/schema/authority-grant.schema.json'), Path('/tmp/authority-grant.json')),
              (Path('proposals/poai/authority/schema/authority-grant.schema.json'), Path('proposals/poai/authority/grants/github/Matawaka.uu-aap.execute-grant.json')),
              (Path('proposals/poai/authority/schema/authority-verification-result.schema.json'), Path('/tmp/authority-verification.json')),
          ]
          for schema_path, instance_path in pairs:
              schema = json.loads(schema_path.read_text(encoding='utf-8'))
              instance = json.loads(instance_path.read_text(encoding='utf-8'))
              Draft202012Validator(schema, format_checker=FormatChecker()).validate(instance)
              print(f'VALID schema: {instance_path}')
          PY

      - name: Confirm authority artifacts are outside Genesis records
        run: |
          for artifact in \
            proposals/poai/authority/examples/self-governed-uu-aap.authority-root.json \
            proposals/poai/authority/roots/github/Matawaka.uu-aap.authority-root.json \
            proposals/poai/authority/grants/github/Matawaka.uu-aap.execute-grant.json \
            /tmp/authority-grant.json \
            /tmp/authority-verification.json
          do
            if python proposals/poai/tools/validate_poai.py --schema proposals/poai/schema/poai-record.schema.json "$artifact"; then
              echo "ERROR: authority artifact was incorrectly accepted as a Genesis PoAI record: $artifact"; exit 1
            else
              echo "Expected separation confirmed: $artifact"
            fi
          done

      - name: Confirm authority result feeds materialization
        run: |
          node --check proposals/poai/materialization/test-materialization.js
          node proposals/poai/materialization/test-materialization.js \
            /tmp/materialization-event.json \
            /tmp/materialization-candidate.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          pairs = [
              (Path('proposals/poai/materialization/schema/materialization-policy.schema.json'), Path('proposals/poai/materialization/examples/synthetic-shipment.materialization-policy.json')),
              (Path('proposals/poai/materialization/schema/materialization-policy.schema.json'), Path('proposals/poai/materialization/policies/github/Matawaka.uu-aap.materialization-policy.json')),
              (Path('proposals/poai/materialization/schema/materialization-event.schema.json'), Path('/tmp/materialization-event.json')),
          ]
          for schema_path, instance_path in pairs:
              schema = json.loads(schema_path.read_text(encoding='utf-8'))
              instance = json.loads(instance_path.read_text(encoding='utf-8'))
              Draft202012Validator(schema, format_checker=FormatChecker()).validate(instance)
              print(f'VALID schema: {instance_path}')
          PY

      - name: Verify live Root publication and exact policy acceptance
        run: |
          node --check proposals/poai/authority/live/test-live-root-acceptance.js
          node proposals/poai/authority/live/test-live-root-acceptance.js \
            /tmp/live-root-acceptance.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/live-root-acceptance.json').read_text(encoding='utf-8'))
          claims = result['claims']
          assert claims['root_declared'] is True
          assert claims['root_evidence_observed'] is True
          assert claims['root_accepted_by_policy'] is True
          assert claims['issuer_entitlement_chain_valid'] is False
          assert claims['materialization_authority_established'] is False
          for key in [
              'legal_identity_verified',
              'legal_authority_established',
              'universal_authority_established',
              'universal_canonicality_established',
              'truth_certified',
              'causal_proof_certified',
              'legal_responsibility_determined',
              'moral_correctness_established',
              'legal_effect_established',
              'poai_v_conformance_established',
          ]:
              assert claims[key] is False, key
          print('Live Root publication/acceptance boundary preserved')
          PY

      - name: Validate live execute grant declaration
        run: |
          node --check proposals/poai/authority/live/test-live-grant-declaration.js
          node proposals/poai/authority/live/test-live-grant-declaration.js \
            /tmp/live-grant-declaration.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/live-grant-declaration.json').read_text(encoding='utf-8'))
          claims = result['claims']
          assert claims['grant_declared'] is True
          assert claims['grant_root_binding_valid'] is True
          assert claims['grant_policy_binding_valid'] is True
          assert claims['grant_scope_contained'] is True
          assert claims['grant_publication_observed'] is False
          assert claims['issuer_entitlement_chain_valid'] is False
          assert claims['materialization_authority_established'] is False
          assert claims['policy_control_authority_established'] is False
          for key in [
              'legal_identity_verified',
              'legal_authority_established',
              'universal_authority_established',
              'universal_canonicality_established',
              'truth_certified',
              'causal_proof_certified',
              'legal_responsibility_determined',
              'moral_correctness_established',
              'legal_effect_established',
              'poai_v_conformance_established',
          ]:
              assert claims[key] is False, key
          print('Live execute grant declaration boundary preserved')
          PY

      - name: Verify published live grant authority path
        run: |
          node --check proposals/poai/authority/live/test-live-published-grant-authority.js
          node proposals/poai/authority/live/test-live-published-grant-authority.js \
            /tmp/live-authority-verification.json \
            /tmp/live-published-grant-check.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(Path('proposals/poai/authority/schema/authority-verification-result.schema.json').read_text(encoding='utf-8'))
          result = json.loads(Path('/tmp/live-authority-verification.json').read_text(encoding='utf-8'))
          check = json.loads(Path('/tmp/live-published-grant-check.json').read_text(encoding='utf-8'))
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(result)

          claims = result['claims']
          assert result['status'] == 'established'
          assert result['errors'] == []
          assert claims['root_declared'] is True
          assert claims['root_evidence_observed'] is True
          assert claims['root_accepted_by_policy'] is True
          assert claims['issuer_entitlement_chain_valid'] is True
          assert claims['materialization_authority_established'] is True
          assert claims['policy_control_authority_established'] is False
          assert check['claims']['grant_publication_observed'] is True
          assert check['claims']['cryptographic_grant_signature_verified'] is False
          for key in [
              'legal_identity_verified',
              'legal_authority_established',
              'universal_authority_established',
              'universal_canonicality_established',
              'truth_certified',
              'causal_proof_certified',
              'legal_responsibility_determined',
              'moral_correctness_established',
              'legal_effect_established',
              'poai_v_conformance_established',
          ]:
              assert claims[key] is False, key
          print('Published live execute authority established without policy-control leakage')
          PY

      - name: Consume live authority in materialization dry-run
        run: |
          node --check proposals/poai/materialization/live/test-live-authority-consumption.js
          node proposals/poai/materialization/live/test-live-authority-consumption.js \
            /tmp/live-authority-verification.json \
            /tmp/live-materialization-event.json \
            /tmp/live-materialization-consumption.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          event_schema = json.loads(Path('proposals/poai/materialization/schema/materialization-event.schema.json').read_text(encoding='utf-8'))
          event = json.loads(Path('/tmp/live-materialization-event.json').read_text(encoding='utf-8'))
          check = json.loads(Path('/tmp/live-materialization-consumption.json').read_text(encoding='utf-8'))
          Draft202012Validator(event_schema, format_checker=FormatChecker()).validate(event)

          assert event['declared_disposition'] == 'materialized'
          assert event['canonicality_claim']['status'] == 'materialized'
          assert event['claims']['policy_evaluation_passed'] is True
          assert event['claims']['policy_relative_canonicality_established'] is True
          assert event['authority_evaluation']['issuer_entitlement_verified'] is True
          assert event['authority_evaluation']['authority_verified'] is True
          assert check['mode'] == 'dry_run_ci_only'
          assert check['claims']['live_authority_result_consumed'] is True
          assert check['claims']['issuer_entitlement_from_live_result'] is True
          assert check['claims']['materialization_authority_from_live_result'] is True
          assert check['claims']['exact_action_target_time_policy_scope_preserved'] is True
          assert check['claims']['dry_run_policy_evaluation_passed'] is True
          assert check['claims']['persistent_materialization_event_published'] is False
          assert check['claims']['successor_record_published'] is False
          assert check['claims']['repository_mutation_performed'] is False
          assert check['claims']['automatic_browser_action_performed'] is False
          for key in [
              'universal_canonicality_established',
              'truth_certified',
              'causal_proof_certified',
              'legal_responsibility_determined',
              'moral_correctness_established',
              'legal_effect_established',
              'poai_v_conformance_established',
          ]:
              assert check['claims'][key] is False, key
          print('Live authority consumed by materialization dry-run; no persistent action performed')
          PY

          if python proposals/poai/tools/validate_poai.py --schema proposals/poai/schema/poai-record.schema.json /tmp/live-materialization-event.json; then
            echo "ERROR: live dry-run Materialization Event was incorrectly accepted as a Genesis PoAI record"; exit 1
          else
            echo "Expected separation confirmed: live dry-run Materialization Event is not a Genesis PoAI record"
          fi

      - name: Preserve assurance boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/authority-verification.json').read_text())
          assert result['claims']['issuer_entitlement_chain_valid'] is True
          assert result['claims']['materialization_authority_established'] is True
          for key in [
              'legal_identity_verified',
              'legal_authority_established',
              'universal_authority_established',
              'universal_canonicality_established',
              'truth_certified',
              'causal_proof_certified',
              'legal_responsibility_determined',
              'moral_correctness_established',
              'legal_effect_established',
              'poai_v_conformance_established',
          ]:
              assert result['claims'][key] is False, key
          print('Authority assurance boundary preserved')
          PY
