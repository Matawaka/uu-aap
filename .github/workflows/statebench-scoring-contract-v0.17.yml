name: StateBench Synthetic Scoring Contract v0.17

on:
  pull_request:
    branches:
      - research/statebench-request-construction-v0.16-qualified-base

permissions:
  contents: read

jobs:
  scoring-contract:
    name: scoring-contract-${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
      GEMINI_API_KEY: ""
      HF_TOKEN: ""
      HUGGING_FACE_HUB_TOKEN: ""
      AZURE_OPENAI_API_KEY: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      GOOGLE_APPLICATION_CREDENTIALS: ""
      STATEBENCH_JUDGE: ""
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      UV_PROJECT_ENVIRONMENT: /tmp/statebench-v014-venv
      UV_CACHE_DIR: /tmp/statebench-v014-uv-cache
      PREDECESSOR12: /tmp/statebench-v014-v012
      PREDECESSOR13: /tmp/statebench-v014-v013
      PREDECESSOR14: /tmp/statebench-v015-v014
      PREDECESSOR15: /tmp/statebench-v016-v015
      PREDECESSOR16: /tmp/statebench-v017-v016
      EVIDENCE: /tmp/statebench-v014-evidence
      NEW_EVIDENCE: /tmp/statebench-v015-evidence
      REQUEST_EVIDENCE: /tmp/statebench-v016-evidence
      SCORING_EVIDENCE: /tmp/statebench-v017-evidence
      RESEARCH: research/related-work-novelty-boundary-2025-2026

    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.14

      - name: Validate synthetic contract helpers and exact predecessor
        shell: bash
        run: |
          set -euo pipefail
          python "$RESEARCH/v0.17/gate.py" self-test
          python "$RESEARCH/v0.17/gate.py" boundary

      - name: Reproduce every frozen v0.16 run block without weakening history
        shell: bash
        run: |
          set -euo pipefail
          python "$RESEARCH/v0.17/replay_predecessor.py" --repo "$GITHUB_WORKSPACE" --worktree "$PREDECESSOR16"

      - name: Execute synthetic scoring contract audit twice without model or provider
        shell: bash
        run: |
          set -euo pipefail
          /tmp/statebench-v014-offline "$GITHUB_WORKSPACE/$RESEARCH/v0.17/gate.py" run \
            --repo "$GITHUB_WORKSPACE" --predecessor "$PREDECESSOR16" \
            --upstream /tmp/statebench-v014-source --cache /tmp/statebench-v014-tokenizer \
            --prior "$REQUEST_EVIDENCE" --output "$SCORING_EVIDENCE"

      - name: Recheck namespace imports and preserve exact predecessor evidence
        shell: bash
        run: |
          set -euo pipefail
          /tmp/statebench-v014-offline "$PREDECESSOR14/$RESEARCH/v0.14/gate.py" observe --repo "$PREDECESSOR14" --output "$SCORING_EVIDENCE/namespace-after-scoring.json"
          /tmp/statebench-v014-offline "$PREDECESSOR14/$RESEARCH/v0.14/gate.py" imports --output "$SCORING_EVIDENCE/imports-after-scoring.json"
          cmp "$SCORING_EVIDENCE/namespace-after-scoring.json" "$REQUEST_EVIDENCE/namespace-after-requests.json"
          cmp "$SCORING_EVIDENCE/imports-after-scoring.json" "$REQUEST_EVIDENCE/imports-after-requests.json"
          python "$RESEARCH/v0.17/gate.py" boundary
          test -z "$(git -C "$PREDECESSOR16" status --porcelain --untracked-files=no)"
          test -z "$(git -C /tmp/statebench-v014-source status --porcelain --untracked-files=no)"
          cp -r "$REQUEST_EVIDENCE" "$SCORING_EVIDENCE/predecessor"

      - name: Preserve fixed audit source for recovery
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SCORING_EVIDENCE/source"
          for file in gate.py replay_predecessor.py audit-contract.json README.md; do
            cp "$RESEARCH/v0.17/$file" "$SCORING_EVIDENCE/source/$file"
          done

      - name: Require fresh scoring NONPASS evidence identical to first A/B pair
        shell: bash
        run: |
          set -euo pipefail
          python "$RESEARCH/v0.17/validate_qualification.py" --self-test
          python "$RESEARCH/v0.17/validate_qualification.py" --repo "$GITHUB_WORKSPACE" --evidence "$SCORING_EVIDENCE"

      - name: Upload actual scoring observation even on inconclusive result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: statebench-scoring-contract-v0.17-${{ matrix.lane }}
          path: /tmp/statebench-v017-evidence/
          if-no-files-found: warn
          retention-days: 30
