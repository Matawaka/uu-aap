name: PoAI Issue-State Reconciliation v0.1
on:
  pull_request:
    paths:
      - 'protocols/experimental/poai-issue-state-reconciliation/v0.1/**'
      - 'protocols/experimental/poai-successor-reconciliation/v0.1/**'
      - 'protocols/experimental/poai-successor-reconciliation/v0.2/**'
      - '.github/workflows/poai-issue-state-reconciliation-v0.1.yml'
  push:
    branches: [main]
    paths:
      - 'protocols/experimental/poai-issue-state-reconciliation/v0.1/**'
      - 'protocols/experimental/poai-successor-reconciliation/v0.1/**'
      - 'protocols/experimental/poai-successor-reconciliation/v0.2/**'
      - '.github/workflows/poai-issue-state-reconciliation-v0.1.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node protocols/experimental/poai-successor-reconciliation/v0.1/test-map.js
      - run: node protocols/experimental/poai-successor-reconciliation/v0.2/test-resolution.js
      - run: node protocols/experimental/poai-issue-state-reconciliation/v0.1/validate.js
      - run: test -z "$(git status --porcelain)"
