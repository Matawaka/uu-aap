name: Related Work Novelty Boundary v0.1

on:
  pull_request:
    paths:
      - 'research/related-work-novelty-boundary-2025-2026/v0.1/**'
      - '.github/workflows/related-work-novelty-boundary-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source ledger and claim matrix
        run: python research/related-work-novelty-boundary-2025-2026/v0.1/validate_landscape.py

      - name: Run hostile landscape tests
        run: python research/related-work-novelty-boundary-2025-2026/v0.1/test_landscape.py

      - name: Prove audit-only boundary
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          mapfile -t changed < <(git diff --name-only "$base" HEAD)
          for path in "${changed[@]}"; do
            case "$path" in
              research/related-work-novelty-boundary-2025-2026/v0.1/*|.github/workflows/related-work-novelty-boundary-v0.1.yml)
                ;;
              *)
                echo "Unexpected path outside bounded audit: $path" >&2
                exit 1
                ;;
            esac
          done
          test "${#changed[@]}" -gt 0

      - name: Guard normative and runtime surfaces unchanged
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          if git diff --name-only "$base" HEAD | grep -E '^(SPEC\.md|PRINCIPLES\.md|protocols/core/|proposals/poai/|interop/c2pa/|packages/|applications/|scripts/)'; then
            echo 'Research audit touched a protected semantic/runtime surface' >&2
            exit 1
          fi
