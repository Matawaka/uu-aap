name: Witness Key Provenance All-Seven v0.1

on:
  pull_request:
    paths:
      - 'scripts/witness-key-provenance-all-seven/v0.1/**'
      - '.github/workflows/witness-key-provenance-all-seven-v0.1.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/witness-key-provenance-all-seven/v0.1/**'
      - '.github/workflows/witness-key-provenance-all-seven-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  witness-key-provenance-all-seven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'

      - name: Preserve merged PR 936 frozen predecessor unchanged
        shell: bash
        run: |
          set -euo pipefail
          old=scripts/witness-key-provenance-reproof/v0.1
          python "$old/test_reproof.py"
          python "$old/receipt_validator.py" "$old/profile.json" "$old/qualification-receipt.json"
          test "$(git hash-object "$old/profile.json")" = '23184a0049c069deb7c07d0572c4b45dcd1b9e99'
          test "$(git hash-object "$old/qualification-receipt.json")" = '8f0c7f0b08e77dfc7ebcd6a615a8bb3b9223fee3'
          python - <<'PY'
          import json
          r=json.load(open('scripts/witness-key-provenance-reproof/v0.1/qualification-receipt.json'))
          assert r['receipt_fingerprint_sha256']=='2a533ce2b03ba170bfb8c6e33cced5994acc61f18fed6b94ee42931307f615d8'
          assert r['matched_witness_key_count']==5
          assert r['unique_source_url_count']==4
          assert r['unique_source_host_count']==4
          assert r['verdict']=='QUORUM_MANY_PINNED_WITNESS_KEYS_REOBSERVED_FROM_OPERATOR_PUBLISHED_SOURCES_IDENTITY_AND_INDEPENDENCE_NOT_ESTABLISHED'
          print('merged #936 frozen predecessor parity PASS')
          PY

      - name: Validate exact successor bindings and hostile suite
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor becaff7af61d76ee4bdae09e2aa60aae559da417 HEAD
          python scripts/witness-key-provenance-all-seven/v0.1/validate_sources.py
          python scripts/witness-key-provenance-all-seven/v0.1/test_reproof.py
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          p='scripts/witness-key-provenance-all-seven/v0.1/receipt.schema.json'
          s=json.load(open(p,encoding='utf-8')); Draft202012Validator.check_schema(s)
          print('VALID schema:',p)
          PY

      - name: Fetch exact two missing operator pages read-only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors --proto '=https' https://www.rgdd.se/poc-witness/about -o /tmp/rgdd-about.txt
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors --proto '=https' https://witness1.smartit.nu/witness1/about.txt -o /tmp/smartit-about.txt
          test -s /tmp/rgdd-about.txt
          test -s /tmp/smartit-about.txt
          cat > /tmp/source-map.json <<'JSON'
          {
            "https://www.rgdd.se/poc-witness/about": "/tmp/rgdd-about.txt",
            "https://witness1.smartit.nu/witness1/about.txt": "/tmp/smartit-about.txt"
          }
          JSON

      - name: Compose exact all-seven operator-source provenance
        shell: bash
        run: |
          set -euo pipefail
          dir=scripts/witness-key-provenance-all-seven/v0.1
          python "$dir/reproof.py" --profile "$dir/profile.json" --source-map /tmp/source-map.json > /tmp/witness-key-provenance-all-seven.json
          python "$dir/receipt_validator.py" "$dir/profile.json" /tmp/witness-key-provenance-all-seven.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/witness-key-provenance-all-seven.json'))
          assert r['verdict']=='ALL_SEVEN_PINNED_WITNESS_KEYS_OPERATOR_SOURCE_OBSERVED_ACROSS_BOUND_PREDECESSOR_AND_SUCCESSOR_EVIDENCE_IDENTITY_AND_INDEPENDENCE_NOT_ESTABLISHED',r
          assert r['predecessor_observed_witness_key_count']==5,r
          assert r['new_exact_witness_key_count']==2,r
          assert r['new_exact_source_url_count']==2,r
          assert r['composed_exact_pinned_witness_key_count']==7,r
          assert r['all_seven_operator_source_observations_composed'] is True,r
          assert r['claims']['all_seven_currently_reobserved_in_one_run'] is False
          assert r['claims']['witness_identity_proven'] is False
          assert r['claims']['operator_independence_proven'] is False
          assert all(v is False for v in r['claims'].values())
          assert r['automatic_action'] is False
          assert r['external_mutation_performed'] is False
          print(r['verdict'])
          print('predecessor/new/composed:',r['predecessor_observed_witness_key_count'],r['new_exact_witness_key_count'],r['composed_exact_pinned_witness_key_count'])
          print('receipt fingerprint:',r['receipt_fingerprint_sha256'])
          PY

      - name: Validate frozen qualification evidence when materialized
        shell: bash
        run: |
          set -euo pipefail
          frozen=scripts/witness-key-provenance-all-seven/v0.1/qualification-receipt.json
          if [ -f "$frozen" ]; then
            python scripts/witness-key-provenance-all-seven/v0.1/receipt_validator.py scripts/witness-key-provenance-all-seven/v0.1/profile.json "$frozen"
            python - <<'PY'
          import json
          live=json.load(open('/tmp/witness-key-provenance-all-seven.json'))
          old=json.load(open('scripts/witness-key-provenance-all-seven/v0.1/qualification-receipt.json'))
          def stable(r):
              return {
                  'verdict':r['verdict'],
                  'predecessor':r['predecessor'],
                  'predecessor_observed_witness_key_count':r['predecessor_observed_witness_key_count'],
                  'new_source_contract':[(x['id'],x['witness_vkey'],x['source_url'],x['source_classification'],x['exact_vkey_observed']) for x in r['new_source_records']],
                  'new_exact_witness_key_count':r['new_exact_witness_key_count'],
                  'new_exact_source_url_count':r['new_exact_source_url_count'],
                  'composed_exact_pinned_witness_key_count':r['composed_exact_pinned_witness_key_count'],
                  'composed_witness_vkeys':r['composed_witness_vkeys'],
                  'all_seven_operator_source_observations_composed':r['all_seven_operator_source_observations_composed'],
                  'key_provenance_assurance':r['key_provenance_assurance'],
                  'claims':r['claims'],
              }
          assert stable(live)==stable(old),(stable(live),stable(old))
          print('current semantic two-source contract == frozen all-seven qualification')
          PY
          else
            echo 'first qualification run: frozen all-seven receipt not materialized yet'
          fi

      - name: Upload bounded all-seven evidence
        uses: actions/upload-artifact@v4
        with:
          name: witness-key-provenance-all-seven-${{ github.sha }}
          path: |
            /tmp/witness-key-provenance-all-seven.json
            /tmp/rgdd-about.txt
            /tmp/smartit-about.txt
          if-no-files-found: error
          retention-days: 30

      - name: Assert additive successor-only diff boundary
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              git fetch --quiet origin "${GITHUB_BASE_REF}"
              changed="$(git diff --name-only "origin/${GITHUB_BASE_REF}"...HEAD)"
              ;;
            push|workflow_dispatch)
              changed="$(git diff --name-only HEAD^..HEAD)"
              ;;
            *) echo "unsupported event ${GITHUB_EVENT_NAME}" >&2; exit 1 ;;
          esac
          test -n "$changed"
          while IFS= read -r file; do
            case "$file" in
              scripts/witness-key-provenance-all-seven/v0.1/*|.github/workflows/witness-key-provenance-all-seven-v0.1.yml) ;;
              *) echo "unexpected changed path: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          ! grep -q '^scripts/witness-key-provenance-reproof/' <<< "$changed"
          ! grep -q '^scripts/anchored-witnessed-consistency-pilot/' <<< "$changed"
          ! grep -q '^protocols/core/' <<< "$changed"
          ! grep -q '^protocols/interface-registry/' <<< "$changed"
          ! grep -q '^SPEC.md$' <<< "$changed"
          ! grep -q '^PRINCIPLES.md$' <<< "$changed"

      - name: Prove repository-read-only execution
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
