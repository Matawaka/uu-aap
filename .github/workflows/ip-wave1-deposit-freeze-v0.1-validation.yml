name: IP Wave 1 deposit freeze v0.1 validation

on:
  pull_request:
    paths:
      - 'protocols/core/v0.1/validate-core.js'
      - 'protocols/core/v0.1/receipt-envelope.schema.json'
      - 'protocols/core/v0.1/end-to-end.fixture.json'
      - 'docs/legal/IP-WAVE-1-PATENT-DISCLOSURE-SCREEN-v0.1.md'
      - 'docs/legal/ROSPATENT-WAVE-1-v0.1.md'
      - 'schemas/ip/v0.1/deposit-freeze-manifest.schema.json'
      - 'schemas/ip/v0.1/build_wave1_deposit_manifest.py'
      - 'schemas/ip/v0.1/examples/uu-aap-core-deposit-freeze.json'
      - 'schemas/ip/v0.1/examples/uu-aap-core-registration-plan.json'
      - '.github/workflows/ip-wave1-deposit-freeze-v0.1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate syntax
        run: |
          python -m py_compile schemas/ip/v0.1/build_wave1_deposit_manifest.py
          python -m json.tool schemas/ip/v0.1/deposit-freeze-manifest.schema.json >/dev/null
          python -m json.tool schemas/ip/v0.1/examples/uu-aap-core-deposit-freeze.json >/dev/null

      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'

      - name: Validate committed deposit manifest schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          root = Path('schemas/ip/v0.1')
          schema = json.loads((root / 'deposit-freeze-manifest.schema.json').read_text())
          record = json.loads((root / 'examples/uu-aap-core-deposit-freeze.json').read_text())
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(record)
          print('deposit freeze manifest schema: valid')
          PY

      - name: Rebuild and require exact manifest match
        run: |
          python schemas/ip/v0.1/build_wave1_deposit_manifest.py \
            --check schemas/ip/v0.1/examples/uu-aap-core-deposit-freeze.json

      - name: Validate fixed Wave 1 boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path('schemas/ip/v0.1/examples/uu-aap-core-deposit-freeze.json').read_text())
          assert record['freeze_frontier'] == '8aec7684a54e2570c285720a22d30d99f958131a'
          assert record['program_size_bytes'] == 15144
          assert record['deposit_support_size_bytes'] == 12240
          assert record['deposit_total_size_bytes'] == 27384
          assert record['programming_languages'] == ['JavaScript (Node.js)']
          assert record['abstract_characters'] == len(record['abstract_ru'])
          assert record['abstract_characters'] <= 900
          assert record['package_digest'] == 'sha256:228e5d5f142fecb6ed8bfa0010f07b562fdb28db4ba15ae5e1ceb723fa8a8de8'
          assert record['patent_screen']['separate_patent_track_issue'] == 492
          expected_blobs = {
              'protocols/core/v0.1/validate-core.js': '19b8cc90f34ad2eb3819d02d6335f584c65caa46',
              'protocols/core/v0.1/receipt-envelope.schema.json': '38d2d439ad6a1065da96cc9e5f2190734fd2cd7b',
              'protocols/core/v0.1/end-to-end.fixture.json': '9ed65bfae43f157f6fb051bf6460ebaec13ea480',
          }
          for entry in record['files']:
              assert entry['git_blob_sha1'] == expected_blobs[entry['path']]
          plan = json.loads(Path('schemas/ip/v0.1/examples/uu-aap-core-registration-plan.json').read_text())
          assert plan['state'] == 'PATENT_SCREEN'
          assert plan['evidence_anchor']['package_digest'] == record['package_digest']
          assert plan['patentability']['status'] == 'SEPARATE_PATENT_TRACK'
          assert plan['filing'] is None
          print('Wave 1 freeze boundary, patent separation and non-filing state: valid')
          PY

      - name: Assert workflow is read-only
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/ip-wave1-deposit-freeze-v0.1-validation.yml').read_text()
          forbidden = [
              'contents:' + ' write',
              'pull_request' + '_target',
              'secrets' + '.',
              'gh' + ' api',
              'cu' + 'rl ',
          ]
          for token in forbidden:
              assert token not in text, token
          assert 'permissions:\n  contents: read' in text
          print('workflow boundary: read-only')
          PY
