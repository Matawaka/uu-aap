name: StateBench Plain Request Construction v0.16

on:
  pull_request:
    branches:
      - research/statebench-model-free-adapter-v0.15-qualified-base

permissions:
  contents: read

jobs:
  request-construction:
    name: request-construction-${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
      GEMINI_API_KEY: ""
      HF_TOKEN: ""
      HUGGING_FACE_HUB_TOKEN: ""
      AZURE_OPENAI_API_KEY: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      GOOGLE_APPLICATION_CREDENTIALS: ""
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      UV_PROJECT_ENVIRONMENT: /tmp/statebench-v014-venv
      UV_CACHE_DIR: /tmp/statebench-v014-uv-cache
      PREDECESSOR12: /tmp/statebench-v014-v012
      PREDECESSOR13: /tmp/statebench-v014-v013
      PREDECESSOR14: /tmp/statebench-v015-v014
      EVIDENCE: /tmp/statebench-v014-evidence
      NEW_EVIDENCE: /tmp/statebench-v015-evidence
      RESEARCH: research/related-work-novelty-boundary-2025-2026

      PREDECESSOR15: /tmp/statebench-v016-v015
      REQUEST_EVIDENCE: /tmp/statebench-v016-evidence

    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.14

      - name: Validate request contract helpers and frozen predecessor
        shell: bash
        run: |
          set -euo pipefail
          python "$RESEARCH/v0.16/gate.py" self-test
          python "$RESEARCH/v0.16/gate.py" boundary

      - name: Reproduce complete frozen v0.15 and selected environment
        shell: bash
        run: |
          set -euo pipefail
          python "$RESEARCH/v0.16/replay_predecessor.py" --repo "$GITHUB_WORKSPACE" --worktree "$PREDECESSOR15"

      - name: Build exact plain requests with no cache or dispatch
        shell: bash
        run: |
          set -euo pipefail
          /tmp/statebench-v014-offline "$GITHUB_WORKSPACE/$RESEARCH/v0.16/gate.py" run \
            --repo "$GITHUB_WORKSPACE" --predecessor "$PREDECESSOR15" \
            --upstream /tmp/statebench-v014-source --cache /tmp/statebench-v014-tokenizer \
            --prior "$NEW_EVIDENCE" --output "$REQUEST_EVIDENCE"

      - name: Recheck namespace public imports and historical immutability
        shell: bash
        run: |
          set -euo pipefail
          /tmp/statebench-v014-offline "$PREDECESSOR14/$RESEARCH/v0.14/gate.py" observe --repo "$PREDECESSOR14" --output "$REQUEST_EVIDENCE/namespace-after-requests.json"
          /tmp/statebench-v014-offline "$PREDECESSOR14/$RESEARCH/v0.14/gate.py" imports --output "$REQUEST_EVIDENCE/imports-after-requests.json"
          cmp "$REQUEST_EVIDENCE/namespace-after-requests.json" "$NEW_EVIDENCE/namespace-after-adapter.json"
          cmp "$REQUEST_EVIDENCE/imports-after-requests.json" "$NEW_EVIDENCE/imports-after-adapter.json"
          python "$RESEARCH/v0.16/gate.py" boundary
          test -z "$(git -C "$PREDECESSOR15" status --porcelain --untracked-files=no)"
          test -z "$(git -C /tmp/statebench-v014-source status --porcelain --untracked-files=no)"
          cp -r "$NEW_EVIDENCE" "$REQUEST_EVIDENCE/predecessor"

      - name: Upload actual request evidence even on non-pass
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: statebench-plain-requests-v0.16-${{ matrix.lane }}
          path: /tmp/statebench-v016-evidence/
          if-no-files-found: warn
          retention-days: 30
