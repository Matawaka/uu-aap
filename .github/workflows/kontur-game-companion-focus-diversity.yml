name: KONTUR Game Companion focus diversity validation

on:
  pull_request:
    paths:
      - 'pilots/kontur-game-companion/focus-diversity/**'
      - '.github/workflows/kontur-game-companion-focus-diversity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate focus diversity and interest surface
        run: python pilots/kontur-game-companion/focus-diversity/validate.py
