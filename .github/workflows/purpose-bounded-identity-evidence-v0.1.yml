name: Purpose-Bounded Identity Evidence v0.1
on:
  pull_request:
    paths:
      - 'protocols/integration/purpose-bounded-identity-evidence/v0.1/**'
      - 'protocols/integration/personal-sovereign-root/v0.1/**'
      - '.github/workflows/purpose-bounded-identity-evidence-v0.1.yml'
  push:
    branches: [main]
    paths:
      - 'protocols/integration/purpose-bounded-identity-evidence/v0.1/**'
      - 'protocols/integration/personal-sovereign-root/v0.1/**'
      - '.github/workflows/purpose-bounded-identity-evidence-v0.1.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node protocols/integration/purpose-bounded-identity-evidence/v0.1/test-identity-evidence.js
      - run: node protocols/integration/personal-sovereign-root/v0.1/validate-personal-sovereign-root.js
      - run: test -z "$(git status --porcelain)"
