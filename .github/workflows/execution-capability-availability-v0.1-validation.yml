name: Execution Capability Availability Binding v0.1 validation

on:
  pull_request:
    paths:
      - 'protocols/core/v0.1/**'
      - 'protocols/integration/execution-capability-descriptor/v0.1/**'
      - 'protocols/integration/capability-selection/v0.1/**'
      - 'protocols/integration/execution-capability-availability/v0.1/**'
      - '.github/workflows/execution-capability-availability-v0.1-validation.yml'
  push:
    branches: [main]
    paths:
      - 'protocols/core/v0.1/**'
      - 'protocols/integration/execution-capability-descriptor/v0.1/**'
      - 'protocols/integration/capability-selection/v0.1/**'
      - 'protocols/integration/execution-capability-availability/v0.1/**'
      - '.github/workflows/execution-capability-availability-v0.1-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Core-bound fresh execution capability availability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Core
        run: node protocols/core/v0.1/validate-core.js

      - name: Validate Execution Capability Descriptor
        run: node protocols/integration/execution-capability-descriptor/v0.1/validate-execution-capability-descriptor.js

      - name: Validate Capability Selection
        run: node protocols/integration/capability-selection/v0.1/validate-capability-selection.js

      - name: Validate historical Execution Capability Availability conformance
        run: |
          node --check protocols/integration/execution-capability-availability/v0.1/validate-execution-capability-availability.js
          node protocols/integration/execution-capability-availability/v0.1/validate-execution-capability-availability.js

      - name: Validate parameterized import-safe selection binding
        run: |
          node --check protocols/integration/execution-capability-availability/v0.1/test-parameterized-validator.js
          node protocols/integration/execution-capability-availability/v0.1/test-parameterized-validator.js

      - name: Protect upstream/downstream protocol implementations for Availability slice changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE='${{ github.event.pull_request.base.sha }}'
            HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          else
            BASE="$(git rev-parse HEAD^)"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi
          changed="$(git diff --name-only "$BASE" "$HEAD_SHA")"
          echo "$changed"
          if echo "$changed" | grep -q '^protocols/integration/execution-capability-availability/v0\.1/'; then
            bad="$(echo "$changed" | grep -E '^(protocols/core/v0\.1/|protocols/integration/execution-capability-descriptor/v0\.1/|protocols/integration/capability-selection/v0\.1/|protocols/integration/pre-action-evidence-bundle/v0\.1/|protocols/fcl/v0\.1/|proposals/poai/authority/)' || true)"
            if [ -n "$bad" ]; then
              echo 'ERROR: Availability slice changed a protected upstream/downstream protocol implementation'
              echo "$bad"
              exit 1
            fi
          fi
          echo 'Availability dependency ownership boundary preserved'
