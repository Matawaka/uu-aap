name: Execution Capability Availability Binding v0.1 validation

on:
  pull_request:
    paths:
      - 'protocols/core/v0.1/**'
      - 'protocols/integration/execution-capability-descriptor/v0.1/**'
      - 'protocols/integration/capability-selection/v0.1/**'
      - 'protocols/integration/execution-capability-availability/v0.1/**'
      - '.github/workflows/execution-capability-availability-v0.1-validation.yml'
  push:
    branches: [main]
    paths:
      - 'protocols/core/v0.1/**'
      - 'protocols/integration/execution-capability-descriptor/v0.1/**'
      - 'protocols/integration/capability-selection/v0.1/**'
      - 'protocols/integration/execution-capability-availability/v0.1/**'
      - '.github/workflows/execution-capability-availability-v0.1-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Core-bound fresh execution capability availability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Core
        run: node protocols/core/v0.1/validate-core.js

      - name: Validate Execution Capability Descriptor
        run: node protocols/integration/execution-capability-descriptor/v0.1/validate-execution-capability-descriptor.js

      - name: Validate Capability Selection
        run: node protocols/integration/capability-selection/v0.1/validate-capability-selection.js

      - name: Validate Execution Capability Availability Binding
        run: node protocols/integration/execution-capability-availability/v0.1/validate-execution-capability-availability.js
