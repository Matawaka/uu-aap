name: Public Review Intake Observation v0.1

on:
  pull_request:
    paths:
      - 'tooling/public-review-intake-observation/v0.1/**'
      - '.github/workflows/public-review-intake-observation-v0.1.yml'
  push:
    branches: [main]
    paths:
      - 'tooling/public-review-intake-observation/v0.1/**'
      - '.github/workflows/public-review-intake-observation-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

env:
  ORIGIN_FRONTIER: 8100a4c59590afe503c438b659e20326e11ef8ee
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  observe:
    name: bounded read-only Public Review observation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'

      - name: Fetch exact implementation origin
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q --depth=1 origin "$ORIGIN_FRONTIER"
          git cat-file -e "$ORIGIN_FRONTIER^{commit}"

      - name: Parse machine-readable contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool tooling/public-review-intake-observation/v0.1/surfaces.json >/dev/null
          python -m json.tool tooling/public-review-intake-observation/v0.1/receipt.schema.json >/dev/null
          python -m json.tool tooling/public-review-intake-observation/v0.1/implementation-receipt.json >/dev/null

      - name: Run deterministic classification and hostile tests
        run: python tooling/public-review-intake-observation/v0.1/test_collector.py

      - name: Validate historical source bindings and bounded scope
        run: python tooling/public-review-intake-observation/v0.1/validate_implementation.py

      - name: Require no recurring schedule or write permission
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/public-review-intake-observation-v0.1.yml
          ! grep -Eq '^[[:space:]]+schedule:' "$workflow"
          ! grep -Eq '^[[:space:]]+[A-Za-z_-]+:[[:space:]]*write[[:space:]]*$' "$workflow"
          grep -F 'contents: read' "$workflow" >/dev/null
          grep -F 'issues: read' "$workflow" >/dev/null
          echo "read-only/no-schedule workflow boundary: PASS"

      - name: Guard accepted semantic and product boundaries on PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "$ORIGIN_FRONTIER" HEAD -- \
            protocols/core/ SPEC.md PRINCIPLES.md CONTESTABILITY.md SECURITY.md RESPONSIBILITY.md \
            schema/uu-aap-manifest.schema.json \
            pilots/core-pilot-002/run-001/ \
            protocols/responsibility-status-provenance/v0.1/ \
            protocols/responsibility-assurance/v0.1/ \
            PUBLIC_REVIEW.md docs/ROADMAP-CURRENT.md docs/workbench/
          echo "Core/SPEC/Run001/B+C/PublicReview/roadmap/Workbench boundaries: unchanged"

      - name: Require observer-only PR diff
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$ORIGIN_FRONTIER" HEAD | sort)"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/workflows/public-review-intake-observation-v0.1.yml|tooling/public-review-intake-observation/v0.1/*) ;;
              *) echo "unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          echo "observer-only diff boundary: PASS"

      - name: Perform live read-only observation
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tooling/public-review-intake-observation/v0.1/collector.py --output "${{ runner.temp }}/public-review-observation.json"
          python tooling/public-review-intake-observation/v0.1/collector.py --validate "${{ runner.temp }}/public-review-observation.json"
          cat "${{ runner.temp }}/public-review-observation.json"

      - name: Upload live observation receipt
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: public-review-intake-observation-v0.1-${{ github.run_id }}
          path: ${{ runner.temp }}/public-review-observation.json
          if-no-files-found: error
          retention-days: 30

      - name: Require clean working tree
        run: test -z "$(git status --porcelain --untracked-files=all)"
