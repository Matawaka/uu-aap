name: KONTUR Game Companion external sandbox sidecar ingest validation

on:
  pull_request:
    paths:
      - 'pilots/kontur-game-companion/external-sandbox-sidecar-ingest/**'
      - 'pilots/kontur-game-companion/local-trial-pilot/**'
      - 'pilots/kontur-game-companion/network-user-surface-enablement-materialization/**'
      - '.github/workflows/kontur-game-companion-external-sandbox-sidecar-ingest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate bounded read-only completed sidecar ingest
        run: python pilots/kontur-game-companion/external-sandbox-sidecar-ingest/validate.py
