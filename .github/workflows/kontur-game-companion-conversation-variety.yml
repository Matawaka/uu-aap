name: KONTUR Game Companion conversation variety validation

on:
  pull_request:
    paths:
      - 'pilots/kontur-game-companion/conversation-variety/**'
      - '.github/workflows/kontur-game-companion-conversation-variety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-conversation-variety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate conversational variety boundary
        run: python pilots/kontur-game-companion/conversation-variety/validate.py
