name: StateBench lm-eval First-GREEN Freeze v0.10

on:
  pull_request:
    paths:
      - 'research/related-work-novelty-boundary-2025-2026/v0.10/**'
      - '.github/workflows/statebench-lm-eval-freeze-v0.10.yml'

permissions:
  contents: write
  actions: read

jobs:
  freeze-first-green-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bind exact branch and first-GREEN ancestry
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.head_ref }}' = 'research/statebench-lm-eval-envelope-v0.10'
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          git cat-file -e 'c5b0f90e561bae00f192fd427c1c6addf034907f^{commit}'
          git merge-base --is-ancestor c5b0f90e561bae00f192fd427c1c6addf034907f HEAD
          test "$(git rev-parse c5b0f90e561bae00f192fd427c1c6addf034907f^{tree})" = '49d6251bbbac489038fd3f3dac080a2522d0b123'
          git cat-file -e '1b2c5e622501dd07f4560d5356e0708fa9633833^{commit}'

      - name: Download exact first-GREEN artifact
        uses: actions/download-artifact@v4
        with:
          name: statebench-lm-eval-envelope-v0.10-c549b916157b755bc24bfd1eee392448dbb5af15
          path: /tmp/statebench-v010-first-green
          github-token: ${{ github.token }}
          repository: Matawaka/uu-aap
          run-id: '34188348738'

      - name: Verify first-GREEN bytes and non-effects
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/statebench-v010-first-green
          test -f "$root/uv.lock"
          test -f "$root/uv.lock.sha256"
          test -f "$root/package-inventory.json"
          test -f "$root/resolver-receipt.json"
          test "$(wc -c < "$root/uv.lock" | tr -d ' ')" = '224954'
          observed="$(sha256sum "$root/uv.lock" | awk '{print $1}')"
          test "$observed" = '324ab96f208bfbe1e6a2d03bc6ceb4bf5aa4867a57eeac5217e81571b7925532'
          test "$(tr -d '\r\n' < "$root/uv.lock.sha256")" = "$observed"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/statebench-v010-first-green')
          r = json.loads((root / 'resolver-receipt.json').read_text(encoding='utf-8'))
          assert r['schema'] == 'matawaka.statebench-lm-eval-lock-materialization/v0.10'
          assert r['candidate_head'] == 'c549b916157b755bc24bfd1eee392448dbb5af15'
          assert r['statebench_commit'] == '1b87cf6f43bcd6ec21e01bdec5705fcba04e71a7'
          assert r['lm_eval_version'] == '0.4.13'
          assert r['lm_eval_commit'] == 'ddd67220430a2470529f25fd5c05a576ca1057a0'
          assert r['lock_sha256'] == '324ab96f208bfbe1e6a2d03bc6ceb4bf5aa4867a57eeac5217e81571b7925532'
          assert r['package_count'] == 133
          assert r['python'] == 'Python 3.12.14'
          assert r['uv'].startswith('uv 0.12.10 ')
          assert r['lock_only_resolution'] is True
          assert r['environment_synced'] is False
          for key in (
              'model_executed', 'dataset_executed', 'huggingface_model_downloaded',
              'external_model_api_called', 'user_credentials_used',
              'official_statebench_benchmark_executed', 'merge_authorized',
          ):
              assert r[key] is False, key
          inv = json.loads((root / 'package-inventory.json').read_text(encoding='utf-8'))
          assert len(inv) == 133
          versions = {p['name']: p.get('version') for p in inv}
          assert versions['lm-eval'] == '0.4.13'
          assert versions['statebench'] == '2.0.0'
          assert versions['statebench-lm-eval'] == '0.1.0'
          assert versions['datasets'] == '5.0.1'
          assert versions['torch'] == '2.14.0'
          assert versions['transformers'] == '5.16.1'
          assert versions['accelerate'] == '1.14.0'
          assert versions['peft'] == '0.20.0'
          PY

      - name: Freeze exactly one lock file on unchanged head
        shell: bash
        run: |
          set -euo pipefail
          target='research/related-work-novelty-boundary-2025-2026/v0.10/lock-project/uv.lock'
          if [ -e "$target" ]; then
            test "$(sha256sum "$target" | awk '{print $1}')" = '324ab96f208bfbe1e6a2d03bc6ceb4bf5aa4867a57eeac5217e81571b7925532'
            echo 'Exact first-GREEN lock already frozen; no write required.'
            exit 0
          fi

          git fetch origin '${{ github.head_ref }}'
          test "$(git rev-parse 'origin/${{ github.head_ref }}')" = '${{ github.event.pull_request.head.sha }}'

          cp /tmp/statebench-v010-first-green/uv.lock "$target"
          test "$(sha256sum "$target" | awk '{print $1}')" = '324ab96f208bfbe1e6a2d03bc6ceb4bf5aa4867a57eeac5217e81571b7925532'

          git add -- "$target"
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 1
          test "${staged[0]}" = "$target"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: freeze first-GREEN v0.10 dependency lock'
          git push origin "HEAD:${{ github.head_ref }}"
