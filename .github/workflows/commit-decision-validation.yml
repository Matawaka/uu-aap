name: Pre-commit decision validation

on:
  pull_request:
    paths:
      - "protocols/integration/**"
      - "protocols/ial/**"
      - "protocols/attestation/**"
      - "protocols/registry/**"
      - "proposals/ccrp/**"
      - "proposals/poai/authority/**"
      - "proposals/poai/materialization/**"
      - ".github/workflows/commit-decision-validation.yml"
  push:
    branches:
      - main
    paths:
      - "protocols/integration/**"
      - "protocols/ial/**"
      - "protocols/attestation/**"
      - "protocols/registry/**"
      - "proposals/ccrp/**"
      - "proposals/poai/authority/**"
      - "proposals/poai/materialization/**"
      - ".github/workflows/commit-decision-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-decision:
    name: Pre-commit decision validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with immutable tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema>=4.22,<5"

      - name: Validate upstream protocol registry
        run: node protocols/registry/v0.1/validate-registry.js

      - name: Check integration JavaScript
        run: |
          node --check protocols/integration/v0.1/evaluate-commit-decision.js
          node --check protocols/integration/v0.1/test-commit-decision.js

      - name: Validate integration schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('protocols/integration/v0.1')
          for name in [
              'revalidation-receipt.schema.json',
              'commit-decision-input.schema.json',
              'commit-decision-result.schema.json',
          ]:
              schema = json.loads((root / name).read_text(encoding='utf-8'))
              Draft202012Validator.check_schema(schema)
              print(f'VALID schema: {name}')
          PY

      - name: Reproduce live pre-commit decision and fail-closed vectors
        run: |
          node protocols/integration/v0.1/test-commit-decision.js \
            /tmp/commit-decision-result.json \
            /tmp/commit-decision-input.json \
            /tmp/revalidation-receipt.json

      - name: Validate reproduced integration artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          root = Path('protocols/integration/v0.1')
          pairs = [
              ('revalidation-receipt.schema.json', '/tmp/revalidation-receipt.json'),
              ('commit-decision-input.schema.json', '/tmp/commit-decision-input.json'),
              ('commit-decision-result.schema.json', '/tmp/commit-decision-result.json'),
          ]

          values = {}
          for schema_name, artifact_name in pairs:
              schema = json.loads((root / schema_name).read_text(encoding='utf-8'))
              artifact = json.loads(Path(artifact_name).read_text(encoding='utf-8'))
              Draft202012Validator(schema, format_checker=FormatChecker()).validate(artifact)
              values[artifact_name] = artifact
              print(f'VALID integration artifact: {artifact_name}')

          result = values['/tmp/commit-decision-result.json']
          assert result['decision'] == 'approved'
          assert all(result['checks'].values())
          claims = result['claims']
          assert claims['responsibility_input_established'] is True
          assert claims['authority_input_established'] is True
          assert claims['execution_admission_input_established'] is True
          assert claims['revalidation_input_established'] is True
          assert claims['pre_materialization_permission_input_established'] is True
          assert claims['commit_decision_approved'] is True

          for key in [
              'commit_performed',
              'materialization_event_recorded',
              'repository_mutation_performed',
              'outcome_observed',
              'canonical_state_established',
              'universal_canonicality_established',
              'truth_certified',
              'causal_proof_certified',
              'legal_effect_established',
              'poai_v_conformance_established',
          ]:
              assert claims[key] is False, key

          print('CommitDecision approved while commit/outcome/canonicality remain unestablished')
          PY

      - name: Confirm decision gate performed no working-tree mutation
        run: git diff --exit-code
