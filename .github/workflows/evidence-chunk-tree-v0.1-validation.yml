name: Evidence Chunk Tree v0.1 validation

on:
  pull_request:
    paths:
      - 'protection/evidence/chunk-tree/v0.1/**'
      - '.github/workflows/evidence-chunk-tree-v0.1-validation.yml'
  push:
    branches: [main]
    paths:
      - 'protection/evidence/chunk-tree/v0.1/**'
      - '.github/workflows/evidence-chunk-tree-v0.1-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Evidence chunk tree boundary
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'

      - name: Validate code and schema
        run: |
          node --check protection/evidence/chunk-tree/v0.1/evidence-chunk-tree.js
          node --check protection/evidence/chunk-tree/v0.1/test-evidence-chunk-tree.js
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          p = Path('protection/evidence/chunk-tree/v0.1/evidence-chunk-tree.schema.json')
          Draft202012Validator.check_schema(json.loads(p.read_text(encoding='utf-8')))
          print('VALID schema:', p)
          PY

      - name: Run chunk tree fail-closed tests
        run: node protection/evidence/chunk-tree/v0.1/test-evidence-chunk-tree.js

      - name: Assert local-only non-authoritative implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('protection/evidence/chunk-tree/v0.1')
          executable = '\n'.join(p.read_text(encoding='utf-8') for p in root.glob('*.js'))
          forbidden = [
              "require('child_process')", 'require("child_process")',
              "require('http')", 'require("http")',
              "require('https')", 'require("https")',
              'fetch(', 'server/kontur/', 'ActivationExecutor', 'activation-preflight',
          ]
          for token in forbidden:
              if token in executable:
                  raise SystemExit(f'forbidden executable chunk-tree surface token: {token}')
          schema = (root / 'evidence-chunk-tree.schema.json').read_text(encoding='utf-8')
          for claim in [
              'evidence_truth_certified', 'origin_established', 'canonicality_established',
              'authority_established', 'legal_liability_determined', 'rescue_authorized',
              'kontur_readiness_established', 'kontur_activation_authorized', 'kontur_activated',
          ]:
              if f'"{claim}": {{ "const": false }}' not in schema:
                  raise SystemExit(f'missing false-claim guard: {claim}')
          print('Local-only / non-authoritative guard: PASS')
          PY

      - name: Assert workflow cannot mutate repository
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/evidence-chunk-tree-v0.1-validation.yml').read_text(encoding='utf-8')
          forbidden = [
              'contents' + ': write', 'git ' + 'push', 'gh pr ' + 'merge',
              'pull-requests' + ': write', 'actions' + ': write',
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'forbidden workflow mutation token: {token}')
          print('Read-only workflow guard: PASS')
          PY

      - name: Confirm checkout was not mutated
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
