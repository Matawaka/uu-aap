name: KONTUR Game Companion runtime transport binding challenge validation

on:
  pull_request:
    paths:
      - 'pilots/kontur-game-companion/runtime-transport-binding-challenge/**'
      - '.github/workflows/kontur-game-companion-runtime-transport-binding-challenge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-runtime-transport-binding-challenge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate runtime transport binding challenge
        run: python pilots/kontur-game-companion/runtime-transport-binding-challenge/validate.py
