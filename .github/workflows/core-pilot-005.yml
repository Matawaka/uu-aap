name: Core Pilot 005 validation

on:
  pull_request:
    paths:
      - 'pilots/core-pilot-005/**'
      - '.github/workflows/core-pilot-005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate observe-before-retry model
        run: python pilots/core-pilot-005/validate.py
