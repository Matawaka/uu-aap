name: Backlog Reconciliation v0.1
on:
  pull_request:
    paths:
      - 'scripts/backlog-reconciliation/**'
      - '.github/workflows/backlog-reconciliation-v0.1.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/backlog-reconciliation/**'
      - '.github/workflows/backlog-reconciliation-v0.1.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check scripts/backlog-reconciliation/classify.js
      - run: node scripts/backlog-reconciliation/test-classify.js
      - run: node scripts/backlog-reconciliation/test-audit-pass-001.js
      - run: node scripts/backlog-reconciliation/audits/test-pass-002.js
      - run: node scripts/backlog-reconciliation/audits/test-pass-003.js
      - run: node scripts/backlog-reconciliation/audits/test-pass-004.js
      - run: node scripts/backlog-reconciliation/audits/test-pass-005.js
      - run: node scripts/backlog-reconciliation/audits/test-pass-006.js
      - run: node scripts/backlog-reconciliation/audits/test-pass-008.js
      - run: node scripts/backlog-reconciliation/audits/test-pass-009.js
      - run: node scripts/backlog-reconciliation/audits/test-pass-010.js
      - run: test -z "$(git status --porcelain)"
