name: MarketCloser Human Analysis Disposition Gate v0.1 validation

on:
  pull_request:
    paths:
      - 'applications/marketcloser/v0.1/human-analysis-disposition/v0.1/**'
      - '.github/workflows/marketcloser-human-analysis-disposition-v0.1-validation.yml'
  push:
    branches: [main]
    paths:
      - 'applications/marketcloser/v0.1/human-analysis-disposition/v0.1/**'
      - '.github/workflows/marketcloser-human-analysis-disposition-v0.1-validation.yml'

permissions:
  contents: read

env:
  ORIGIN_FRONTIER: 0dd0b5a041590e44ee12a9bbd923025b87497d25
  LAYER: applications/marketcloser/v0.1/human-analysis-disposition/v0.1
  FIXTURE: applications/marketcloser/v0.1/human-analysis-disposition/v0.1/examples/synthetic-disposition-wait.input.json
  POS_INPUT: /tmp/marketcloser-disposition-positive-input.json
  POS_RECEIPT: /tmp/marketcloser-disposition-positive-receipt.json
  PYTHONPYCACHEPREFIX: /tmp/marketcloser-human-analysis-disposition-pycache

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JSON Schema validator
        run: python -m pip install 'jsonschema>=4.22,<5'

      - name: Verify exact successor origin
        run: |
          git cat-file -e "${ORIGIN_FRONTIER}^{commit}"
          git merge-base --is-ancestor "$ORIGIN_FRONTIER" HEAD

      - name: Re-run MarketCloser application and data predecessors
        run: |
          python applications/marketcloser/v0.1/validate_boundary.py
          node applications/marketcloser/v0.1/deployment-observation/v0.1/test-deployment-observation.js
          node applications/marketcloser/v0.1/deployment-observation/v0.1/test-receipt-binding.js
          node applications/marketcloser/v0.1/minimized-real-review-bridge/v0.1/test-bridge.js
          node applications/marketcloser/v0.1/minimized-real-review-bridge/v0.1/test-receipt-binding.js

      - name: Re-run authority permit and revalidation predecessors
        run: |
          node applications/marketcloser/v0.1/real-review-run-authority-gate/v0.1/test-authority-gate.js
          node applications/marketcloser/v0.1/real-review-run-permit/v0.1/test-permit.js
          node applications/marketcloser/v0.1/real-review-run-permit/v0.1/test-receipt-binding.js
          node applications/marketcloser/v0.1/real-review-local-run-revalidation/v0.1/test-revalidation.js
          node applications/marketcloser/v0.1/real-review-local-run-revalidation/v0.1/test-receipt-binding.js

      - name: Re-run Real Stress-Test Adapter predecessor
        run: |
          node applications/marketcloser/v0.1/real-stress-test-adapter/v0.1/test-engine-parity.js
          node applications/marketcloser/v0.1/real-stress-test-adapter/v0.1/test-adapter.js
          node applications/marketcloser/v0.1/real-stress-test-adapter/v0.1/test-receipt-binding.js

      - name: Re-run Marketer Pessimist contract and analysis predecessors
        run: |
          python products/marketer-pessimist/v0.1/validate_contract.py
          node products/marketer-pessimist/v0.1/local-mvp/test-stress-test.js
          node products/marketer-pessimist/v0.1/local-mvp/test-receipt-binding.js
          node products/marketer-pessimist/v0.1/real-review-intake/v0.1/test-intake.js
          node products/marketer-pessimist/v0.1/real-review-intake/v0.1/test-candidate-binding.js
          grep -q '"REJECT"' products/marketer-pessimist/v0.1/product-contract.json
          grep -q '"CORRECT"' products/marketer-pessimist/v0.1/product-contract.json
          grep -q '"REQUEST_MORE_EVIDENCE"' products/marketer-pessimist/v0.1/product-contract.json
          grep -q '"ACCEPT_FOR_HUMAN_USE"' products/marketer-pessimist/v0.1/product-contract.json

      - name: Check disposition JavaScript syntax
        run: |
          node --check "$LAYER/disposition.js"
          node --check "$LAYER/receipt-binding.js"
          node --check "$LAYER/synthetic-positive-helper.js"
          node --check "$LAYER/test-disposition.js"
          node --check "$LAYER/test-receipt-binding.js"
          node --check "$LAYER/test-schema-runtime-parity.js"
          node --check "$LAYER/test-import-safe.js"

      - name: Validate committed waiting fixture
        run: node "$LAYER/disposition.js" validate "$FIXTURE"

      - name: Confirm committed fixture requires analysis result
        run: |
          node "$LAYER/disposition.js" receipt "$FIXTURE" > /tmp/marketcloser-disposition-wait-receipt.json
          node - <<'NODE'
          const r = require('/tmp/marketcloser-disposition-wait-receipt.json');
          if (r.classification !== 'ANALYSIS_RESULT_REQUIRED') throw new Error('committed fixture unexpectedly advanced');
          if (r.human_disposition_recorded !== false) throw new Error('committed fixture recorded disposition');
          if (r.claims.response_candidate_created !== false || r.claims.publication_authorized !== false) throw new Error('committed fixture overclaimed');
          NODE

      - name: Run human disposition conformance
        run: node "$LAYER/test-disposition.js"

      - name: Validate exact disposition source binding
        run: node "$LAYER/test-receipt-binding.js"

      - name: Validate schema runtime parity
        run: node "$LAYER/test-schema-runtime-parity.js"

      - name: Validate import safety
        run: node "$LAYER/test-import-safe.js"

      - name: Validate waiting and positive JSON Schemas
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          base = Path(os.environ['LAYER'])
          pairs = [
              (base / 'input.schema.json', Path(os.environ['FIXTURE'])),
              (base / 'receipt.schema.json', Path('/tmp/marketcloser-disposition-wait-receipt.json')),
              (base / 'input.schema.json', Path(os.environ['POS_INPUT'])),
              (base / 'receipt.schema.json', Path(os.environ['POS_RECEIPT'])),
          ]
          for schema_path, instance_path in pairs:
              schema = json.loads(schema_path.read_text(encoding='utf-8'))
              instance = json.loads(instance_path.read_text(encoding='utf-8'))
              Draft202012Validator(schema, format_checker=FormatChecker()).validate(instance)
              print(f'VALID schema: {instance_path}')
          PY

      - name: Validate CLI boundary
        run: |
          node "$LAYER/disposition.js" help >/dev/null
          node "$LAYER/disposition.js" validate "$FIXTURE" >/dev/null
          node "$LAYER/disposition.js" receipt "$FIXTURE" >/dev/null
          for command in accept reject correct approve publish respond send campaign provider mutate execute authorize permit; do
            if node "$LAYER/disposition.js" "$command" "$FIXTURE" >/tmp/forbidden.out 2>/tmp/forbidden.err; then
              echo "Forbidden imperative command unexpectedly succeeded: $command" >&2
              exit 1
            fi
          done

      - name: Guard production surface as local non-actuating disposition recorder
        run: |
          if grep -En "writeFile|appendFile|createWriteStream|child_process|exec\\(|spawn\\(|fetch\\(|http\\.|https\\.|net\\.|dgram|OpenAI|Anthropic" "$LAYER/disposition.js" "$LAYER/receipt-binding.js"; then
            echo 'Forbidden production mutation/network/provider surface detected' >&2
            exit 1
          fi

      - name: Confirm no completed analysis or human decision is committed
        run: |
          ! grep -R "matawaka-marketcloser-public-34a3.twc1.net" "$LAYER"
          ! grep -R '"analysis_receipt"[[:space:]]*:[[:space:]]*{' "$LAYER/examples"
          ! grep -R '"decision"[[:space:]]*:[[:space:]]*{' "$LAYER/examples"
          ! grep -R '"classification"[[:space:]]*:[[:space:]]*"ANALYSIS_ACCEPTED_FOR_HUMAN_USE"' "$LAYER/examples"

      - name: Confirm repository checkout unchanged
        run: test -z "$(git status --porcelain)"
