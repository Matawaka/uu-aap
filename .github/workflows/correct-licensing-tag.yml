name: Correct licensing checkpoint tag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Recreate exact licensing checkpoint tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: uu-aap-licensing-v0.1
          TARGET_SHA: 541d345432de851b198fa459cb33447c096aebe7
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository: ${REPOSITORY}"
          echo "Tag: ${TAG_NAME}"
          echo "Target: ${TARGET_SHA}"

          actual_target=$(gh api "repos/${REPOSITORY}/commits/${TARGET_SHA}" --jq '.sha')
          test "${actual_target}" = "${TARGET_SHA}"

          if gh api "repos/${REPOSITORY}/git/ref/tags/${TAG_NAME}" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${REPOSITORY}/git/refs/tags/${TAG_NAME}"
          fi

          gh api --method POST "repos/${REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG_NAME}" \
            -f sha="${TARGET_SHA}"

          resolved=$(gh api "repos/${REPOSITORY}/git/ref/tags/${TAG_NAME}" --jq '.object.sha')
          echo "Resolved tag SHA: ${resolved}"
          test "${resolved}" = "${TARGET_SHA}"

          echo "Tag correction verified."
