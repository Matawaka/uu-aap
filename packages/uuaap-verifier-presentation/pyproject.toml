[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uuaap-verifier-presentation"
version = "0.5.0"
description = "Reusable seven-dimension UU-AAP verifier presentation, bounded adapters, explicit candidate materialization and contestability overlay"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0 OR MIT"}
authors = [{name = "UU-AAP contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[tool.setuptools.packages.find]
where = ["src"]
